name: CD

# The full suite after every push, and the release (T-127, decision 48).
# ci.yml is the push gate itos push, itos ci watch and itos work done wait
# on, on Linux alone so it ends in a few minutes. This workflow starts on the
# same push, in parallel, as a run of its own: never called from ci.yml,
# which would keep that run open until this one ended, and never chained
# after it by workflow_run, which starts only once CI ends and runs in the
# default branch's context. It runs everything ci.yml ran before the split:
# the ci job, every Go test on Linux, macOS and Windows, every scenario
# through both drivers, the native T-80 and T-82 runs, and the languages
# shards; and since slice-32 the Dart scenarios with the real Flutter; and
# since T-188 the sample job's re-run of ten recorded mutation results; the
# test, languages, dart and sample jobs skipped when the scope job finds the
# range prose-only (T-122).
# On a push to main, once the ci, test, languages, dart and sample jobs pass,
# or the latter four were skipped as prose-only, the release job cuts the release in
# the same run (release.yml, T-28): the version from the commits since the
# last tag (tools/bin/release-version), each platform built on its own
# runner, the archives attested and published with their notes, or nothing
# when nothing calls for a release. This is the only workflow that cuts one,
# so a green ci.yml alone never publishes. A pushed tag starts nothing:
# release.yml's manual run is the fallback, for a tag or a commit whose run
# of this workflow on main passed.
# itos watches ci.yml alone; until itos#84 lets it watch a second workflow,
# the coordinator watches this run with gh run watch and hands a red one to
# a fresh agent as repair work.
on:
  push:
    branches: [main]
  pull_request:

# actions: read lets itos ci range find the last green runs of ci.yml and of
# this workflow.
permissions:
  contents: read
  actions: read

# The binary driver, TestFeatures, runs only where this is set (decision 52,
# T-153): locally the scenarios run in process against the fakes alone, and
# the built binary runs them here and in ci.yml. Every job has it, so every
# scenario still runs through the binary on every system.
env:
  ITOS_CC_FEATURES_BINARY_DRIVER: "1"

jobs:
  # ci.yml's ci job, run here too so the release still waits for the commit
  # rules and itos.yaml's plan (T-26, T-29), as it did when both were one
  # workflow: itos verify over the range from ci.yml's last green run, then
  # itos ci run over it, the static and late steps, the checks of the tasks
  # the range names and its merged scenario run, and the proof step of a
  # range touching itos.yaml's proof.code paths, one fresh mutation site of
  # its changed code (T-187), for which it has Node and the viewer's
  # packages as ci.yml's ci job has. Its range is ci.yml's, as itos.yaml's
  # ci.range says, so it judges what ci.yml's ci job judges.
  ci:
    runs-on: ubuntu-latest
    env:
      TO: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The viewer's packages, as nightly.yml installs them, for the proof
      # step of the plan (itos.yaml's proof.code, T-187): a viewer site it
      # draws runs its Vitest tests, and without node_modules every
      # viewer/src file reports a failing baseline.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install the viewer's packages
        working-directory: viewer
        run: npm ci
      # The itos launcher, which runs the release itos.yaml pins.
      - uses: donvargax/itos@d02a769a8ea00030f5b385c06428485c23063318 # v7.4.0
      - name: Range
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          out=$(itos ci range --json --head "$TO" --base "$BASE")
          from=$(jq -er '.from | strings' <<<"$out")
          echo "FROM=$from"
          echo "FROM=$from" >> "$GITHUB_ENV"
      - run: itos verify "$FROM" "$TO"
      - run: itos ci run "$FROM" "$TO"

  # Whether the range touches only prose, so the test and languages jobs can
  # skip it (T-122), asked of itos ci scope, the one rule for what is prose
  # (ci.prose.paths). The range starts at this workflow's own last green run,
  # not ci.yml's: a source commit whose run here failed or was cancelled
  # stays in the range of the pushes after it until a run here passes, so a
  # prose-only push never skips its tests and cuts a release of it. itos.yaml's
  # ci.range names ci.yml, so itos ci range reads a copy of it naming
  # cd.yml, written with the runner image's yq. No range to start from runs
  # everything.
  scope:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: donvargax/itos@d02a769a8ea00030f5b385c06428485c23063318 # v7.4.0
      - name: Scope
        id: scope
        env:
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          yq '.ci.range.github.workflow = "cd.yml"' itos.yaml > "$RUNNER_TEMP/itos-cd.yaml"
          out=$(itos --config "$RUNNER_TEMP/itos-cd.yaml" ci range --json --head "$TO" --base "$BASE")
          from=$(jq -er '.from | strings' <<<"$out")
          echo "FROM=$from"
          docs_only=false
          if [ -n "$from" ]; then
            out=$(itos ci scope --json "$from" "$TO")
            docs_only=$(jq -r 'if (.docs_only | type) == "boolean" then .docs_only else error("no docs_only") end' <<<"$out")
          fi
          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  # The tests on each system, every package of go test ./... in one of four
  # parts that run side by side (T-122): on windows-latest go test ./...
  # took 13.3 minutes, cmd/itos-cc alone 12.6 of them and features 7.7
  # (run 38911387674), so cmd/itos-cc's tests are split in two by name,
  # features is a part of its own, and the others part takes go vet, every
  # other package and the native scenario steps. The same parts on every
  # system, so each package runs on each system as it did. The only macOS
  # jobs of any workflow but the release's builds: four at once, under the
  # five GitHub runs at a time.
  # The features part's binary driver runs as many scenarios at once as the
  # runner has CPUs (T-128, features/README.md), four here on Ubuntu and
  # Windows and three on macOS, no setting of this workflow's: it took 17.5
  # to 18.1 minutes on Windows, 8.8 to 11.8 on macOS and 7.6 to 8 on Ubuntu
  # one scenario at a time (runs 39097433982, 39097875789, 39102423311),
  # and 9.5 and 12.8, 7.1 and 8.4, and 4.1 and 4 at once (runs 39113993739,
  # 39115097770).
  test:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    # Queued, never cancelled (T-201): a job already running finishes, and a
    # newer push's job waits, replacing only an older one still pending, so
    # under a burst of pushes a run still goes green and gives the scope job
    # its base again. Cancelling in progress (T-123) let each push cancel the
    # run before it, and no run finished while pushes kept coming. Per job,
    # not per workflow, as the release has its own group. The group names
    # cd, so no job of ci.yml's shares it.
    concurrency:
      group: cd-test-${{ github.ref }}-${{ matrix.os }}-${{ matrix.part }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        part: [cmd-a, cmd-b, features, others]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to commits, the same versions as itos's workflows.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - if: matrix.part == 'others'
        run: go vet ./...
      # 30 minutes, not go test's default 10: cmd/itos-cc's tests took about
      # 19 on windows-latest (T-6, T-15), 12.6 in run 38911387674. The limit
      # only guards against a hang; windows-test-speed and the parts above
      # are what bring that time down. cmd-a takes the tests whose names
      # start Test and A to E, about half the package's test time, and
      # cmd-b, with -skip on the same pattern, every other test, example
      # and fuzz seed, so each runs in exactly one of them.
      - if: matrix.part == 'cmd-a'
        run: go test -timeout 30m -run '^Test[A-E]' ./cmd/itos-cc
      - if: matrix.part == 'cmd-b'
        run: go test -timeout 30m -skip '^Test[A-E]' ./cmd/itos-cc
      - if: matrix.part == 'features'
        run: go test -timeout 30m ./features
      # Every package of ./... but the two the parts above test, listed by
      # go list so a new package is never left out.
      - name: Other packages
        id: packages
        if: matrix.part == 'others'
        shell: bash
        run: |
          module=$(go list -m)
          packages=$(go list ./... | grep -v -x -F -e "$module/cmd/itos-cc" -e "$module/features" | tr '\n' ' ')
          echo "$packages"
          echo "list=$packages" >> "$GITHUB_OUTPUT"
      - if: matrix.part == 'others'
        run: go test -timeout 30m ${{ steps.packages.outputs.list }}


      # T-80 native admission and owned-process behavior, independently of T-83.
      # Verbose steps and the structured report distinguish real native cases
      # from Godog's skipped-as-passed platform omissions; default timeout stays.
      - name: Native mutation ownership and fail-fast scenarios
        if: matrix.part == 'others'
        run: go test ./features -run '^TestFeatures$' -count=1 -v -scenarios='^@ID-MUT-(16[5-7]|18[7-9]|19[1-9]|20[0-2]|211|248)$' -scenario-report 'T80-native.json'
      - name: Preserve native mutation scenario observations
        if: always() && matrix.part == 'others'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; same pin as release.yml
        with:
          name: T80-native-${{ matrix.os }}
          path: features/T80-native.json
          if-no-files-found: error


      # T-82 snapshot storage, real overlapping collectors and root-relative paths.
      # Keep actual native execution/typed physical omissions in original JSON.
      - name: Native snapshot scenarios
        if: matrix.part == 'others'
        run: go test ./features -run '^TestFeatures$' -count=1 -v -scenarios='^@ID-SNAP-' -scenario-report 'T82-native.json'
      - name: Preserve native snapshot observations
        if: always() && matrix.part == 'others'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; same pin as release.yml
        with:
          name: T82-native-${{ matrix.os }}
          path: features/T82-native.json
          if-no-files-found: error

  # The real TypeScript, Python and Kotlin tools, so the language smoke
  # tests and the scenarios that need them (ID-MUT-208 to 210, 214, 216
  # to 218 and 220) run through them instead of skipping (T-13).
  # On ubuntu-latest alone, to bound CI time: elsewhere those tests
  # skip. A job of its own beside the test matrix, no longer a step run
  # after ubuntu-latest's go test (T-122): that step took 15.4 minutes, so
  # its commands are split into shards by their measured times, each
  # command and scenario selector in exactly one, each shard setting up
  # the tools its tests need, the Kotlin ones only where a Kotlin test or
  # scenario runs.
  # Each tool is pinned: Node's by testdata/tools/node's lockfile,
  # Python's by testdata/tools/python/requirements.txt, and the JDK,
  # Gradle and Maven here; the Kotlin fixtures pin their plugins.
  languages:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    # Queued, as for test (T-201): a running shard finishes, and a newer
    # push's shard replaces only one still pending.
    concurrency:
      group: cd-languages-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        # tests: the Go tests (3.8 minutes); scenarios-a and scenarios-b:
        # the scenarios of crap.feature, coverage.feature, cli.feature and
        # mutate.feature that need Node or Python, split by their times
        # (3.3 and 3.1); t78 and t79: the T-78 and T-79 families, 5 minutes
        # after the Go tests had warmed Gradle, 7.6 in one cold shard (run
        # 39039344923), so one shard each.
        include:
          - { shard: tests, kotlin: true }
          - { shard: scenarios-a, kotlin: true }
          - { shard: scenarios-b, kotlin: false }
          - { shard: t78, kotlin: true }
          - { shard: t79, kotlin: true }
    name: languages (${{ matrix.shard }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Gradle can prepend /usr/bin; select the other runtimes afterwards
      # so their pinned executables keep precedence over the image defaults.
      # "basic" caches Gradle downloads, the Kotlin plugin and JUnit.
      - if: matrix.kotlin
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.1"
          cache-provider: basic
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: testdata/tools/node/package-lock.json
      - working-directory: testdata/tools/node
        run: npm ci
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: testdata/tools/python/requirements.txt
      - run: python3 -m pip install -r testdata/tools/python/requirements.txt
      - if: matrix.kotlin
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          # The Kotlin Maven example's plugins and JUnit, between runs.
          cache: maven
          cache-dependency-path: cmd/itos-cc/mutate_kotlin_own_tests_test.go
      # Maven from Maven Central, checked against Apache's published SHA-512.
      - if: matrix.kotlin
        env:
          MAVEN_VERSION: "3.9.16"
          MAVEN_SHA512: 831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
        run: |
          archive="$RUNNER_TEMP/apache-maven-$MAVEN_VERSION-bin.tar.gz"
          curl -fsSL -o "$archive" "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$MAVEN_VERSION/apache-maven-$MAVEN_VERSION-bin.tar.gz"
          echo "$MAVEN_SHA512  $archive" | sha512sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$MAVEN_VERSION/bin" >> "$GITHUB_PATH"
      # Verbose, so the log lists each test that ran. ITOS_CC_LANGUAGE_TOOLS
      # makes a missing tool fail these tests instead of skipping them.
      - if: matrix.shard == 'tests'
        env:
          ITOS_CC_LANGUAGE_TOOLS: "1"
          ITOS_CC_NODE_MODULES: ${{ github.workspace }}/testdata/tools/node/node_modules
        run: |
          go test -count=1 -v -run '^(TestLanguageToolSmoke.*|TestASameSizePythonMutantWrittenWithinTheBaselinesSecondIsStillKilled|TestMeasuringAndJudgingAPythonProjectLeavesNoPytestCacheInItsTree|TestTypeScriptCoverageComesFromTheRelatedTestsThatJudgeTheMutants|TestACountedRunJudgesAProjectOfEachLanguageThroughItsInstalledToolsOffline|TestAPythonFilesOwnTestsAreTheTestsThatReachIt|TestAPythonMutantReachedOnlyThroughConftestIsJudgedByTheTestThatUsesTheFixture|TestAKotlinFilesOwnTestsAreTheTestClassesThatReachIt|TestATypeScriptTestScriptWithoutVitestOrJestRecordsWholeSuiteOutcomes|TestAStrictPythonRunProvesEveryExecutableLineOfEveryJudgedFunction|TestAStrictTypeScriptRunProvesEveryExecutableLineOfEveryJudgedFunction|TestAStrictKotlinRunProvesEveryExecutableLineOfEveryJudgedFunction|TestAStrictKotlinRunBuiltWithMavenProvesTheSameLines|TestAPythonChangeIsJudgedOnTheLinesItChangedNotTheOldCodeAroundThem|TestLinesAPythonTestReachesThroughASubprocessAreCovered|TestACoveragePyThatCannotMeasureSubprocessesIsAMissingCollector|TestLinesATypeScriptTestReachesThroughAChildNodeProcessAreCovered|TestLinesAKotlinTestReachesThroughAJVMItStartsAreCovered|TestAFileNoTestReachesReportsItsBaselineAsNotRun|TestACountedRunJudgesAnUnreachedFileByTheListedTestsThatReachIt|TestAPythonProjectThatWritesParallelCoverageDataIsMeasured)$' ./cmd/itos-cc
      # The godog scenarios of crap.feature, coverage.feature, cli.feature
      # and mutate.feature that need Node or Python, which every other job
      # skips (features/README.md), in two halves of the one selector they
      # had. The first keeps its run of the features package's other tests;
      # the second, like the T-78 and T-79 shards, runs TestFeatures alone. Every
      # scenario naming Kotlin, Gradle or Maven is in the first.
      - if: matrix.shard == 'scenarios-a'
        env:
          ITOS_CC_LANGUAGE_TOOLS: "1"
          ITOS_CC_NODE_MODULES: ${{ github.workspace }}/testdata/tools/node/node_modules
        run: |
          go test ./features -count=1 -v -scenarios='^@ID-(CRAP-(04|14)|COV-(02|05|07|10|12)|CLI-13|MUT-(07|1[124689]|7[1-5]|10[0125-8]|109|14[78]|145|13[89]|14[0-4]|146|242))$'
      - if: matrix.shard == 'scenarios-b'
        env:
          ITOS_CC_LANGUAGE_TOOLS: "1"
          ITOS_CC_NODE_MODULES: ${{ github.workspace }}/testdata/tools/node/node_modules
        run: |
          go test ./features -run '^TestFeatures$' -count=1 -v -scenarios='^@ID-MUT-(3[7-9]|4[01678]|50|5[7-9]|6[0-9]|8[34]|11[0-3]|2[89]|3[0-5]|5[2-6]|23[1-3]|23[5-9]|241|8[5-9]|9[0-9])$'
      - if: matrix.shard == 't78'
        env:
          ITOS_CC_LANGUAGE_TOOLS: "1"
          ITOS_CC_NODE_MODULES: ${{ github.workspace }}/testdata/tools/node/node_modules
        run: |
          go test ./features -run '^TestFeatures$' -count=1 -v -scenarios='^@ID-MUT-247$'
          # T-78 families stay bounded independently of the prior conversions.
          go test ./features -run '^TestFeatures$' -count=1 -v -scenarios='^@ID-MUT-(15[0-5]|203|204|206|213|215|219)$'
          go test ./features -run '^TestFeatures$' -count=1 -v -scenarios='^@ID-MUT-(205|207|208|218)$'
          go test ./features -run '^TestFeatures$' -count=1 -v -scenarios='^@ID-MUT-(209|210|214|216|217|220)$'
      - if: matrix.shard == 't79'
        env:
          ITOS_CC_LANGUAGE_TOOLS: "1"
          ITOS_CC_NODE_MODULES: ${{ github.workspace }}/testdata/tools/node/node_modules
        run: |
          # T-79 keeps Go, strict-language and subprocess startup bounded.
          go test ./features -run '^TestFeatures$' -count=1 -v -scenarios='^@ID-MUT-(15[6-9]|16[0-2]|164|225|226)$'
          go test ./features -run '^TestFeatures$' -count=1 -v -scenarios='^@ID-MUT-(163|22[1-4])$'
          go test ./features -run '^TestFeatures$' -count=1 -v -scenarios='^@ID-MUT-(228|229|230)$'

  # The Dart scenarios (slice-32, slice-34, slice-35, slice-36, slice-37),
  # which run the real flutter test: the Flutter apps, FVM SDK and pub
  # workspace of coverage.feature's slice-32 parts, mutate.feature's slice-34
  # Dart reach rows, slice-35 parts, slice-36 strict Dart coverage and
  # slice-37 counted runs, selected by their tags, as COV-05, COV-08, MUT-07
  # and MUT-209 hold other languages' rows this job has no tools for.
  # MUT-265 traces the connections of a mutation run with strace, installed
  # here when the image lacks it. On ubuntu-latest alone, as the languages
  # shards are: every other job skips them, the languages job
  # too, which sets ITOS_CC_LANGUAGE_TOOLS without installing Flutter, so
  # ITOS_CC_FLUTTER_TOOLS marks this one (features/binary.go).
  # The Flutter is the repository's own pin, the root .fvmrc fvm reads
  # locally, read here by flutter-fvm-config-action into flutter-action,
  # which caches the SDK and the pub cache the fixtures resolve from.
  # ITOS_CC_LANGUAGE_TOOLS makes a missing flutter fail these scenarios
  # instead of skipping them.
  dart:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    # Queued, as for test (T-201): a running job finishes, and a newer
    # push's job replaces only one still pending.
    concurrency:
      group: cd-dart-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: kuhnroyal/flutter-fvm-config-action/config@c378498f1d1962d33039c3989411093ef8a17b2c # v3.3
        id: fvm
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.fvm.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm.outputs.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter --version
      - run: command -v strace || { sudo apt-get update -qq && sudo apt-get install -y -qq strace; }
      - env:
          ITOS_CC_LANGUAGE_TOOLS: "1"
          ITOS_CC_FLUTTER_TOOLS: "1"
        run: go test ./features -run '^TestFeatures$' -count=1 -v -scenarios='^@(slice-32|slice-34|slice-35|slice-36|slice-37)$'

  # Ten recorded mutation results re-run on every source push (q-85, T-188):
  # itos-cc mutation sample draws ten of .metrics/mutate/'s fresh kills and
  # survivors, each re-run in the scope of the tests that decided it, and
  # fails with mutation.mismatch when an outcome differs from the one
  # recorded, run after run, or mutation.flaky when a re-run of a differing
  # one agrees (slice-50): tests deciding it differently with nothing
  # changed, fixed by making them deterministic, not by re-running. A kill whose function is unchanged stays fresh even when a
  # function it calls changes (the cache keys no kill on its callees,
  # decision 48), so a kill gone stale is caught within a push rather than
  # never. Sample's default seed, the HEAD commit, fixed per push, so a rerun
  # of the run draws the same ten. The itos-cc built from the pushed tree,
  # outside the work tree as nightly.yml builds it, with what any recorded
  # mutant needs as there: Node and the viewer's packages for a viewer
  # mutant's Vitest tests, and itos and jq for mutation.tests' list command,
  # which ubuntu-latest has. On Linux alone, as the nightly that records the
  # results runs; ci.yml stays fast, with no sample. Skipped when the scope
  # job finds the range prose-only.
  sample:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    # Queued, as for test (T-201): a running job finishes, and a newer
    # push's job replaces only one still pending.
    concurrency:
      group: cd-sample-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build itos-cc
        run: go build -o "$RUNNER_TEMP/itos-cc" ./cmd/itos-cc
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install the viewer's packages
        working-directory: viewer
        run: npm ci
      - uses: donvargax/itos@d02a769a8ea00030f5b385c06428485c23063318 # v7.4.0
      - name: Sample
        run: '"$RUNNER_TEMP/itos-cc" mutation sample --count 10'

  # The release, after everything above passed on this push: release.yml
  # releases this commit when its commits call for one, else ends green.
  # A prose-only range skips the test, languages, dart and sample jobs, and a
  # job needing a skipped one is skipped too, so the condition says what
  # passing is: ci passed, and test, languages, dart and sample passed or were skipped
  # because scope found the range prose-only. Its release then cuts
  # nothing, as before.
  release:
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.ci.result == 'success' && needs.scope.result == 'success'
      && (needs.test.result == 'success' || needs.test.result == 'skipped' && needs.scope.outputs.docs_only == 'true')
      && (needs.languages.result == 'success' || needs.languages.result == 'skipped' && needs.scope.outputs.docs_only == 'true')
      && (needs.dart.result == 'success' || needs.dart.result == 'skipped' && needs.scope.outputs.docs_only == 'true')
      && (needs.sample.result == 'success' || needs.sample.result == 'skipped' && needs.scope.outputs.docs_only == 'true')
    needs: [scope, ci, test, languages, dart, sample]
    # What release.yml's jobs ask for: the release and its assets, the OIDC
    # token Sigstore signs with, and the attestations.
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    # One release at a time, never cancelled: pushes in a row cut their
    # releases in order, and a run by hand waits for this one.
    concurrency:
      group: release
      cancel-in-progress: false
    uses: ./.github/workflows/release.yml
