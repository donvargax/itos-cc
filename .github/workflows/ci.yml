name: CI

# The push gate (T-127, decision 48): the run itos push, itos ci watch and
# itos work done wait on, on ubuntu-latest alone so it ends in a few
# minutes, showing the pushed work is mostly right. For every push to main
# and pull request: the ci job holds the pushed commits to itos's rules and
# runs itos.yaml's plan, ci.steps (T-29), its one scenario run the smoke set
# and the scenarios the range names through both drivers; the test job runs
# every package's Go tests, the in-process driver's whole suite among them,
# skipped when the scope job finds the push's range prose-only (T-122).
# Everything else is cd.yml's, which starts on the same push as a run of its
# own: the binary driver's whole suite, macOS and Windows, the native T-80
# and T-82 runs, the real language tools, and the release, so a green run of
# this workflow publishes nothing.
on:
  push:
    branches: [main]
  pull_request:

# actions: read lets itos ci range find the last green run of this workflow.
permissions:
  contents: read
  actions: read

# The binary driver, TestFeatures, runs only where this is set (decision 52,
# T-153): locally the scenarios run in process against the fakes alone, and
# the built binary runs them here and in cd.yml. Every job has it, so the ci
# job's merged run keeps the binary smoke set and the scenarios the range
# names.
env:
  ITOS_CC_FEATURES_BINARY_DRIVER: "1"

jobs:
  # The commit rules, held in CI as well as by the local hooks (T-26): itos
  # verify judges every commit from the last green run's head to this one,
  # itos ci range finding that start. A range, not the whole history, which
  # holds commits from before the rules (e3ccc36) that verify refuses. Then
  # the plan over the same range (T-29): itos ci run takes itos.yaml's
  # ci.steps in cost order, and the checks of the tasks the range's commits
  # name; a push touching only ci.prose.paths runs ci.prose.steps alone.
  # go-template-itos's ci job, with Go set up for the plan's go steps.
  # tools/bin/pinned fetches golangci-lint for architecture-check and checks
  # its SHA-256, and govulncheck is a Go tool of go.mod. A range touching
  # itos.yaml's proof.code paths also runs its check (T-187): one fresh
  # mutation site of the range's changed code, judged by the itos-cc built
  # from this tree, so the job has Node and the viewer's packages too.
  ci:
    runs-on: ubuntu-latest
    env:
      TO: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The viewer's packages, as nightly.yml installs them, for the proof
      # step of the plan (itos.yaml's proof.code, T-187): a viewer site it
      # draws runs its Vitest tests, and without node_modules every
      # viewer/src file reports a failing baseline.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install the viewer's packages
        working-directory: viewer
        run: npm ci
      # The viewer built as release.yml's viewer job builds the one a
      # release's binary embeds (slice-42), so a viewer that no longer type
      # checks or bundles fails this push gate, not the release after CD.
      # The packages are also what the plan's notices -check reads the
      # viewer's notices from.
      - name: Build the viewer
        working-directory: viewer
        run: npm run build
      # The itos launcher, which runs the release itos.yaml pins.
      - uses: donvargax/itos@d02a769a8ea00030f5b385c06428485c23063318 # v7.4.0
      - name: Range
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          out=$(itos ci range --json --head "$TO" --base "$BASE")
          from=$(jq -er '.from | strings' <<<"$out")
          echo "FROM=$from"
          echo "FROM=$from" >> "$GITHUB_ENV"
      - run: itos verify "$FROM" "$TO"
      - run: itos ci run "$FROM" "$TO"

  # Whether the push's range touches only prose, so the test job can skip
  # it (T-122): a take, queue or close commit changing only tasks/ ran the
  # whole matrix, about 22 minutes, for nothing it could break. The ci job's range, from itos ci range with the same head and
  # base, and itos ci scope's answer over it, the one rule for what is prose
  # (ci.prose.paths), never matched again here. No range to start from (no
  # green run) runs everything. Go is not set up: the launcher and git are
  # all it needs, so the tests start about as soon as they did.
  scope:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: donvargax/itos@d02a769a8ea00030f5b385c06428485c23063318 # v7.4.0
      - name: Scope
        id: scope
        env:
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          out=$(itos ci range --json --head "$TO" --base "$BASE")
          from=$(jq -er '.from | strings' <<<"$out")
          echo "FROM=$from"
          docs_only=false
          if [ -n "$from" ]; then
            out=$(itos ci scope --json "$from" "$TO")
            docs_only=$(jq -r 'if (.docs_only | type) == "boolean" then .docs_only else error("no docs_only") end' <<<"$out")
          fi
          echo "docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  # The Go tests of every package on Linux, in three parts side by side
  # (T-127): cmd/itos-cc's split in two by name as cd.yml splits it, its
  # TestScenarios, the in-process driver's whole suite, in cmd-b, and every
  # other package in others. The binary driver's whole suite, TestFeatures,
  # is left to cd.yml: here it runs only the smoke set and the scenarios the
  # range names, in the ci job's merged run. go vet is the ci job's. The
  # 30-minute limit, cd.yml's, only guards against a hang.
  # A newer push's run cancels this job of an older run on the same ref
  # (T-123); the group names ci, so no job of cd.yml's shares it.
  test:
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    concurrency:
      group: ci-test-${{ github.ref }}-${{ matrix.part }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        part: [cmd-a, cmd-b, others]
    runs-on: ubuntu-latest
    steps:
      # Pinned to commits, the same versions as itos's workflows.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - if: matrix.part == 'cmd-a'
        run: go test -timeout 30m -run '^Test[A-E]' ./cmd/itos-cc
      - if: matrix.part == 'cmd-b'
        run: go test -timeout 30m -skip '^Test[A-E]' ./cmd/itos-cc
      # Every package of ./... but cmd/itos-cc, listed by go list so a new
      # package is never left out, features's own tests among them.
      - name: Other packages
        id: packages
        if: matrix.part == 'others'
        run: |
          module=$(go list -m)
          packages=$(go list ./... | grep -v -x -F -e "$module/cmd/itos-cc" | tr '\n' ' ')
          echo "$packages"
          echo "list=$packages" >> "$GITHUB_OUTPUT"
      - if: matrix.part == 'others'
        run: go test -timeout 30m -skip '^TestFeatures$' ${{ steps.packages.outputs.list }}
