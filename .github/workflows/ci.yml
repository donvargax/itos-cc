name: CI

# Tests on Linux, macOS and Windows for every push and pull request. A pushed
# vX.Y.Z tag also builds each platform on its own runner, uploads the archives
# to a draft release, and publishes the release with checksums.txt once every
# archive is there. A run that fails leaves a draft, which a rerun reuses.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to commits, the same versions as itos's workflows.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go vet ./...
      # 30 minutes, not go test's default 10: cmd/itos-cc's tests take about
      # 19 on windows-latest (T-6, T-15). The limit only guards against a
      # hang; windows-test-speed is what brings that time down.
      - run: go test -timeout 30m ./...

      # The real TypeScript, Python and Kotlin tools, so the language smoke
      # tests and the scenarios that need them (ID-MUT-105 and 208 to 210)
      # run through them instead of skipping (T-13). On ubuntu-latest
      # alone, to bound CI time: elsewhere those tests skip. Installed after
      # the suite above, which runs as before.
      # Each tool is pinned: Node's by testdata/tools/node's lockfile,
      # Python's by testdata/tools/python/requirements.txt, and the JDK and
      # Gradle here; the Kotlin fixture pins its plugin.
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: testdata/tools/node/package-lock.json
      - if: matrix.os == 'ubuntu-latest'
        working-directory: testdata/tools/node
        run: npm ci
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: testdata/tools/python/requirements.txt
      - if: matrix.os == 'ubuntu-latest'
        run: python3 -m pip install -r testdata/tools/python/requirements.txt
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      # Puts Gradle on PATH and caches its downloads, the Kotlin plugin and
      # JUnit, between runs; "basic" is the open-source cache.
      - if: matrix.os == 'ubuntu-latest'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.1"
          cache-provider: basic
      # Verbose, so the log lists each test that ran. ITOS_CC_LANGUAGE_TOOLS
      # makes a missing tool fail these tests instead of skipping them.
      - if: matrix.os == 'ubuntu-latest'
        env:
          ITOS_CC_LANGUAGE_TOOLS: "1"
          ITOS_CC_NODE_MODULES: ${{ github.workspace }}/testdata/tools/node/node_modules
        run: go test -count=1 -v -run '^(TestLanguageToolSmoke.*|TestAFileNoTestLoadsMutatedAloneIsEntirelyUncovered|TestASameSizePythonMutantWrittenWithinTheBaselinesSecondIsStillKilled|TestMeasuringAndJudgingAPythonProjectLeavesNoPytestCacheInItsTree|TestTypeScriptCoverageComesFromTheRelatedTestsThatJudgeTheMutants|TestACountedRunJudgesAProjectOfEachLanguageThroughItsInstalledToolsOffline|TestAPythonFilesOwnTestsAreTheTestsThatReachIt)$' ./cmd/itos-cc

  draft:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes \
              "Experimental: commands, output, file formats, and exit codes may change in any release. Check a download with \`sha256sum --ignore-missing -c checksums.txt\`."

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, goarch: amd64 }
          - { os: ubuntu-24.04-arm, goos: linux, goarch: arm64 }
          - { os: macos-latest, goos: darwin, goarch: arm64 }
          - { os: macos-latest, goos: darwin, goarch: amd64, cc: "clang -arch x86_64" }
          - { os: windows-latest, goos: windows, goarch: amd64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      CGO_ENABLED: "1" # tree-sitter is C
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build
        env:
          MATRIX_CC: ${{ matrix.cc }}
        run: |
          [ -n "$MATRIX_CC" ] && export CC="$MATRIX_CC"
          flags="-s -w -X main.version=${TAG#v}"
          tags=""
          # Linux and Windows link statically, so the binary needs no libc or
          # MinGW DLLs; netgo and osusergo keep glibc's NSS out of a static link.
          case "$GOOS" in
            linux) tags="netgo,osusergo"; flags="$flags -linkmode=external -extldflags=-static" ;;
            windows) flags="$flags -linkmode=external -extldflags=-static" ;;
          esac
          exe=itos-cc; [ "$GOOS" = windows ] && exe=itos-cc.exe
          mkdir -p dist/pkg
          go build -trimpath -tags "$tags" -ldflags "$flags" -o "dist/pkg/$exe" ./cmd/itos-cc
          cp LICENSE README.md dist/pkg/
      - name: Check
        if: matrix.cc == ''
        run: dist/pkg/itos-cc version
      - name: Upload
        run: |
          name="itos-cc-${TAG#v}-$GOOS-$GOARCH"
          cd dist/pkg
          if [ "$GOOS" = windows ]; then
            7z a -tzip "../$name.zip" * >/dev/null
            archive="../$name.zip"
          else
            tar -czf "../$name.tar.gz" *
            archive="../$name.tar.gz"
          fi
          gh release upload "$TAG" "$archive" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - run: |
          mkdir assets && cd assets
          gh release download "$TAG" --pattern 'itos-cc-*'
          sha256sum itos-cc-* > checksums.txt
          cat checksums.txt
          gh release upload "$TAG" checksums.txt --clobber
          gh release edit "$TAG" --draft=false --latest
