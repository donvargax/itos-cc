name: CI

# For every push to main and pull request: the ci job holds the pushed
# commits to itos's rules and runs itos.yaml's plan, ci.steps (T-29), and
# the test job runs the tests on Linux, macOS and Windows.
# On a push to main, once the ci and test jobs pass, the release job
# cuts the release in the same run (release.yml, T-28): the version from the
# commits since the last tag (tools/bin/release-version), each platform built
# on its own runner, the archives attested and published with their notes, or
# nothing when nothing calls for a release. A pushed tag starts nothing:
# release.yml's manual run is the fallback, for a tag or a commit main's CI
# passed.
on:
  push:
    branches: [main]
  pull_request:

# actions: read lets itos ci range find the last green run of this workflow.
permissions:
  contents: read
  actions: read

jobs:
  # The commit rules, held in CI as well as by the local hooks (T-26): itos
  # verify judges every commit from the last green run's head to this one,
  # itos ci range finding that start. A range, not the whole history, which
  # holds commits from before the rules (e3ccc36) that verify refuses. Then
  # the plan over the same range (T-29): itos ci run takes itos.yaml's
  # ci.steps in cost order, and the checks of the tasks the range's commits
  # name; a push touching only ci.prose.paths runs ci.prose.steps alone.
  # go-template-itos's ci job, with Go set up for the plan's go steps.
  # tools/bin/pinned fetches golangci-lint for architecture-check and checks
  # its SHA-256, and govulncheck is a Go tool of go.mod.
  ci:
    runs-on: ubuntu-latest
    env:
      TO: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The itos launcher, which runs the release itos.yaml pins.
      - uses: donvargax/itos@d02a769a8ea00030f5b385c06428485c23063318 # v7.4.0
      - name: Range
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          out=$(itos ci range --json --head "$TO" --base "$BASE")
          from=$(jq -er '.from | strings' <<<"$out")
          echo "FROM=$from"
          echo "FROM=$from" >> "$GITHUB_ENV"
      - run: itos verify "$FROM" "$TO"
      - run: itos ci run "$FROM" "$TO"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to commits, the same versions as itos's workflows.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Gradle can prepend /usr/bin; select the other runtimes afterwards
      # so their pinned executables keep precedence over the image defaults.
      # "basic" caches Gradle downloads, the Kotlin plugin and JUnit.
      - if: matrix.os == 'ubuntu-latest'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.1"
          cache-provider: basic
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go vet ./...
      # 30 minutes, not go test's default 10: cmd/itos-cc's tests take about
      # 19 on windows-latest (T-6, T-15). The limit only guards against a
      # hang; windows-test-speed is what brings that time down.
      - run: go test -timeout 30m ./...

      # The real TypeScript, Python and Kotlin tools, so the language smoke
      # tests and the scenarios that need them (ID-MUT-208 to 210, 214, 216
      # to 218 and 220) run through them instead of skipping (T-13).
      # On ubuntu-latest alone, to bound CI time: elsewhere those tests
      # skip. Installed after the suite above, which runs as before.
      # Each tool is pinned: Node's by testdata/tools/node's lockfile,
      # Python's by testdata/tools/python/requirements.txt, and the JDK,
      # Gradle and Maven here; the Kotlin fixtures pin their plugins.
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: testdata/tools/node/package-lock.json
      - if: matrix.os == 'ubuntu-latest'
        working-directory: testdata/tools/node
        run: npm ci
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: testdata/tools/python/requirements.txt
      - if: matrix.os == 'ubuntu-latest'
        run: python3 -m pip install -r testdata/tools/python/requirements.txt
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          # The Kotlin Maven example's plugins and JUnit, between runs.
          cache: maven
          cache-dependency-path: cmd/itos-cc/mutate_kotlin_own_tests_test.go
      # Maven from Maven Central, checked against Apache's published SHA-512.
      - if: matrix.os == 'ubuntu-latest'
        env:
          MAVEN_VERSION: "3.9.16"
          MAVEN_SHA512: 831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
        run: |
          archive="$RUNNER_TEMP/apache-maven-$MAVEN_VERSION-bin.tar.gz"
          curl -fsSL -o "$archive" "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$MAVEN_VERSION/apache-maven-$MAVEN_VERSION-bin.tar.gz"
          echo "$MAVEN_SHA512  $archive" | sha512sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$MAVEN_VERSION/bin" >> "$GITHUB_PATH"
      # Verbose, so the log lists each test that ran. ITOS_CC_LANGUAGE_TOOLS
      # makes a missing tool fail these tests instead of skipping them. Then
      # the godog scenarios of crap.feature, coverage.feature, cli.feature
      # and mutate.feature that need Node or Python, which every other job
      # skips (features/README.md).
      - if: matrix.os == 'ubuntu-latest'
        env:
          ITOS_CC_LANGUAGE_TOOLS: "1"
          ITOS_CC_NODE_MODULES: ${{ github.workspace }}/testdata/tools/node/node_modules
        run: |
          go test -count=1 -v -run '^(TestLanguageToolSmoke.*|TestASameSizePythonMutantWrittenWithinTheBaselinesSecondIsStillKilled|TestMeasuringAndJudgingAPythonProjectLeavesNoPytestCacheInItsTree|TestTypeScriptCoverageComesFromTheRelatedTestsThatJudgeTheMutants|TestACountedRunJudgesAProjectOfEachLanguageThroughItsInstalledToolsOffline|TestAPythonFilesOwnTestsAreTheTestsThatReachIt|TestAPythonMutantReachedOnlyThroughConftestIsJudgedByTheTestThatUsesTheFixture|TestAKotlinFilesOwnTestsAreTheTestClassesThatReachIt|TestATypeScriptTestScriptWithoutVitestOrJestRecordsWholeSuiteOutcomes|TestAStrictPythonRunProvesEveryExecutableLineOfEveryJudgedFunction|TestAStrictTypeScriptRunProvesEveryExecutableLineOfEveryJudgedFunction|TestAStrictKotlinRunProvesEveryExecutableLineOfEveryJudgedFunction|TestAStrictKotlinRunBuiltWithMavenProvesTheSameLines|TestAPythonChangeIsJudgedOnTheLinesItChangedNotTheOldCodeAroundThem|TestLinesAPythonTestReachesThroughASubprocessAreCovered|TestACoveragePyThatCannotMeasureSubprocessesIsAMissingCollector|TestLinesATypeScriptTestReachesThroughAChildNodeProcessAreCovered|TestLinesAKotlinTestReachesThroughAJVMItStartsAreCovered|TestAFileNoTestReachesReportsItsBaselineAsNotRun|TestACountedRunJudgesAnUnreachedFileByTheListedTestsThatReachIt|TestAPythonProjectThatWritesParallelCoverageDataIsMeasured)$' ./cmd/itos-cc
          go test ./features -count=1 -v -scenarios='^@ID-(CRAP-(04|14)|COV-(02|05|07|10|12)|CLI-13|MUT-(07|1[124689]|4[78]|50|10[015]))$'

  # The release, after everything above passed on this push: release.yml
  # releases this commit when its commits call for one, else ends green.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci, test]
    # What release.yml's jobs ask for: the release and its assets, the OIDC
    # token Sigstore signs with, and the attestations.
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    # One release at a time, never cancelled: pushes in a row cut their
    # releases in order, and a run by hand waits for this one.
    concurrency:
      group: release
      cancel-in-progress: false
    uses: ./.github/workflows/release.yml
