name: Nightly

# Mutation testing over the whole repository, too slow for every push. Each
# Go mutant runs its own package's tests and, if it survives them, the
# in-process scenarios listed in itos-cc.yaml's mutation.tests that reach its
# line (decision 49, T-46), so a kill rests on the spec. Killed mutants are
# cached in .metrics/mutate/, which is committed back to main so
# the next night, and everyone's local runs, reuse the kills of unchanged
# functions instead of starting over. itos-cc mutation run exits 1 when any
# mutant survives, which is most nights: the job then ends red, and the
# results are committed anyway. A run cut off before it finishes keeps what
# it judged and commits that too, under a subject that says it is partial
# (T-46), so the job's colour never has to say how far the run got.
on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC, 2am Pacific
  workflow_dispatch:

# Two runs never overlap: the second waits for the first, so it starts from
# the results the first committed.
concurrency:
  group: nightly-mutate
  cancel-in-progress: false

# The binary driver, TestFeatures, runs only where this is set (decision 52,
# T-153), which every workflow sets. No mutant here runs it: features/ is
# excluded from mutation and TestFeatures is no other package's own test.
env:
  ITOS_CC_FEATURES_BINARY_DRIVER: "1"

jobs:
  mutate:
    runs-on: ubuntu-latest
    # GitHub's own limit for a hosted job, written out: the Mutate step's
    # deadline below is set under it, so the commit step always has time.
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      # Pinned to the same commits as ci.yml. Full history, so the commit
      # step can rebase onto a main that moved during the run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Outside the work tree, so the binary is neither mutated nor copied
      # into the workers' private copies of the project.
      - name: Build itos-cc
        run: go build -o "$RUNNER_TEMP/itos-cc" ./cmd/itos-cc

      # The viewer's packages, so Mutate can run its Vitest tests and measure
      # their coverage: without node_modules every viewer/src file reports a
      # failing baseline and none of its mutants is judged.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install the viewer's packages
        working-directory: viewer
        run: npm ci

      # mutation.tests' list command runs itos tests list and reads its JSON
      # with tools/bin/listed-scenarios, through go run. The itos launcher, pinned as in
      # ci.yml, runs the release itos.yaml pins.
      - uses: donvargax/itos@d02a769a8ea00030f5b385c06428485c23063318 # v7.4.0

      # Fails the job as it exits. With no path, mutation run judges every
      # source of the repository that itos-cc.yaml's exclude leaves in; with
      # no --all-tests, a survivor of its own tests runs the listed scenarios
      # that reach its line, every scenario having run once first for its
      # coverage. --no-annotate: no committed source carries the summary
      # comment, and the job must not rewrite the sources.
      # timeout interrupts the run with SIGINT after 330 minutes, well before
      # the job's 360, and mutation run keeps what it finished when
      # interrupted, writing each file it judged (README, mutation run);
      # --kill-after ends it should it not stop within 10 minutes. The exit
      # status goes to the commit step, which words its subject by it: 0 or 1
      # is a run that finished over the whole repository, anything else
      # (timeout's 124, a kill, an interrupt's 130) one that was cut off.
      # timeout-minutes is the runner's backstop behind timeout's own.
      - name: Mutate
        id: mutate
        timeout-minutes: 345
        run: |
          set +e
          timeout --signal=INT --kill-after=10m 330m \
            "$RUNNER_TEMP/itos-cc" mutation run --no-annotate
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "mutation run ended with exit status $status."
          exit "$status"

      # Runs whether Mutate passed, failed or was cut off, even in a
      # cancelled run, so a night with survivors still stores its kills and
      # one cut short stores what it judged. Its own success never turns the
      # job green. The subject says how far the run got (T-46): the whole
      # repository only when mutation run itself exited 0 or 1.
      - name: Commit .metrics/mutate/
        if: ${{ always() }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STATUS: ${{ steps.mutate.outputs.status }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Not on main ($GITHUB_REF): the results are not committed."
            exit 0
          fi
          git add -- .metrics/mutate/
          if git diff --cached --quiet; then
            echo "No change under .metrics/mutate/."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          case "$STATUS" in
            0 | 1)
              subject="chore: record the nightly mutation results"
              how="It finished over the whole repository"
              ;;
            *)
              subject="chore: record partial nightly mutation results"
              how="It was cut off before it finished (exit status ${STATUS:-unknown}), so this is what it judged"
              ;;
          esac
          echo "$subject"
          cat > "$RUNNER_TEMP/message" <<EOF
          $subject

          The nightly run of itos-cc mutation run updated .metrics/mutate/.
          $how.
          Committing it lets the next run, and local runs, reuse the kills of
          functions that have not changed instead of starting over. It is
          committed whether or not mutants survived; the run says which:
          $RUN_URL

          Task: T-3
          EOF
          git commit --quiet -F "$RUNNER_TEMP/message"
          git log -1 --stat
          # Main may have moved during the run: rebase onto it and push, and
          # try again if it moved once more in between.
          for attempt in 1 2 3; do
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort || true
              echo "::error::Rebasing the results onto origin/main failed."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the results after 3 attempts."
          exit 1
