name: Release

# The release, cut by CD (T-28, T-127): cd.yml calls this on a push to main,
# after its ci, test and languages jobs pass on every system, in the same
# run, so nothing is tested twice. ci.yml, the Linux push gate, never calls
# it (decision 48).
#
# Harvested from go-template-itos's .github/workflows/release.yml, which took
# it from itos's, keeping its version, notes, attestation and publishing, and
# its upstream identities (the actions and the itos release it runs). What
# differs is how the archives are built: itos-cc links tree-sitter through cgo,
# so GoReleaser's CGO_ENABLED=0 cross-build from one Linux runner cannot build
# it, and GoReleaser's open-source edition cannot pack binaries it did not
# build (its prebuilt builder is a Pro feature), nor merge builds made on
# several runners. So each of the five archives, Linux and macOS on amd64 and
# arm64 and Windows on amd64, is built on its own runner, as T-22's build job
# built them, and the publish job gathers them. .goreleaser.yaml is the
# template's and is not used.
#
# It releases when the commits since the last vX.Y.Z tag carry a feat, a fix
# or a breaking change, or the binary is built from other modules or another Go
# toolchain than the last release was. The tag is the version, computed from
# those commits (tools/bin/release-version): a breaking change a major (a minor
# before 1.0), a feat a minor, a fix a patch; with none, a patch when the
# modules ./cmd/itos-cc links or go.mod's toolchain moved; else nothing is
# released and the run ends green. A commit some release tag already holds is
# not released again, so a release cut by hand and the automatic one never cut
# the same version.
#
# In order:
#   1. version: the version, from the commit this run is for; nothing more when
#      there is none;
#   2. viewer: the architecture viewer built once from viewer/ (npm ci, then
#      npm run build, which type checks and bundles), its dist handed on as
#      an artifact, so every archive's binary carries the same bytes and one
#      runner alone needs Node (slice-42);
#   3. build: on each platform's runner, the viewer copied into server/ui,
#      which the binary embeds and serve serves at /, then the binary stamped
#      with the version (-X internal/version.stamp), Linux's linked
#      statically against musl and proved static, checked, served from an
#      empty folder to prove / holds the viewer and /api/graph answers, packed
#      with LICENSE, THIRD_PARTY_NOTICES (the license and notice texts of
#      every compiled-in module, of the toolchain's Go, musl and MinGW-w64
#      and of the viewer's npm packages, which tools/bin/notices writes) and
#      README.md as itos-cc-<version>-<os>-<arch>.tar.gz (.zip for Windows),
#      and handed on as an artifact;
#   4. publish: the five archives gathered and checksums.txt written; a draft
#      release holding all six, its target this commit, replacing any draft a
#      failed run left; the archives attested (Sigstore, no keys; `gh
#      attestation verify <file> -R donvargax/itos-cc` checks one), which
#      needs a public repository, as this one is; the notes
#      (tools/bin/release-notes: why the version is what it is, git-cliff over
#      the range, every BREAKING-CHANGE and Upgrading footer quoted); and the
#      draft published with them, which is when GitHub creates the tag, so the
#      tag and a release holding every asset appear together. A run that fails
#      before leaves no tag, only a draft the next run replaces; a tag is never
#      moved.
# The releaser never commits: the notes are the release's description, not a
# file.
#
# By hand (workflow_dispatch), a fallback not meant to be needed: the release
# of a given tag, or of a commit, its version computed as above, published only
# when main's CD, cd.yml, passed on exactly that commit (T-22's check); a green
# ci.yml run is not enough, as it ran the tests on Linux alone.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      ref:
        description: A vX.Y.Z tag, or a commit main's CD passed, to release
        required: true
        type: string

permissions:
  contents: read

# One release at a time, never cancelled. Called from cd.yml, its release job
# holds the release group, so this group is the run's own; run by hand, this
# takes the release group itself.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'release' || format('release-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    # actions: read, for a run by hand to find main's CD run of its commit.
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      last: ${{ steps.version.outputs.last }}
    steps:
      # Every action pinned to a commit, as ci.yml and cd.yml pin them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags and the commits since the last one
      # go list reads what the binary is built from, at the last release and
      # at this commit.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The commit this run releases: the pushed one, or the tag or commit
      # given by hand.
      - name: Commit
        id: commit
        env:
          REF: ${{ inputs.ref }}
        run: |
          sha=$GITHUB_SHA
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            sha=$(git rev-parse --verify --quiet "$REF^{commit}") || {
              echo "::error::$REF names no tag or commit of this repository"
              exit 1
            }
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # Run by hand, T-22's check: the commit was tested when it was pushed to
      # main, and testing it again proves nothing new. One main's CD did not
      # pass, or never ran on, cannot publish; cd.yml's run, not ci.yml's,
      # which tests on Linux alone. A run still going is waited for. Called
      # from cd.yml, the run is main's CD itself, past its tests.
      - name: Require a green main CD run of this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          run=$(gh api "repos/$GH_REPO/actions/workflows/cd.yml/runs?head_sha=$SHA&branch=main&event=push&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [ -z "$run" ]; then
            echo "::error::main's CD never ran on $SHA; release a commit main's CD passed"
            exit 1
          fi
          gh run watch "$run" --exit-status >/dev/null || true
          conclusion=$(gh api "repos/$GH_REPO/actions/runs/$run" --jq .conclusion)
          if [ "$conclusion" != success ]; then
            echo "::error::main's CD run $run on $SHA ended $conclusion; release a commit main's CD passed"
            exit 1
          fi
          echo "main's CD passed on $SHA: https://github.com/$GH_REPO/actions/runs/$run"
      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          releases() { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && tag=$(git tag --points-at "$SHA" | releases | sort -V | tail -n 1) && [ -n "$tag" ]; then
            # A tag on the commit, pushed by hand: released as it is, the notes
            # from the release before it.
            if [ "$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq .draft 2>/dev/null)" = false ]; then
              echo "::error::$tag is released already"
              exit 1
            fi
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "release-version: $SHA carries $tag, released as it is"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && held=$(git tag --contains "$SHA" | releases | sort -V | head -n 1) && [ -n "$held" ]; then
            echo "release-version: $SHA is in $held already: nothing to release"
            exit 0
          fi
          # release-version reads HEAD: this workflow's release-version, run in
          # a worktree of the commit.
          go build -o "$RUNNER_TEMP/release-version" ./tools/bin/release-version
          git worktree add --quiet --detach "$RUNNER_TEMP/commit" "$SHA"
          (cd "$RUNNER_TEMP/commit" && "$RUNNER_TEMP/release-version") > "$RUNNER_TEMP/version.txt"
          cat "$RUNNER_TEMP/version.txt"
          next=$(sed -n 's/^next=//p' "$RUNNER_TEMP/version.txt")
          last=$(sed -n 's/^last=//p' "$RUNNER_TEMP/version.txt")
          [ -n "$next" ] || exit 0
          # Never moved: a tag of this version on another commit stops the run.
          if at=$(git rev-parse --verify --quiet "refs/tags/v$next^{commit}"); then
            echo "::error::v$next already tags $at, not $SHA; a tag is never moved"
            exit 1
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "last=$last" >> "$GITHUB_OUTPUT"

  # The viewer a release's binary embeds (slice-42), built once: vite's
  # build is deterministic from the lockfile, so the five archives carry the
  # same bytes. Node 24 and the setup-node pin ci.yml, cd.yml and
  # nightly.yml use.
  viewer:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Build
        working-directory: viewer
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viewer-dist
          path: viewer/dist
          if-no-files-found: error

  build:
    needs: [version, viewer]
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, goarch: amd64 }
          - { os: ubuntu-24.04-arm, goos: linux, goarch: arm64 }
          - { os: macos-latest, goos: darwin, goarch: arm64 }
          - { os: macos-latest, goos: darwin, goarch: amd64, cc: "clang -arch x86_64" }
          - { os: windows-latest, goos: windows, goarch: amd64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CGO_ENABLED: "1" # tree-sitter is C
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # Linux links musl (MIT), not glibc, whose LGPL-2.1 asks a static link
      # for relink materials (q-81, T-176): musl-gcc from Ubuntu's
      # musl-tools, on each Linux runner natively, amd64 and arm64 alike, so
      # no cross toolchain. Ubuntu 24.04's is musl 1.2.4, whose COPYRIGHT
      # tools/bin/notices/toolchain holds.
      - name: musl
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends musl-tools
          dpkg-query -W musl-tools musl-dev
          command -v musl-gcc
      # The viewer job's dist, into the folder the binary embeds: the
      # repository holds only its .gitignore there, which ignores what is
      # copied in, so the build still reads a clean tree.
      - name: Viewer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: viewer-dist
          path: server/ui
      - name: Build
        env:
          MATRIX_CC: ${{ matrix.cc }}
        run: |
          [ -n "$MATRIX_CC" ] && export CC="$MATRIX_CC"
          flags="-s -w -X github.com/donvargax/itos-cc/internal/version.stamp=$VERSION"
          # Linux and Windows link statically, so the binary needs no libc or
          # MinGW DLLs: Linux against musl, whose getaddrinfo and getpwnam
          # link statically with no NSS modules to load, so no netgo or
          # osusergo tags are needed, as they were with glibc.
          case "$GOOS" in
            linux) export CC=musl-gcc; flags="$flags -linkmode=external -extldflags=-static" ;;
            windows) flags="$flags -linkmode=external -extldflags=-static" ;;
          esac
          exe=itos-cc; [ "$GOOS" = windows ] && exe=itos-cc.exe
          mkdir -p dist/pkg
          go build -trimpath -ldflags "$flags" -o "dist/pkg/$exe" ./cmd/itos-cc
          cp LICENSE THIRD_PARTY_NOTICES README.md dist/pkg/
      # The Linux binary links nothing at run time, so it runs on any Linux:
      # file says it is statically linked, and on amd64 it runs in an Alpine
      # container, which has no glibc. Any failure stops the release.
      - name: Static
        if: matrix.goos == 'linux'
        run: |
          set -euo pipefail
          said=$(file dist/pkg/itos-cc)
          echo "$said"
          case "$said" in
            *"statically linked"*) ;;
            *) echo "::error::the Linux binary is not statically linked"; exit 1 ;;
          esac
          if [ "$GOARCH" = amd64 ]; then
            docker run --rm -v "$PWD/dist/pkg:/x:ro" alpine:3.23.4@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11 /x/itos-cc --version
          fi
      # The binary says the version it was stamped with; the darwin amd64 one,
      # built on an arm64 runner, is not run.
      - name: Check
        if: matrix.cc == ''
        run: |
          said=$(dist/pkg/itos-cc version)
          echo "$said"
          [ "$said" = "itos-cc $VERSION" ]
      # The binary serves the viewer it embeds: serve over an empty folder,
      # once it says it serves, answers / with the viewer's index.html and
      # /api/graph with the graph; the darwin amd64 one is not run. Each
      # check on a line of its own, as an && chain would hide a failure from
      # errexit. Any failure stops the release.
      - name: Serve
        if: matrix.cc == ''
        run: |
          set -euo pipefail
          empty=dist/empty
          log=dist/serve.log
          mkdir -p "$empty"
          dist/pkg/itos-cc serve --port 7070 --interval 1h "$empty" 2>"$log" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 60); do
            if grep -q '^itos-cc: serving ' "$log"; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$log"
              echo "::error::serve ended before it served"
              exit 1
            fi
            sleep 1
          done
          if ! grep -q '^itos-cc: serving ' "$log"; then
            cat "$log"
            echo "::error::serve did not serve within 60 seconds"
            exit 1
          fi
          page=$(curl -sSf http://127.0.0.1:7070/)
          case "$page" in
            *'<div id="root"></div>'*) echo "/ serves the viewer" ;;
            *) echo "$page"; echo "::error::/ does not serve the viewer"; exit 1 ;;
          esac
          curl -sSf -o /dev/null http://127.0.0.1:7070/api/graph
          echo "/api/graph answers"
      - name: Pack
        id: pack
        run: |
          name="itos-cc-$VERSION-$GOOS-$GOARCH"
          cd dist/pkg
          if [ "$GOOS" = windows ]; then
            7z a -tzip "../$name.zip" itos-cc.exe LICENSE THIRD_PARTY_NOTICES README.md >/dev/null
            echo "archive=dist/$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "../$name.tar.gz" itos-cc LICENSE THIRD_PARTY_NOTICES README.md
            echo "archive=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: itos-cc-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.pack.outputs.archive }}
          if-no-files-found: error
          compression-level: 0 # already compressed

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    # The only job given write access: the release and its assets, the OIDC
    # token Sigstore signs with, and the attestations.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.version.outputs.sha }}
      VERSION: ${{ needs.version.outputs.version }}
      LAST: ${{ needs.version.outputs.last }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the range the notes describe
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The global itos, for the notes' Upgrading footers (itos commit footers);
      # itos.yaml's pin chooses the itos that runs.
      - uses: donvargax/itos@d02a769a8ea00030f5b385c06428485c23063318 # v7.4.0
      # The GitHub CLI, to make and publish the draft: pinned from its release
      # tarball and checked against its SHA-256, as itos installs it, so the
      # runner's own copy does not decide what runs.
      - name: GitHub CLI
        env:
          GH_VERSION: 2.101.0
          GH_SHA256: 9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          tgz="$RUNNER_TEMP/gh.tar.gz"
          curl -sSfL -o "$tgz" "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "$GH_SHA256  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" "gh_${GH_VERSION}_linux_amd64/bin/gh"
          mv "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin/gh" "$RUNNER_TEMP/bin/gh"
          rm -rf "$tgz" "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gh" --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: itos-cc-*
          merge-multiple: true
          path: dist/release
      # checksums.txt lists every archive by name and SHA-256, in sha256sum's
      # format: what a download is checked against, and the attestation's
      # subjects.
      - name: Checksums
        working-directory: dist/release
        run: |
          set -euo pipefail
          ls -l
          set -- itos-cc-*
          [ $# -eq 5 ] || { echo "::error::$# archives, not the five"; exit 1; }
          sha256sum itos-cc-* > checksums.txt
          cat checksums.txt
      # Any draft of this tag a failed run left is replaced; a published
      # release of it stops the run, its tag never moved. The draft's tag is
      # not created yet: GitHub creates it at the target when the draft is
      # published.
      - name: Draft
        run: |
          set -euo pipefail
          if [ "$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .draft 2>/dev/null)" = false ]; then
            echo "::error::$TAG is released already"
            exit 1
          fi
          for id in $(gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id"); do
            echo "replacing the draft $id a failed run left"
            gh api -X DELETE "repos/$GH_REPO/releases/$id"
          done
          gh release create "$TAG" --draft --target "$SHA" --title "$TAG" \
            --notes "Being cut by $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID; a draft left here is replaced by the next run." \
            dist/release/itos-cc-* dist/release/checksums.txt
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/release/checksums.txt
      - name: Notes
        run: |
          set -euo pipefail
          go run ./tools/bin/release-notes -version "$VERSION" ${LAST:+-from "$LAST"} -to "$SHA" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
      # The six assets checked on the draft before it is published, since its
      # publishing is what makes the tag.
      - name: Publish
        run: |
          set -euo pipefail
          held=$(gh release view "$TAG" --json assets --jq '.assets | length')
          [ "$held" -eq 6 ] || { echo "::error::the draft of $TAG holds $held assets, not 6"; exit 1; }
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --draft=false --latest
          echo "published $GITHUB_SERVER_URL/$GH_REPO/releases/tag/$TAG"
