version: "2"
linters:
  default: standard
  enable:
    - depguard
    - gochecksumtype
    - gosec
    - revive
  settings:
    # Harvested from github.com/donvargax/itos-template/.golangci.yml with
    # owner MIT permission (CONTRIBUTORS.md). The ports' failures are sealed
    # sets (//sumtype:decl), and internal/cli gives each kind its exit code
    # in one switch per set (docs/CLI.md rule 32): a switch that leaves a
    # kind out is refused, and a default case does not count as naming them.
    # tools/bin/architecture-check proves it with compile-valid fixtures.
    gochecksumtype:
      default-signifies-exhaustive: false
    # Layer/production-I/O/mock rules harvested from
    # github.com/donvargax/itos-template/.golangci.yml with owner MIT
    # permission (CONTRIBUTORS.md), adapted to this module and layout.
    # tools/bin/architecture-check proves these with compile-valid fixtures.
    # The arrows are decision 29's: the domain and its ports reach the outside
    # only through adapters implementing the ports, an adapter imports
    # nothing of ours but the ports, a slice imports no other slice, and kong
    # stays in cmd and internal/cli. Each desc tells the reader of a refusal
    # what it means and, where a new package caused it, to extend the rules
    # as docs/go.md's Adding a package says rather than loosen them.
    depguard:
      rules:
        # The domain and its ports, their tests too: nothing of ours but the
        # domain and its port subpackages (no adapter, slice, UI or cmd); the
        # kong rule below keeps kong out of it. Its tests run it against
        # porttest's fakes. domain-coverage reads this list: each glob's
        # folder is a domain package it measures (./internal/counting), its
        # port subpackages not measured, so the floor holds behaviour, not
        # the ports and fakes.
        domain:
          list-mode: lax
          files:
            - "**/internal/counting/**"
          allow:
            - github.com/donvargax/itos-cc/internal/counting$
            - github.com/donvargax/itos-cc/internal/counting/
          deny:
            - pkg: github.com/donvargax/itos-cc
              desc: "the domain imports no adapter, slice, UI or cmd (decision 29): reach the outside through its port; if this is another domain package, extend the rules as docs/go.md's Adding a package says, never loosen this one"
        # The domain's own code does no I/O: no os (os/exec with it) and no
        # net. Its tests may read a fixture.
        domain-io:
          files:
            - "**/internal/counting/**"
            - "!$test"
          deny:
            - pkg: os
              desc: "the domain does no I/O (decision 29): do the I/O in an adapter behind internal/counting/port, adding it as docs/go.md's Adding a package says; tests may read fixtures. Never loosen this one"
            - pkg: net
              desc: "the domain does no I/O (decision 29): reach networks from an adapter behind internal/counting/port, adding it as docs/go.md's Adding a package says; never loosen this one"
        # A slice is a command, in one package named for it: its kong struct
        # and Run (UI), its Query and Handler (application). It imports
        # nothing of ours but the domain, its ports and internal/cli: no other
        # slice, no adapter (cmd wires them in) and no cmd. Every package
        # under internal is a slice but those excluded here, the domain, the
        # adapters and the packages that are no command, so a new command's
        # slice is held with no edit to this rule; a new domain or adapter
        # package is excluded here as it is listed in its own rule. A rule
        # cannot tell a slice's own import from another's, so a slice's tests
        # are in its own package and need no import of it.
        slices:
          list-mode: lax
          files:
            - "**/internal/**"
            - "!**/internal/counting/**" # the domain and its ports
            - "!**/internal/disk/**" # an adapter, held by infra
            - "!**/internal/stdin/**" # an adapter, held by infra
            - "!**/internal/cli/**" # the UI the slices share
            - "!**/internal/version/**" # what cmd says the build is
            - "!**/internal/release/**" # the release tools' library
          allow:
            - github.com/donvargax/itos-cc/internal/counting$
            - github.com/donvargax/itos-cc/internal/counting/
            - github.com/donvargax/itos-cc/internal/cli$
          deny:
            - pkg: github.com/donvargax/itos-cc
              desc: "a slice imports only the domain, its ports and internal/cli (decision 29); if this package is a domain package or an adapter, not a command, extend the rules as docs/go.md's Adding a package says, never loosen this one"
        # An adapter implements the ports and imports nothing of ours but
        # them: not the domain, another adapter, a slice, the UI or porttest's
        # fakes, which its tests alone may use. Each adapter is listed, and
        # excluded from the slices above. cmd hands internal/stdin the disk
        # adapter as its fallback.
        infra:
          list-mode: lax
          files:
            - "**/internal/disk/**"
            - "**/internal/stdin/**"
            - "!$test"
          allow:
            - github.com/donvargax/itos-cc/internal/counting/port$
          deny:
            - pkg: github.com/donvargax/itos-cc
              desc: "an adapter imports nothing of ours but the ports it implements (decision 29), cmd wiring the rest; if it implements another port, extend the rules as docs/go.md's Adding a package says, never loosen this one"
        mocks:
          files:
            - $all
          deny:
            - pkg: github.com/golang/mock
              desc: "no mocking library: write an in-memory fake or stub of the port in its porttest package, as internal/counting/port/porttest does"
            - pkg: go.uber.org/mock
              desc: "no mocking library: write an in-memory fake or stub of the port in its porttest package, as internal/counting/port/porttest does"
            - pkg: github.com/stretchr/testify/mock
              desc: "no mocking library: write an in-memory fake or stub of the port in its porttest package, as internal/counting/port/porttest does"
            - pkg: github.com/vektra/mockery
              desc: "no mocking library: write an in-memory fake or stub of the port in its porttest package, as internal/counting/port/porttest does"
            - pkg: github.com/maxbrunsfeld/counterfeiter
              desc: "no mocking library: write an in-memory fake or stub of the port in its porttest package, as internal/counting/port/porttest does"
        # Properties are unit tests of the domain: rapid comes in only in the
        # domain package's own tests, not its code, its ports or porttest.
        rapid:
          files:
            - $all
            - "!**/internal/counting/*_test.go"
          deny:
            - pkg: pgregory.net/rapid
              desc: "rapid is only for the domain's property tests, in internal/counting's own tests; test anything else with ordinary tests and porttest's fakes"
        # kong is the UI's, harvested from itos-template's kong rule: here
        # the UI is the entry point and internal/cli. A slice's kong struct
        # carries kong's struct tags, which need no import of kong.
        kong:
          files:
            - $all
            - "!**/cmd/**"
            - "!**/internal/cli/**"
          deny:
            - pkg: github.com/alecthomas/kong
              desc: "kong stays in the UI, cmd and internal/cli (decision 29): a slice's struct tags need no import of it; never loosen this one"
    revive:
      rules:
        - name: file-length-limit
          arguments:
            - max: 600
              skipComments: true
              skipBlankLines: true
  exclusions:
    rules:
      - path: _test\.go$
        linters: [gosec]
formatters:
  enable:
    - gofmt
