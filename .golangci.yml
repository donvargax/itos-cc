version: "2"
issues:
  # Report every finding in one CI attempt; keep all checks and failure exits.
  max-same-issues: 0
  max-issues-per-linter: 0
linters:
  default: standard
  enable:
    # Decision 30: a context carries cancellation and deadlines only, always as
    # the first parameter, never held in a struct; containedctx refuses a
    # struct field of it, revive's context-as-argument a context after any
    # other parameter. tools/bin/architecture-check proves both refuse.
    - containedctx
    - depguard
    - gochecksumtype
    - gosec
    - revive
  settings:
    # Harvested from github.com/donvargax/itos-template/.golangci.yml with
    # owner MIT permission (CONTRIBUTORS.md). The ports' failures are sealed
    # sets (//sumtype:decl), and each domain's classifier, which cmd hands to
    # internal/cli, gives each kind its exit code in one switch per set
    # (docs/CLI.md rule 32): a switch that leaves a kind out is refused, and
    # a default case does not count as naming them.
    # tools/bin/architecture-check proves it with compile-valid fixtures.
    gochecksumtype:
      default-signifies-exhaustive: false
    # Layer/production-I/O/mock rules harvested from
    # github.com/donvargax/itos-template/.golangci.yml with owner MIT
    # permission (CONTRIBUTORS.md), adapted to this module and layout.
    # tools/bin/architecture-check proves these with compile-valid fixtures.
    # The arrows are decision 29's: the domain and its ports reach the outside
    # only through adapters implementing the ports, an adapter imports
    # nothing of ours but the ports and, as decision 47 amends it, the
    # domain it serves, a slice imports no other slice, the UI
    # imports nothing of ours (q-54), and kong stays in cmd and internal/cli. Each desc tells the reader of a refusal
    # what it means and, where a new package caused it, to extend the rules
    # as docs/go.md's Adding a package says rather than loosen them.
    depguard:
      rules:
        # The domains and their ports, their tests too: nothing of ours but
        # the domains and their port subpackages (no adapter, slice, UI or
        # cmd, nor the top-level libraries an adapter wraps); the kong rule
        # below keeps kong out of them. Their tests run them against
        # porttest's fakes. domain-coverage reads this list: each glob's
        # folder is a domain package it measures (./internal/selection), its
        # port subpackages not measured, so the floor holds behaviour, not
        # the ports and fakes. internal/selection chooses every command's
        # files; internal/lang names the units every command measures, its
        # port asking what surrounds a file (decisions 42 and 43);
        # internal/snapshot names the files the snapshots under .metrics/
        # record, its port reading and writing them (decision 41);
        # internal/slices/dry/domain, the dry slice's own domain (ADR-0051),
        # finds functions similar enough to be duplicates in files
        # internal/lang parsed, reaching nothing outside, so it has no port
        # (decision 37), and is no shared domain, so the allow list leaves it
        # out and no other domain imports it; internal/slices/scrap/domain,
        # the scrap slice's own, measures test code's structure in files
        # internal/lang parsed, with lang's fingerprints, and has no port
        # either, nor a place on the allow list;
        # internal/coverage parses coverage reports and answers what they
        # covered, its port asking what a path a report names is on disk
        # and holding the sealed gaps of coverage not measured (decision 46);
        # internal/slices/crap/domain, the crap slice's own, scores functions
        # by CRAP in files internal/lang parsed and a coverage Report, and has
        # no port, nor a place on the allow list;
        # internal/slices/mutation/domain, the mutation slice's own, owns
        # mutation's sites, results and their judgment, and declares its
        # model-bearing ports beside their values, with no port subpackage;
        # its external tests and porttest import it, so it and its porttest
        # are on the allow list. Only its own slice may import it: the
        # shared-domains rule below refuses the shared domains, and
        # tools/bin/architecture-check's sibling rule another slice's domain.
        domain:
          list-mode: lax
          files:
            - "**/internal/selection/**"
            - "**/internal/lang/**"
            - "**/internal/snapshot/**"
            - "**/internal/slices/dry/domain/**"
            - "**/internal/slices/scrap/domain/**"
            - "**/internal/slices/crap/domain/**"
            - "**/internal/coverage/**"
            - "**/internal/slices/mutation/domain/**"
          allow:
            - github.com/donvargax/itos-cc/internal/selection$
            - github.com/donvargax/itos-cc/internal/selection/
            - github.com/donvargax/itos-cc/internal/lang$
            - github.com/donvargax/itos-cc/internal/lang/
            - github.com/donvargax/itos-cc/internal/snapshot$
            - github.com/donvargax/itos-cc/internal/snapshot/
            - github.com/donvargax/itos-cc/internal/coverage$
            - github.com/donvargax/itos-cc/internal/coverage/
            - github.com/donvargax/itos-cc/internal/slices/mutation/domain$
            - github.com/donvargax/itos-cc/internal/slices/mutation/domain/porttest$
            - github.com/donvargax/itos-cc/internal/coverage/porttest$
          deny:
            - pkg: github.com/donvargax/itos-cc
              desc: "the domain imports no adapter, slice, UI or cmd (decision 29): reach the outside through its port; if this is another domain package, extend the rules as docs/go.md's Adding a package says, never loosen this one"
        # The shared domains, their ports and fakes, their tests too, import
        # no package under internal/slices: a slice's domain is its own, and
        # the domain rule's allow list names the mutation slice's only so
        # that its tests and porttest may import it (ADR-0051).
        shared-domains:
          files:
            - "**/internal/selection/**"
            - "**/internal/lang/**"
            - "**/internal/snapshot/**"
            - "**/internal/coverage/**"
          deny:
            - pkg: github.com/donvargax/itos-cc/internal/slices/
              desc: "a shared domain imports no slice and no slice's domain (ADR-0051): what every command shares belongs in a shared domain; never loosen this one"
        # The domain's own code does no I/O: no os (os/exec with it) and no
        # net. Its tests may read a fixture.
        domain-io:
          files:
            - "**/internal/selection/**"
            - "**/internal/lang/**"
            - "**/internal/snapshot/**"
            - "**/internal/slices/dry/domain/**"
            - "**/internal/slices/scrap/domain/**"
            - "**/internal/slices/crap/domain/**"
            - "**/internal/coverage/**"
            - "**/internal/slices/mutation/domain/**"
            - "!$test"
          deny:
            - pkg: os
              desc: "the domain does no I/O (decision 29): do the I/O in an adapter behind the domain's port, adding it as docs/go.md's Adding a package says; tests may read fixtures. Never loosen this one"
            - pkg: net
              desc: "the domain does no I/O (decision 29): reach networks from an adapter behind the domain's port, adding it as docs/go.md's Adding a package says; never loosen this one"
        # A slice is a command, in one package named for it until it moves
        # under internal/slices (ADR-0051, slice-packages below): its kong
        # struct and Run (UI), its Query and Handler (application). It imports
        # nothing of ours but the domain, its ports and internal/cli: no other
        # slice, under internal/slices or not, no adapter (cmd wires them in)
        # and no cmd. Every package under internal outside internal/slices is
        # a slice but those excluded here, the domain, the adapters and the
        # packages that are no command, so a package no rule names is held as
        # a slice; a new domain or adapter package is excluded here as it is
        # listed in its own rule. A rule cannot tell a slice's own import from
        # another's, so a slice's tests are in its own package and need no
        # import of it. internal/lang, the domain library that names a
        # source's units, is allowed: it is the measure every command shares,
        # no adapter and wrapping none, so a slice names the units of what it
        # read through its port with it (internal/slices/units, T-32), and
        # with them lang's port, Surroundings, which a slice's handler holds
        # and its tests fake (T-35); project, which an adapter wraps and which
        # answers lang's port from the disk, is not.
        slices:
          list-mode: lax
          files:
            - "**/internal/**"
            - "!**/internal/selection/**" # a domain and its ports
            - "!**/internal/lang/**" # a domain and its ports
            - "!**/internal/snapshot/**" # a domain and its ports
            - "!**/internal/coverage/**" # a domain and its ports
            - "!**/internal/workdir/**" # an adapter, held by workdir
            - "!**/internal/metricsdir/**" # an adapter, held by metricsdir
            - "!**/internal/coveragetools/**" # an adapter, held by coveragetools
            - "!**/internal/processes/**" # the process-ownership engine, held by processes
            - "!**/internal/imports/**" # the import-resolution engine, held by imports
            - "!**/internal/project/**" # the project and git history engine, held by project
            - "!**/internal/covrun/**" # the coverage runner, held by covrun
            - "!**/internal/cli/**" # the UI the slices share
            - "!**/internal/version/**" # the build's version, which cmd gives the version slice
            - "!**/internal/release/**" # the release tools' library
            - "!**/internal/slices/**" # the moved slices, held by slice-packages
          allow:
            - github.com/donvargax/itos-cc/internal/selection$
            - github.com/donvargax/itos-cc/internal/selection/
            - github.com/donvargax/itos-cc/internal/snapshot$
            - github.com/donvargax/itos-cc/internal/snapshot/
            - github.com/donvargax/itos-cc/internal/coverage$
            - github.com/donvargax/itos-cc/internal/coverage/
            - github.com/donvargax/itos-cc/internal/coverage/porttest$
            - github.com/donvargax/itos-cc/internal/cli$
            - github.com/donvargax/itos-cc/internal/lang$
            - github.com/donvargax/itos-cc/internal/lang/port$
            - github.com/donvargax/itos-cc/internal/lang/port/
          deny:
            - pkg: github.com/donvargax/itos-cc
              desc: "a slice imports only the domain, its ports, internal/cli and internal/lang with its port (decision 29); if this package is a domain package or an adapter, not a command, extend the rules as docs/go.md's Adding a package says, never loosen this one"
        # A slice under internal/slices/<name> (ADR-0051), its subpackages
        # with it, imports what the slices rule above allows and its own
        # subpackages, which keep its domain, port, porttest and adapter
        # apart. depguard matches a prefix, so it cannot tell a slice's own
        # subpackage from another slice's: internal/slices/ is allowed here,
        # and tools/bin/architecture-check refuses a slice importing another
        # (its sibling rule). A slice's own domain is held by the domain
        # rules instead, as every domain is, so it imports no UI, slice or
        # I/O. A slice's adapter, under
        # internal/slices/<name>/adapters/<adapter> (T-159), is held by a
        # rule of its own, as every adapter is, so this rule, which would
        # refuse the libraries it wraps, leaves the slice's adapters folder
        # out, and the sibling rule counts it as the slice's. Allowing
        # internal/slices/ lets a slice import an adapter, its own above all,
        # which slice-adapters below refuses. Each domain added to the slices
        # rule's allow list is added here too, until the last slice moves and
        # this rule is the only one.
        slice-packages:
          list-mode: lax
          files:
            - "**/internal/slices/**"
            - "!**/internal/slices/dry/domain/**" # a slice's domain, held by domain
            - "!**/internal/slices/scrap/domain/**" # a slice's domain, held by domain
            - "!**/internal/slices/crap/domain/**" # a slice's domain, held by domain
            - "!**/internal/slices/mutation/domain/**" # a slice's domain, held by domain
            - "!**/internal/slices/mutation/adapters/**" # a slice's adapters, each held by its own rule
          allow:
            - github.com/donvargax/itos-cc/internal/selection$
            - github.com/donvargax/itos-cc/internal/selection/
            - github.com/donvargax/itos-cc/internal/snapshot$
            - github.com/donvargax/itos-cc/internal/snapshot/
            - github.com/donvargax/itos-cc/internal/coverage$
            - github.com/donvargax/itos-cc/internal/coverage/
            - github.com/donvargax/itos-cc/internal/coverage/porttest$
            - github.com/donvargax/itos-cc/internal/cli$
            - github.com/donvargax/itos-cc/internal/lang$
            - github.com/donvargax/itos-cc/internal/lang/port$
            - github.com/donvargax/itos-cc/internal/lang/port/
            - github.com/donvargax/itos-cc/internal/slices/
          deny:
            - pkg: github.com/donvargax/itos-cc
              desc: "a slice imports only the domain, its ports, internal/cli, internal/lang with its port and its own subpackages (ADR-0051); if this package is a domain package or an adapter, not a command, extend the rules as docs/go.md's Adding a package says, never loosen this one"
        # A slice imports no adapter, its own neither: cmd wires a slice's
        # adapters in through its Ports (decision 29, ADR-0051).
        # slice-packages allows internal/slices/, so it would let a slice
        # import an adapter under internal/slices/<name>/adapters, its own
        # above all, which the sibling rule does not refuse. This rule holds
        # slice-packages' files and denies each slice's adapters folder by
        # name. It is a rule of its own because depguard looks a deny up as
        # the one entry sorting just before the import: a longer deny beside
        # slice-packages' module-wide one would hide that one from every
        # import sorting after it. TestNoDenyEntryPrefixesAnother, in
        # tools/testdata/architecture, refuses any rule's deny list holding
        # an entry that prefixes another (T-167).
        slice-adapters:
          files:
            - "**/internal/slices/**"
            - "!**/internal/slices/dry/domain/**" # a slice's domain, held by domain
            - "!**/internal/slices/scrap/domain/**" # a slice's domain, held by domain
            - "!**/internal/slices/crap/domain/**" # a slice's domain, held by domain
            - "!**/internal/slices/mutation/domain/**" # a slice's domain, held by domain
            - "!**/internal/slices/mutation/adapters/**" # a slice's adapters, each held by its own rule
          deny:
            - pkg: github.com/donvargax/itos-cc/internal/slices/mutation/adapters
              desc: "a slice imports no adapter, its own neither (decision 29, ADR-0051): cmd wires a slice's adapters in through its Ports; never loosen this one"
        # A slice's own code links no port's fake, which its tests alone may
        # use, as an adapter's do (T-56): the slices rule allows the domains'
        # ports by prefix, which porttest shares, so this rule refuses each
        # porttest by name over the same files, tests left out. depguard
        # matches a prefix, never a pattern, so a new port's porttest is
        # listed here as docs/go.md's Adding a package says;
        # tools/bin/architecture-check proves every porttest of the module is.
        # The same check refuses itos-cc's binary linking any porttest.
        slice-fakes:
          files:
            - "**/internal/**"
            - "!**/internal/selection/**" # a domain and its ports
            - "!**/internal/lang/**" # a domain and its ports
            - "!**/internal/snapshot/**" # a domain and its ports
            - "!**/internal/coverage/**" # a domain and its ports
            - "!**/internal/slices/mutation/domain/**" # a slice's domain, its porttest importing other ports' fakes
            - "!**/internal/slices/mutation/adapters/**" # a slice's adapters, each held by its own rule
            - "!**/internal/workdir/**" # an adapter, held by workdir
            - "!**/internal/metricsdir/**" # an adapter, held by metricsdir
            - "!**/internal/coveragetools/**" # an adapter, held by coveragetools
            - "!**/internal/processes/**" # the process-ownership engine, held by processes
            - "!**/internal/imports/**" # the import-resolution engine, held by imports
            - "!**/internal/project/**" # the project and git history engine, held by project
            - "!**/internal/covrun/**" # the coverage runner, held by covrun
            - "!**/internal/cli/**" # the UI the slices share
            - "!**/internal/version/**" # the build's version, which cmd gives the version slice
            - "!**/internal/release/**" # the release tools' library
            - "!$test"
          deny:
            - pkg: github.com/donvargax/itos-cc/internal/selection/port/porttest
              desc: "a slice's code links no fake (T-56): a port's fake enters only through _test.go files; never loosen this one"
            - pkg: github.com/donvargax/itos-cc/internal/lang/port/porttest
              desc: "a slice's code links no fake (T-56): a port's fake enters only through _test.go files; never loosen this one"
            - pkg: github.com/donvargax/itos-cc/internal/snapshot/port/porttest
              desc: "a slice's code links no fake (T-56): a port's fake enters only through _test.go files; never loosen this one"
            - pkg: github.com/donvargax/itos-cc/internal/coverage/port/porttest
              desc: "a slice's code links no fake (T-56): a port's fake enters only through _test.go files; never loosen this one"
            - pkg: github.com/donvargax/itos-cc/internal/slices/mutation/domain/porttest
              desc: "a slice's code links no fake (T-88): only tests may import mutation's Workers fake"
            - pkg: github.com/donvargax/itos-cc/internal/coverage/porttest
              desc: "a slice's code links no fake (T-90): only tests may import coverage's model-bearing fake"
        # Mutation's model-bearing contract is at the domain root. Its fake is
        # allowed in tests, never in the domain's production implementation.
        mutant-fakes:
          files:
            - "**/internal/slices/mutation/domain/**"
            - "!**/internal/slices/mutation/domain/porttest/**"
            - "!$test"
          deny:
            - pkg: github.com/donvargax/itos-cc/internal/slices/mutation/domain/porttest
              desc: "the mutation domain's production code imports no fake (T-88)"
        # Coverage's model-bearing capability uses a root fake; production
        # coverage code must never import that fake.
        coverage-fakes:
          files:
            - "**/internal/selection/**"
            - "**/internal/lang/**"
            - "**/internal/snapshot/**"
            - "**/internal/slices/dry/domain/**"
            - "**/internal/slices/scrap/domain/**"
            - "**/internal/slices/crap/domain/**"
            - "**/internal/coverage/**"
            - "**/internal/slices/mutation/domain/**"
            - "!**/porttest/**"
            - "!$test"
          deny:
            - pkg: github.com/donvargax/itos-cc/internal/coverage/porttest
              desc: "the coverage domain's production code imports no fake (T-90)"
        # The UI every slice shares, its tests too, imports nothing of ours:
        # no domain or port, no adapter, slice or cmd (q-54). cmd hands it one
        # classifier per domain, held beside that domain's slice, so adding
        # or removing a domain touches no file of it.
        ui:
          list-mode: lax
          files:
            - "**/internal/cli/**"
          deny:
            - pkg: github.com/donvargax/itos-cc
              desc: "internal/cli imports nothing of ours (q-54): turn a domain's failures into problems in a classifier beside its slice, which cmd hands the UI; never loosen this one"
        # An adapter implements the ports and imports nothing of ours but
        # them and, once its rule allows it (decision 47), the domain it
        # serves, and the shared pure domains its rule names (lang,
        # selection, coverage), which read nothing, as freshenv, testtools and
        # testinputs use them, freshenv reading Go coverage blocks through
        # coverage: not another domain, another adapter, a slice,
        # the UI or porttest's fakes, which its tests alone may use. Each
        # adapter is listed, and excluded from the slices above: one outside
        # internal/slices from slices and slice-fakes, a slice's own, under
        # internal/slices/<name>/adapters/<adapter>, from slice-packages,
        # slice-adapters and slice-fakes. Each port's adapters have a rule of
        # their own, so no adapter is allowed another's port or library.
        # internal/workdir implements the selection port over internal/project,
        # the engine that walks a tree and asks git, and lang's port
        # over project's answers from the disk (T-35): both ports and project
        # are allowed here, and no other library is. Mutation's
        # SourceEdits moved to the slice's sources adapter (T-161), so it
        # imports no domain.
        workdir:
          list-mode: lax
          files:
            - "**/internal/workdir/**"
            - "!$test"
          allow:
            - github.com/donvargax/itos-cc/internal/selection/port$
            - github.com/donvargax/itos-cc/internal/lang/port$
            - github.com/donvargax/itos-cc/internal/project$
          deny:
            - pkg: github.com/donvargax/itos-cc
              desc: "the workdir adapter imports only the selection/lang ports and project, which it wraps (T-92, T-161); extend the rules as docs/go.md's Adding a package says, never loosen this one"
        # internal/metricsdir implements the snapshot port over its own
        # library, metrics.go, the top-level metrics until it folded in here
        # (ADR-0061, T-195), which writes .metrics/ as indented JSON renamed
        # into place, and internal/project, which finds the root it lives at
        # (decision 41): that port, the snapshot domain it serves (decision
        # 47), whose Folder and Version the library names, and the project
        # engine are allowed here, and no other package of ours. The mutation
        # snapshot codec moved to the slice's snapshots adapter (T-161), so it
        # imports no mutation package.
        metricsdir:
          list-mode: lax
          files:
            - "**/internal/metricsdir/**"
            - "!$test"
          allow:
            - github.com/donvargax/itos-cc/internal/snapshot$
            - github.com/donvargax/itos-cc/internal/snapshot/port$
            - github.com/donvargax/itos-cc/internal/project$
          deny:
            - pkg: github.com/donvargax/itos-cc
              desc: "the metricsdir adapter imports only the snapshot domain it serves, its port and internal/project, which it wraps (T-92, T-161, T-195); extend the rules as docs/go.md's Adding a package says, never loosen this one"
        # internal/coveragetools implements the coverage port over
        # internal/covrun, the runner of each language's tools, its process groups
        # and run folders, and internal/metricsdir's Dir, which says where
        # .metrics/ is for them (decision 46, T-195), an adapter using
        # another's helper. It returns the coverage domain's Report, so,
        # as decision 47 lets an adapter, it imports the domain it serves,
        # with no mapper between the two; nothing of it reaches the domain,
        # whose rules refuse every adapter. That domain, its port, the runner
        # and internal/metricsdir are allowed here, and no other package of
        # ours.
        coveragetools:
          list-mode: lax
          files:
            - "**/internal/coveragetools/**"
            - "!$test"
          allow:
            - github.com/donvargax/itos-cc/internal/coverage$
            - github.com/donvargax/itos-cc/internal/coverage/port$
            - github.com/donvargax/itos-cc/internal/covrun$
            - github.com/donvargax/itos-cc/internal/metricsdir$
          deny:
            - pkg: github.com/donvargax/itos-cc
              desc: "the coveragetools adapter imports nothing of ours but the coverage domain it serves (decision 47), its port, the coverage runner it wraps and internal/metricsdir's Dir (decision 46, T-195); extend the rules as docs/go.md's Adding a package says, never loosen this one"
        # Model-bearing Workers lives beside the mutation domain's values to
        # avoid a cycle.
        # worktrees wraps only project tree operations and runs its commands
        # through the process-ownership engine. It is the mutation slice's
        # adapter, under internal/slices/mutation/adapters (T-160), as
        # githistory, freshenv and importgraph below are.
        worktrees:
          list-mode: lax
          files:
            - "**/internal/slices/mutation/adapters/worktrees/**"
            - "!$test"
          allow:
            - github.com/donvargax/itos-cc/internal/slices/mutation/domain$
            - github.com/donvargax/itos-cc/internal/processes$
            - github.com/donvargax/itos-cc/internal/project$
          deny:
            - pkg: github.com/donvargax/itos-cc
              desc: "the worktrees adapter imports only the mutation domain, the process-ownership engine its workers run through and project tree operations it wraps (T-88, T-151); no UI, other adapters or fakes"
        # internal/processes is the process-ownership engine (ADR-0021,
        # decision 38, T-151): the owned executor, the command runner and
        # the process-group kill and wait that mutation's workers, counted
        # preparation and crap's coverage command run through, which cmd
        # binds. It is an adapter-side engine, not a domain: it starts and
        # kills processes, so no domain or slice imports it (their rules
        # leave it out), and it imports nothing of ours, its tests neither,
        # so no domain's values reach it: a caller converts its Result.
        processes:
          list-mode: lax
          files:
            - "**/internal/processes/**"
          deny:
            - pkg: github.com/donvargax/itos-cc
              desc: "the process-ownership engine imports nothing of ours (T-151): no domain, slice, adapter or UI; a caller converts its Result into its own terms"
        # internal/imports is the import-resolution engine (ADR-0051, T-162):
        # it resolves each language's imports into module dependencies and
        # finds the tests that reach each source, for graph and for mutation's
        # importgraph adapter. It is an adapter-side engine, not a domain: it
        # parses files through project, finds markers above them and reads
        # tsconfig.json, so no domain or slice imports it (their rules leave
        # it out). It imports internal/lang, whose parsed files it reads,
        # project, and the coverage runner, for pytest's naming of a test file,
        # its tests too, and nothing else of ours: no domain but lang, slice,
        # adapter or fake, so no slice's values reach it. One deny entry only:
        # depguard looks a deny up as the one entry sorting just before the
        # import (slice-adapters above).
        imports:
          list-mode: lax
          files:
            - "**/internal/imports/**"
          allow:
            - github.com/donvargax/itos-cc/internal/lang$
            - github.com/donvargax/itos-cc/internal/project$
            - github.com/donvargax/itos-cc/internal/covrun$
          deny:
            - pkg: github.com/donvargax/itos-cc
              desc: "the import-resolution engine imports nothing of ours but internal/lang, internal/project and the coverage runner (T-162): no other domain, slice, adapter, UI or fake; a caller converts its results into its own terms"
        # internal/project is the project and git history engine (ADR-0051,
        # ADR-0061, T-194), the top-level project until then: it discovers a
        # tree's sources and tests, asks git what changed and answers
        # internal/lang's port from the disk (project.Surroundings). It is an
        # adapter-side engine, not a domain: it reads the disk and runs git,
        # so no domain or slice imports it (their rules leave it out), and of
        # the adapters only those wrapping it allow it. Its code imports
        # internal/lang and its port, whose Surroundings it answers, and
        # internal/selection and internal/snapshot, whose values it names
        # paths by, and nothing else of ours; its tests may use lang's fake.
        project:
          list-mode: lax
          files:
            - "**/internal/project/**"
            - "!$test"
          allow:
            - github.com/donvargax/itos-cc/internal/lang$
            - github.com/donvargax/itos-cc/internal/lang/port$
            - github.com/donvargax/itos-cc/internal/selection$
            - github.com/donvargax/itos-cc/internal/snapshot$
          deny:
            - pkg: github.com/donvargax/itos-cc
              desc: "the project engine imports nothing of ours but internal/lang with its port, internal/selection and internal/snapshot (ADR-0061, T-194): no other domain or port, slice, adapter, UI or fake; extend the rules as docs/go.md's Adding a package says, never loosen this one"
        # internal/covrun is the coverage runner (decision 46, ADR-0061,
        # T-196), the top-level coverage until then: it runs each language's
        # test and coverage tools, owns their run folders and reads what they
        # write into the coverage domain's Report through its API. It is an
        # adapter-side engine, not a domain: it runs processes and reads the
        # disk, so it is never under internal/coverage/, whose domain globs
        # would hold it, and no domain or slice imports it (their rules leave
        # it out); of the adapters only those wrapping it allow it. Its code
        # imports the coverage domain and its port, internal/lang and
        # internal/project, and nothing else of ours; its tests may use the
        # coverage port's fake too.
        covrun:
          list-mode: lax
          files:
            - "**/internal/covrun/**"
            - "!$test"
          allow:
            - github.com/donvargax/itos-cc/internal/coverage$
            - github.com/donvargax/itos-cc/internal/coverage/port$
            - github.com/donvargax/itos-cc/internal/lang$
            - github.com/donvargax/itos-cc/internal/project$
          deny:
            - pkg: github.com/donvargax/itos-cc
              desc: "the coverage runner imports nothing of ours but the coverage domain and its port, internal/lang and internal/project (ADR-0061, T-196): no other domain or port, slice, adapter, UI or fake; extend the rules as docs/go.md's Adding a package says, never loosen this one"
        # T-89: each concrete observation adapter owns only its declared I/O.
        # testtools and testinputs (T-159), githistory, freshenv and
        # importgraph (T-160), snapshots, exceptions and sources (T-161), like
        # worktrees above, are the mutation slice's adapters, under
        # internal/slices/mutation/adapters, the sibling rule letting them
        # import the slice's domain and no other slice.
        testtools:
          list-mode: lax
          files:
            - "**/internal/slices/mutation/adapters/testtools/**"
            - "!$test"
          allow:
            - github.com/donvargax/itos-cc/internal/slices/mutation/domain$
            - github.com/donvargax/itos-cc/internal/lang$
            - github.com/donvargax/itos-cc/internal/project$
            - github.com/donvargax/itos-cc/internal/covrun$
          deny:
            - pkg: github.com/donvargax/itos-cc
              desc: "the testtools adapter imports only the mutation domain and its observed libraries (T-89); no other adapters, UI or fakes"
        testinputs:
          list-mode: lax
          files:
            - "**/internal/slices/mutation/adapters/testinputs/**"
            - "!$test"
          allow:
            - github.com/donvargax/itos-cc/internal/slices/mutation/domain$
            - github.com/donvargax/itos-cc/internal/lang$
            - github.com/donvargax/itos-cc/internal/project$
            - github.com/donvargax/itos-cc/internal/covrun$
          deny:
            - pkg: github.com/donvargax/itos-cc
              desc: "the testinputs adapter imports only the mutation domain and its observed libraries (T-89); no other adapters, UI or fakes"
        githistory:
          list-mode: lax
          files:
            - "**/internal/slices/mutation/adapters/githistory/**"
            - "!$test"
          allow:
            - github.com/donvargax/itos-cc/internal/slices/mutation/domain$
            - github.com/donvargax/itos-cc/internal/project$
          deny:
            - pkg: github.com/donvargax/itos-cc
              desc: "the githistory adapter imports only mutation's History values and the Git library it wraps (T-91); no UI, other adapters or fakes"
        freshenv:
          list-mode: lax
          files:
            - "**/internal/slices/mutation/adapters/freshenv/**"
            - "!$test"
          allow:
            - github.com/donvargax/itos-cc/internal/slices/mutation/domain$
            - github.com/donvargax/itos-cc/internal/coverage$
            - github.com/donvargax/itos-cc/internal/coverage/port$
            - github.com/donvargax/itos-cc/internal/selection$
            - github.com/donvargax/itos-cc/internal/selection/port$
            - github.com/donvargax/itos-cc/internal/lang$
            - github.com/donvargax/itos-cc/internal/lang/port$
            - github.com/donvargax/itos-cc/config$
            - github.com/donvargax/itos-cc/internal/project$
            - github.com/donvargax/itos-cc/internal/covrun$
          deny:
            - pkg: github.com/donvargax/itos-cc
              desc: "freshenv imports only its mutation contract and the observed libraries/codecs it wraps (T-95); cmd supplies other adapters and owned executors"
        # importgraph is mutation's Reach over the import-resolution engine,
        # internal/imports (T-162): it calls the engine's TestsImporting and
        # turns its failures into the domain's, which an engine, importing no
        # slice, cannot return. It is a thin adapter of its own, importing
        # neither graph nor project, so the engine stays free of the slice's
        # domain and graph, which imports that domain, is reached by no slice.
        importgraph:
          list-mode: lax
          files:
            - "**/internal/slices/mutation/adapters/importgraph/**"
            - "!$test"
          allow:
            - github.com/donvargax/itos-cc/internal/slices/mutation/domain$
            - github.com/donvargax/itos-cc/internal/imports$
          deny:
            - pkg: github.com/donvargax/itos-cc
              desc: "the importgraph adapter imports only the mutation domain and the import-resolution engine it adapts (T-89, T-162); no other adapters, UI or fakes"
        # snapshots is the mutation snapshot codec (T-161), which was
        # internal/metricsdir's: it reads and writes the domain's Snapshot as
        # the JSON under .metrics/mutate, legacy go_evidence included, through
        # the snapshot port, whose Store metricsdir implements and cmd gives
        # it. That port is all it reaches, never metricsdir or project.
        snapshots:
          list-mode: lax
          files:
            - "**/internal/slices/mutation/adapters/snapshots/**"
            - "!$test"
          allow:
            - github.com/donvargax/itos-cc/internal/slices/mutation/domain$
            - github.com/donvargax/itos-cc/internal/snapshot/port$
          deny:
            - pkg: github.com/donvargax/itos-cc
              desc: "the snapshots adapter imports only the mutation domain and the snapshot port it reads and writes through (T-161); no other adapters, libraries, UI or fakes"
        # exceptions writes itos-cc.yaml's mutation.exceptions (T-161), which
        # was config's: it wraps config, the one reading codec, for the
        # file's name, Parse and InvalidError, and keeps the rest of the
        # document with yaml.v3.
        exceptions:
          list-mode: lax
          files:
            - "**/internal/slices/mutation/adapters/exceptions/**"
            - "!$test"
          allow:
            - github.com/donvargax/itos-cc/internal/slices/mutation/domain$
            - github.com/donvargax/itos-cc/config$
          deny:
            - pkg: github.com/donvargax/itos-cc
              desc: "the exceptions adapter imports only the mutation domain and config, the reading codec it wraps (T-161); no other adapters, libraries, UI or fakes"
        # sources is the domain's SourceEdits, SourcePresence and SourceStatus
        # over the disk (T-161), which were internal/workdir's: the standard
        # library is all it wraps.
        sources:
          list-mode: lax
          files:
            - "**/internal/slices/mutation/adapters/sources/**"
            - "!$test"
          allow:
            - github.com/donvargax/itos-cc/internal/slices/mutation/domain$
          deny:
            - pkg: github.com/donvargax/itos-cc
              desc: "the sources adapter imports only the mutation domain, whose source ports it implements over the disk (T-161); no other adapters, libraries, UI or fakes"
        mocks:
          files:
            - $all
          deny:
            - pkg: github.com/golang/mock
              desc: "no mocking library: write an in-memory fake or stub of the port in its porttest package, as internal/selection/port/porttest does"
            - pkg: go.uber.org/mock
              desc: "no mocking library: write an in-memory fake or stub of the port in its porttest package, as internal/selection/port/porttest does"
            - pkg: github.com/stretchr/testify/mock
              desc: "no mocking library: write an in-memory fake or stub of the port in its porttest package, as internal/selection/port/porttest does"
            - pkg: github.com/vektra/mockery
              desc: "no mocking library: write an in-memory fake or stub of the port in its porttest package, as internal/selection/port/porttest does"
            - pkg: github.com/maxbrunsfeld/counterfeiter
              desc: "no mocking library: write an in-memory fake or stub of the port in its porttest package, as internal/selection/port/porttest does"
        # Properties are unit tests of the domain: rapid comes in only in the
        # domain package's own tests, not its code, its ports or porttest.
        rapid:
          files:
            - $all
            - "!**/internal/selection/*_test.go"
          deny:
            - pkg: pgregory.net/rapid
              desc: "rapid is only for the domains' property tests, in a domain package's own tests; test anything else with ordinary tests and porttest's fakes"
        # kong is the UI's, harvested from itos-template's kong rule: here
        # the UI is the entry point and internal/cli. A slice's kong struct
        # carries kong's struct tags, which need no import of kong.
        kong:
          files:
            - $all
            - "!**/cmd/**"
            - "!**/internal/cli/**"
          deny:
            - pkg: github.com/alecthomas/kong
              desc: "kong stays in the UI, cmd and internal/cli (decision 29): a slice's struct tags need no import of it; never loosen this one"
            # The fork itos-cc builds with until kong releases its typed parse errors (T-33).
            - pkg: github.com/donvargax/kong
              desc: "kong stays in the UI, cmd and internal/cli (decision 29): a slice's struct tags need no import of it; never loosen this one"
    # Only the rules listed run: revive's defaults stay off.
    revive:
      rules:
        - name: context-as-argument
        - name: file-length-limit
          arguments:
            - max: 600
              skipComments: true
              skipBlankLines: true
  exclusions:
    # A generated file is linted as hand-written code is: the ones there are,
    # cmd/itos-cc/commands_gen.go and features/steps_gen.go, are
    # tools/bin/assemble's, which writes them from the slices' declarations
    # (T-146) and the declarations of the feature files' steps (T-164), so a
    # rule one breaks is a bug of the generator to fix there, never a file to
    # leave unread.
    generated: disable
    rules:
      - path: _test\.go$
        linters: [gosec]
formatters:
  enable:
    - gofmt
