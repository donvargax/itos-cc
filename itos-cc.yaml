# The sources no command measures or mutates, globs from here (decision 45):
# the ports' fakes in porttest, test support several packages' tests share,
# features/, whose step code is ordinary files of package features, so
# cmd/itos-cc's tests run the scenarios in process (decision 44), and
# cmd/itos-cc/commands_gen.go, which tools/bin/assemble writes from the
# slices' declarations (T-146): its providers are one shape repeated, which
# dry would count as duplicates, and a mutant there is fixed in the
# generator, whose own tests and CI's check that the file is current hold it.
exclude: ["**/porttest/**", "features/**", "cmd/itos-cc/commands_gen.go"]

# The mutants no test can kill, each with why it changes no behaviour, so no
# test could tell it from the code as it stands. Reviewed like the code it
# excuses: mutation run and mutation check count a site listed here as
# excepted, and refuse the entry as soon as the function it names changes, so
# a reason that stops holding cannot outlive the code it was written for.
mutation:
  exceptions:
    - file: internal/release/build.go
      function: github.com/donvargax/itos-cc/internal/release#extract
      hash: eb830c4ae00e4903
      line_in_function: 13
      column: 14
      original: '!='
      replacement: ==
      reason: untar reads a tar git archive wrote, whose entries are all relative names, each written once, each a folder, a regular file or a symlink, so it cannot refuse a name and the only way it returns is a write failing on the temporary folder BuiltAt made; it returns nil there, and draining a pipe afterwards cannot change the error extract returns.
      line_text: if unpacked != nil {
    - file: internal/release/release.go
      function: github.com/donvargax/itos-cc/internal/release#Newest
      hash: 169323ab8c351ad2
      line_in_function: 4
      column: 58
      original: '>'
      replacement: '>='
      reason: compareTags returns 0 only for two identical spellings, because equal numbers give equal lengths and two strings of one length never compare equal otherwise, so taking the later of a pair it calls equal sets newest to the string it already holds.

  # The listed tests are the scenarios, run in process (decision 49, T-184):
  # a mutant that survives its file's own tests runs the scenarios whose
  # coverage reaches its line. list prints the ID and feature file of each
  # live scenario TestScenarios runs, the file from the project's top, as a
  # listed file that is not there would keep a kill fresh forever.
  # tools/bin/listed-scenarios decides by the harness's own rules
  # (features.Converted, features.Deferred, features.Unstepped,
  # @binary-only): a counted run fails closed on a listed test with no
  # per-ID coverage data, and every live scenario itos lists was the first
  # code proof's failure (T-187). Once itos prints each scenario's tags
  # (itos#117), a filter replaces the program. No fingerprint column, as the
  # jq filter printed none, until itos#22 and itos#112 give one. {pattern} is
  # single-quoted, since it reaches the shell line unquoted. whole runs every
  # scenario with -cover; with ITOS_CC_TEST_COVERDIR set, as itos-cc sets it,
  # TestScenarios runs each in a test binary of its own writing its coverage
  # under <dir>/<ID> (decision 10). support is what every listed kill rests
  # on besides its feature file (decision 13): the step code, the in-process
  # driver and its fakes, the TestMain in subprocess_test.go that runs before
  # every scenario, and the ports' fakes (T-191). The globs go through
  # filepath.Glob, where ** is *, so each porttest folder under internal/ is
  # named by a glob of its own, every one git ls-files lists today, and a
  # folder added later is added here; listed-support-doublestar, if built,
  # folds them into internal/**/porttest/*.go. The other cmd/itos-cc test
  # files hold tests TestScenarios never runs. Never features/*.feature,
  # which would stale every listed kill on any spec edit.
  # A scenario the in-process driver leaves out (@binary-only,
  # features.Deferred) runs nothing there and kills nothing, so it is not
  # listed.
  tests:
    list: itos tests list scenario --json | go run ./tools/bin/listed-scenarios
    run: go test -count=1 ./cmd/itos-cc -run '^TestScenarios$' -scenarios='{pattern}'
    ids_pattern: "^@(?:{ids})$"
    join: {each: "(?:{id})", sep: "|"}
    whole: go test -count=1 -cover -coverpkg=./... ./cmd/itos-cc -run '^TestScenarios$'
    support:
      - features/*.go
      - cmd/itos-cc/scenarios*_test.go
      - cmd/itos-cc/run_fakes_test.go
      - cmd/itos-cc/subprocess_test.go
      - internal/coverage/porttest/*.go
      - internal/coverage/port/porttest/*.go
      - internal/lang/port/porttest/*.go
      - internal/selection/port/porttest/*.go
      - internal/slices/mutation/domain/porttest/*.go
      - internal/snapshot/port/porttest/*.go
