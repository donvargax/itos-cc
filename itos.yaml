# itos.yaml, written by itos init: this repository's rules for its commits,
# kept small to grow. itos config check validates it; itos config check
# --print-defaults prints every key it leaves to its default.
version: 1

# The itos release this repository runs: a global itos fetches it, checks it
# against these checksums and runs it. itos pin moves it to the newest.
pin:
  version: "8.0.0"
  checksums: "f127de8a96e9ee1614eab1f19bc86b23ae141b6dd33a357d81560d7381eb0b35" # the SHA-256 of the release's checksums.txt

# The tasks: every commit but a feat, a fix or a docs names one in its Task
# footer (itos commit --task T-1), and itos task T-1 runs its checks.
ledger:
  files: "tasks/phase-{group}.yaml" # one file per phase: tasks/phase-1.yaml, …
  id: "T-\\d+"

commits:
  # The Conventional Commits types, held to commitlint's config-conventional
  # rules by itos's own lint.
  types: [feat, fix, refactor, perf, test, build, ci, chore, docs, style, revert]
  header_lint: { use: builtin }
  footers:
    Task:
      source: ledger
      required_for: [refactor, perf, test, build, ci, chore, style, revert]
      validate_for: all # a task named must be in the ledger
      read_at: commit # judged against the ledger the commit carries
    # The scenarios a feat or a fix turns green, by their ID tags
    # (itos commit --scenarios '@ID-MUT-01'); a @wip one is not live. Every
    # scenario carries one, on the line above its Scenario:, so every feat
    # and fix names the scenarios it turns green.
    Scenarios:
      source: { tests: scenario }
      strip_prefix: "@"
      required_for: [feat, fix]
      validate_for: [feat, fix]
      must_be_live: true
      read_at: commit
    # What a user of this project must change for the commit, or none
    # (itos commit --upgrading none): feat and fix are what a user can feel, and
    # the release notes quote it (T-27, as go-template-itos requires it).
    Upgrading:
      source: text
      required_for: [feat, fix]
    # The work item a commit belongs to, for the commits no other footer ties
    # to it: a slice's @wip scenarios and its steps committed red first, in a
    # test commit, or a chore it needs. It stands in for Task in those types,
    # since a slice has no task (itos commit --item slice-1).
    Item:
      source: registry
      validate_for: all
      read_at: commit
      in_place_of: { Task: [test, docs, chore] }
  # Where verification starts: this commit and the ones before it, written
  # before itos, are never judged.
  since: "313ea4a7b6fc7d289130df5bd0aa5fa495c28924"
  # Which paths each type may touch. docs needs no Task footer, so it may
  # touch only Markdown, docs/ and itos's data in tasks/; the rest, anything.
  scopes:
    docs: { only: ["**/*.md", "docs/**", "tasks/**"] }

# The named tests: the scenarios of the feature files under features/, each
# with an ID tag such as @ID-PAGE-01, and a smoke set naming one of each file.
# godog runs them through go test with two drivers (decision 44, T-59):
# TestFeatures against the binary built from this tree (features/README.md),
# as itos-policy.yaml, the template's config, does, and cmd/itos-cc's
# TestScenarios in process against the ports' fakes, so every run holds each
# scenario both ways but those tagged @binary-only or @in-process-only.
# -scenarios= is a regular expression over the scenarios' tags, which each
# harness turns into godog's tag filter, as godog's own takes only exact
# tags. The harnesses run only the feature files converted to godog (q-52,
# T-32): a scenario of another, the smoke set's included, is logged as not
# run there, its Go tests in cmd/itos-cc holding it until its command moves.
tests:
  scenario:
    adapter: gherkin
    root: features
    id: "ID-[A-Z]+-\\d+"
    tag_prefix: "@"
    wip_tag: "@wip"
    run:
      whole: "go test ./features ./cmd/itos-cc -count=1 -run '^Test(Features|Scenarios)$'"
      select: "go test ./features ./cmd/itos-cc -count=1 -run '^Test(Features|Scenarios)$' -scenarios={pattern}"
      ids_pattern: "^@(?:{ids})$"
      join: { each: "(?:{p})", sep: "|" }
    recognize: # a task check read back as a selection, so CI runs it in the one run
      - { command: "go test ./features ./cmd/itos-cc -count=1 -run '^Test(Features|Scenarios)$'", as: whole }
      - { command: "go test ./features ./cmd/itos-cc -count=1 -run '^Test(Features|Scenarios)$' -scenarios={pattern}", as: pattern }
      - { command: "go test ./features -count=1", as: whole }
      - { command: "go test ./features -count=1 -scenarios={pattern}", as: pattern }
      - { command: "itos tests smoke run scenario", as: smoke }
    smoke:
      { file: features/smoke.yaml, every_file: true, add_hint: "add one to features/smoke.yaml" }

hooks:
  bin: itos # the hooks call the global itos, which runs the release pinned

ci:
  # The plan ci.yml's ci job runs, itos ci run "$FROM" "$TO" over the push's
  # range (T-29): every step in cost order, the static ones first, then the
  # checks of the tasks the range's commits name in their Task footers, the
  # first failure stopping the run. Taken from itos-policy.yaml, the
  # template's own plan, with the gates this code already passes, and its
  # scenario step (T-32); RAPID_CHECKS go test, mutation sample and proof
  # (q-53) come later. The test matrix on three systems stays in ci.yml.
  steps:
    - { run: itos config check, cost: static }
    - { run: tools/bin/doc-caps, cost: static }
    # Every tracked Go file, each top-level package and tools/ included,
    # named when gofmt would change it.
    - { run: "! git ls-files -z -- '*.go' | xargs -0 gofmt -l | grep .", cost: static }
    - { run: go build ./..., cost: static }
    - { run: go vet ./..., cost: static }
    - { run: go mod verify, cost: static }
    - { run: go mod tidy -diff, cost: static }
    - { run: itos tests smoke check scenario, cost: static }
    # The pinned golangci-lint over internal/ alone, the packages laid out
    # as decision 29 says, widening as packages move there (q-50, T-31).
    - { run: tools/bin/pinned golangci-lint run ./internal/..., cost: static }
    # The depguard arrows of .golangci.yml over its own fixture modules, with
    # the golangci-lint tools/bin/pinned fetches and checks; not our code.
    - { run: tools/bin/architecture-check, cost: static }
    - { run: go tool govulncheck -test ./..., cost: late }
    - { run: tools/bin/domain-coverage, cost: late }
    # The one merged run of the scenarios: the smoke set and those the
    # range names, the whole suite when there is no green run to start
    # from. The harness runs the feature files converted to godog and logs
    # the rest as not run there (features/README.md).
    - { tests: scenario }
  # A push touching only these runs these steps alone.
  prose:
    paths: ["**/*.md", "docs/**", "tasks/**"]
    steps:
      - itos config check
      - tools/bin/doc-caps
  # itos ci watch, and the CI check of itos work done, read the push's run of
  # ci.yml on GitHub.
  watch:
    provider: github
