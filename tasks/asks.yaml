    answer: "Allow them, mutants included (person, 2026-10-18): JSON tags in the domain are fine when they are only used for serialization. A domain may carry json and yaml struct tags on its own types; it imports no encoding package and holds no encoding or decoding logic, so a format's legacy keys and other wire rules stay in the adapter. Coverage's Gap keeps its one-line MarshalText, which returns the Gap's name for serialization only and imports nothing (the coordinator's reading)."
