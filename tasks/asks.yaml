# The questions to the person the work is for, written by itos decision (itos help decision).
questions:
  - id: q-1
    item: "mutate-check-sample"
    question: "How is the check mode spelled? (a, recommended) A command of its own that runs nothing, such as itos-cc mutants (name open), taking the same selection flags: it follows CLI rule 18 (a flag changes an action, never selects another), which the repository just adopted. (b) mutate --check, as issue #8 sketches it: one more rule-18 exception beside mutate --scan, listed in docs/CLI.md. Note IDEAS.md keeps the name check for the debt file."
    answer: "(a): a command of its own that runs nothing, following rule 18. Its name, and whether it also takes over mutate --scan, is q-3."
    decision: none
  - id: q-2
    item: "mutate-check-sample"
    question: "What does the check mode fail on? (a, recommended) Missing or stale results, and also cached survivors (and cached uncovered mutants with --fail-uncovered) in the selected functions, so it gives the verdict a full run would give, from the cache: a gate that passes on fresh results showing survivors proves nothing. (b) Missing or stale results only, as issue #8 sketches it, leaving survivors to the run that wrote them."
    answer: "(a): missing or stale results, and cached survivors (and cached uncovered mutants with --fail-uncovered) in the selected functions, so it gives the verdict a full run would give, from the cache."
    decision: 2
  - id: q-3
    item: "mutate-check-sample"
    question: "Name the read-only command, and does it replace mutate --scan? (a, recommended) One command, itos-cc sites, that lists each selected function's mutation sites with their cached outcome, marks missing or stale ones, and exits 1 as q-2 says; mutate --scan goes, a breaking change made in the next major release with the others (rules 42, 43), which also clears the rule-18 row in docs/CLI.md. (b) Same, under another name you pick (not mutants: a letter from mutate breaks rule 5, as crap and scrap do). (c) A check-only command, keeping mutate --scan as a listed exception."
    answer: "A group, mutation, following rules 3, 4, 7 and 13: mutation run (today's mutate), mutation list (today's mutate --scan) and mutation check (the check mode). mutate and --scan go with no alias; itos-cc is pre-1.0 (v0.1.1), so a breaking change needs only a minor release."
    decision: 1
  - id: q-4
    item: "mutate-test-hash"
    question: "Which tests' hash keys a mutation result? (a, recommended) The test files the graph finds importing the function's file (for Go, its package's test files and the test files of packages that import it), whatever command ran the mutants: one rule for every mode and language, cheap, as IDEAS.md planned. A kill made only by an end-to-end test that runs the binary (--all-tests) is not made stale when that test changes. (b) The test files of the command that ran: the package's for Go, vitest related's set, every test file with --all-tests. Exact, but under --all-tests any test edit makes every result stale, so the next nightly reruns everything."
    answer: "(a): the test files the graph finds importing the function's file (for Go, its package's test files and the test files of packages that import it), whatever command ran."
    decision: 3
  - id: q-5
    item: "mutate-test-hash"
    question: "Snapshots written before this hold no tests' hash. (a, recommended) Treat them as stale: the first run after the change reruns them (the nightly does it once), and mutation check fails on them until then, so a gate never trusts a result it cannot verify. (b) Treat them as fresh until their function changes: no rerun, but those kills stay unverified against test changes."
    answer: "(a): snapshots without a tests' hash are stale; the next run reruns them and mutation check fails on them until then."
    decision: none
  - id: q-6
    item: "mutate-sample"
    question: "How is the sample mode spelled? (a, recommended) A subcommand, itos-cc mutation sample: it re-runs a random sample of cached mutants, compares each outcome with the snapshot and writes nothing. sample is the imperative verb rule 3 asks for and stays clear of check (rule 5: verify would overlap it). (b) itos-cc mutation verify, as a word closer to what it proves, accepting the overlap with check."
    answer: "(a) A subcommand, itos-cc mutation sample: re-runs a random sample of cached mutants, compares each outcome with the snapshot, writes nothing."
    decision: none
  - id: q-7
    item: "mutate-sample"
    question: "How many, and how random? (a, recommended) --count N, default 20, and the choice seeded from the HEAD commit, so a CI rerun of the same commit samples the same mutants and each new commit samples others; --seed overrides it to reproduce a run. (b) A fresh random seed every run, printed so it can be reproduced, so reruns of one commit sample differently."
    answer: "(a) --count N, default 20, seeded from the HEAD commit so a rerun of one commit samples the same mutants; --seed overrides it."
    decision: none
  - id: q-8
    item: "mutate-sample"
    question: "What is sampled, and what fails? (a, recommended) Only the fresh entries of the selection (stale and missing ones are mutation check's to report), and among them only mutants that ran (killed, timeout, survived: an uncovered one would need a coverage run). Any outcome that differs from the snapshot fails as mutation.mismatch, naming both outcomes, whichever way it went: the cache was wrong either way. (b) Fail only when a cached kill now survives, the direction that lets a gate pass wrongly, and print the other differences without failing."
    answer: "(a) Only fresh entries that ran (killed, timeout, survived); any outcome differing from the snapshot fails as mutation.mismatch, naming both, either direction."
    decision: none
  - id: q-9
    item: "mutation-exceptions"
    question: "Where do the exceptions live? (a, recommended) itos-cc.yaml at the project root, under mutation.exceptions: itos-cc's first project setting (docs/CLI.md rule 38), reviewed like code. (b) .metrics/mutate/exceptions.yaml beside the snapshots, as the issue proposed, though .metrics holds what itos-cc writes."
    answer: "(a) itos-cc.yaml at the project root, under mutation.exceptions."
    decision: 4
  - id: q-10
    item: "mutation-exceptions"
    question: "How is an entry written? It must hold the function's hash to tell when the function changed. (a, recommended) A command, itos-cc mutation except <file>:<line>:<column> --reason '…', which finds the survivor in the snapshot and writes the file, function, hash, the site's place within the function, original, replacement and reason. (b) By hand only, the hash copied from the snapshot."
    answer: "(a) A command, itos-cc mutation except <file>:<line>:<column> --reason '…'."
    decision: none
  - id: q-11
    item: "mutation-exceptions"
    question: "What does an excepted survivor do, and when is its entry stale? (a, recommended) It fails nothing, counted excepted, and is reused without running, as a kill is, while its function and the tests that import its file are unchanged; when its tests change it runs again, and if now killed its entry is stale. A changed function or a site gone makes the entry stale without running. Stale fails as mutation.exception-stale, exit 1; --mutate-all runs them too. (b) Always run them. (c) Never run them."
    answer: "(a) Reused as a kill is while its function and its tests are unchanged; rerun when its tests change, stale if now killed; stale without running when its function changed or its site is gone. The person wanted to save time and still catch stale exceptions."
    decision: 5
  - id: q-12
    item: "mutation-exceptions"
    question: "Can an exception cover an uncovered mutant under --fail-uncovered? (a, recommended) No, survivors only: an uncovered mutant needs a test, not a reason. (b) Yes, both."
    answer: "(a) No, survivors only."
    decision: none
  - id: q-13
    item: "mutation-check-unrecorded-sites"
    question: "mutation check passes a function whose entry lacks sites a newer operator adds. What does check say? (a, recommended) The function is stale: its results predate the operator; check reports mutation.stale naming the unrecorded sites, and mutation run runs only those sites. (b) The function is missing, and every mutant runs again."
    answer: "(a) The function is stale, naming the unrecorded sites; mutation run runs only those sites."
    decision: 6
  - id: q-14
    item: "mutation-test-hash-since"
    question: "When a file's tests changed, mutation run --since drops the entries of the functions it does not judge, so check calls them missing and their survivors are lost. (a, recommended) Keep those entries, marked stale, so check calls them stale and their survivors are kept. (b) Record the tests' hashes per function instead of per file."
    answer: "(a) Keep them, marked stale."
    decision: none
  - id: q-15
    item: "mutation-sample-scope"
    question: "Snapshots do not record which tests decided an outcome (the file's own, --all-tests, or a --test-command), so mutation sample over --all-tests results reports false mismatches. (a, recommended) Record the scope per mutant outcome; mutation sample re-runs each mutant with its recorded scope by default, a flag overriding it. (b) Record it per file. (c) Leave it to the flags and drop the idea."
    answer: "(a) Record the scope per mutant outcome; sample re-runs each with its recorded scope by default."
    decision: 7
  - id: q-16
    item: "graph-snapshot-lookup"
    question: "How should the graph find a file's mutation snapshot, given .metrics is relative to the working directory and the graph matches snapshots by path suffix (ID-GRAPH-26)? (1) The graph looks a file's snapshot up exactly as mutation check does, dropping the suffix match for mutation results. (2) Keep the leniency and document it. (3) Anchor .metrics to the project root for every command, snapshots naming files from the root, so the suffix match has no reason to exist."
    answer: "(1) and (3) together: anchor .metrics at the project root for every command (snapshots-at-root, first), and the graph looks snapshots up as mutation check does (graph-snapshot-lookup)."
    decision: 8
  - id: q-17
    item: "test-attribution"
    question: "test-attribution: how does itos-cc learn a project's tests and run a selection? (a, recommended) itos-cc.yaml names a list command printing one test per line, its ID and optionally the file defining it, and a run template with {ids} and how IDs join; itos and itos-cc share only IDs and paths. (b) itos-cc parses itos's own list JSON."
    answer: "(a) itos-cc.yaml commands: a list command printing one test per line (ID, optionally its file), and a run template with {ids} and the join; only IDs and paths are shared."
    decision: 9
  - id: q-18
    item: "test-attribution"
    question: "test-attribution: how is coverage measured per test (itos has about 505 scenarios)? (a, recommended) One suite run: itos-cc sets a per-test coverage base and the harness gives each test's child processes GOCOVERDIR=<base>/<test-id>; itos-cc falls back to one run per test when the harness writes nothing there. (b) One run per test, with no harness cooperation."
    answer: "(a) One run, split by the harness into <base>/<test-id>; one run per test as the fallback."
    decision: 10
  - id: q-19
    item: "test-attribution"
    question: "test-attribution: when is a kill made by listed tests still fresh, without itos-cc reading the tests' format? (a, recommended) While the set of tests covering its line and the hashes of the files those tests name are unchanged (per-file granularity). (b) The list command prints a content hash per test, computed by the project."
    answer: "(a) The covering tests' set and the hashes of the files they name."
    decision: 11
  - id: q-20
    item: "test-attribution"
    question: "test-attribution: what does a mutant run once per-test coverage exists? (a, recommended) Its file's own tests first; only if it survives, the listed tests whose coverage reaches its line, as one selection run; uncovered only when neither covers its line. (b) Only the covering tests, with its own tests in the same pass."
    answer: "(a) Own tests first, then the covering listed tests only if it survives; uncovered only when neither covers its line."
    decision: 12
  - id: q-21
    item: "listed-tests-freshness"
    question: "Step code: itos's scenario checks live in Go step code (features/*_test.go), while q-19 hashes only the files that define the covering tests, so weakening a step leaves old end-to-end kills trusted. (a, recommended) mutation.tests gains support globs (such as features/*_test.go); their hashes join every listed kill's freshness, so a step-code edit stales every listed kill, each rerun running only its covering tests. (b) Only catch it by sampling listed kills nightly. (c) Accept the gap."
    answer: "(a) A support glob list in mutation.tests whose hashes join every listed kill's freshness. Found by a side agent after q-19 was answered."
    decision: 13
  - id: q-22
    item: "exceptions-deleted-file"
    question: "exceptions-deleted-file: what happens to an exception whose file is renamed, and do --since runs judge such entries? (a, recommended) It follows the rename where exactly one selected source holds its function's name and hash, still excepting the mutant there, and fails as mutation.exception-stale with why moved, naming the new file; a --since run whose range deleted or renamed the file judges it too. (b) It fails as gone and the mutant at the new path is a survivor. (c) It follows silently. For --since: (a) keep, (b) whole-project runs only."
    answer: "(a) Follow the rename and fail as moved, naming the new file; --since runs judge entries whose file the range deleted or renamed."
    decision: 14
  - id: q-23
    item: "timeout-allowance"
    question: "timeout-allowance: a mutant's timeout is its baseline's time times the factor, at least 2s, and on slow runners building the mutant can exceed it, so a survivor times out and counts as killed. (a, recommended) baseline times factor plus a fixed 5s, replacing the 2s minimum, as PIT and Stryker add a constant. (b) Rerun a timed-out mutant once with twice the timeout. (c) Give the flaky tests room and leave the product."
    answer: "(a) Baseline times the factor plus a fixed 5 seconds, replacing the 2-second minimum, for every kind of run."
    decision: 15
  - id: q-24
    item: "whole-suite-freshness"
    question: "Issue #20 closes the whole-suite freshness gap that ADR-0003 accepted. Recommended first slice: for Go, every outcome recorded with all-tests or test-command depends on all _test.go files beneath the nearest Go module root, excluding nested modules, plus mutation.tests.support globs at the project root. Include build-tagged tests conservatively. Feature files and other custom command inputs must match support globs; arbitrary inputs cannot be inferred. Apply evidence to all recorded broad-scope outcomes, not just kills, retain original scope on reuse, and never refresh evidence for unjudged outcomes in a partial run. Broad-scope snapshots without this evidence are stale and require rerunning. Own and listed scopes retain their existing dependencies; other languages remain separate work. This makes any suite-test or support edit stale the broad-scope results, costing more reruns. Choose (a) this Go-first scope, (b) a wider project-root/all-language policy specified before implementation, or (c) keep ADR-0003 and defer #20."
    answer: "Choose (a), the Go-first scope. For each Go outcome recorded with all-tests or test-command, freshness also depends on every _test.go file beneath the nearest Go module root, excluding nested modules, including build-tagged tests conservatively, and on project-root mutation.tests.support matches. Feature files and other custom-command inputs require explicit support globs. Record dependencies for all broad-scope outcomes, retain recorded scopes on reuse, and do not refresh unjudged outcomes in partial runs. Missing broad-scope evidence makes legacy results stale. Own and listed scopes keep their existing rules; other languages remain unchanged in this slice."
    decision: 16
  - id: q-25
    item: "uncovered-statements"
    question: "Issue #23 makes --fail-uncovered prove execution independently of mutation sites. Recommended first slice: Go only, every judged executable function including functions with zero mutation sites, using uncovered executable blocks from measured statement coverage rather than syntax-tree statement enumeration. Persist independent coverage evidence so mutation check gives the same verdict without running tests, and reuse it only while its source and test/support inputs remain fresh. Report uncovered blocks as mutation.uncovered-statement with file, function and line, separate from mutant counts. Strict mode must not pass when coverage evidence is unavailable or missing; --fail-uncovered with --no-coverage is a usage conflict. Non-strict mutation behavior remains unchanged. Do not add coverage exceptions or the new mutators from #24 in this slice. Choose (a) this Go-first strict policy, (b) limit statement checks to functions that already have sites, leaving zero-site functions outside the gate, or (c) design all-language coverage requirements before implementation."
    answer: "Choose (a), Go-first strict coverage. With --fail-uncovered, every judged executable Go function needs fresh measured coverage evidence, even if it has no mutation sites. Report uncovered executable coverage blocks as mutation.uncovered-statement, separate from mutant counts, with file, function and line. Persist evidence for cached check/run parity and reuse only with fresh source and test/support inputs. Missing or unavailable coverage cannot pass strict mode; --no-coverage conflicts with --fail-uncovered. Non-strict behavior and other languages remain unchanged. Do not add coverage exceptions or new mutators in this slice."
    decision: 17
  - id: q-26
    item: "uncovered-statements"
    question: "For #23 strict Go statement coverage, existing or explicit raw profiles have no proof that they describe current source and test inputs. Recommended first slice: reject --coverage-report and --use-existing-coverage in strict Go run as usage conflicts, including raw reports generated by --coverage-command; retain their current non-strict behavior. Built-in own/all-tests and configured listed coverage are admitted only when measurement succeeds now or matching independent cached evidence exists. Do not bless old reports by attaching current hashes. Fingerprint the actual coverage producer/options and conservative nearest-module Go source/test inventory, including build-tagged files, excluding nested modules, plus module go.mod/go.sum, project config and support matches; record relevant Go build environment. Changes, additions or removals stale the independent evidence. Opaque harness/external inputs require configured support and are not inferred. This keeps the first slice bounded but removes raw-profile workflows from strict mode. Choose (a) this built-in-only strict admission and conservative fingerprint rule, or (b) design an attested profile/sidecar format so strict mode can accept external or existing reports."
    answer: "Choose (a), built-in-only strict Go coverage admission. Strict Go run rejects raw --coverage-report, --use-existing-coverage and --coverage-command workflows rather than attaching current hashes to unattested profiles. Admit successful built-in/listed measurement and matching independent cached evidence. Fingerprint the recorded coverage producer/options, module Go source/test inventory (including build-tagged files, excluding nested modules), go.mod/go.sum, project config/support matches and relevant Go build environment. Compare additions, removals and edits. Opaque harness/external inputs require configured support and are not inferred. Non-strict and other-language report behavior remains unchanged."
    decision: 18
  - id: q-27
    item: "strict-go-coverage"
    question: "Strict Go coverage fingerprints currently stop at the nearest module. Active go.work files and local replace targets outside that module can introduce source inputs beyond that inventory. Recommended bounded first slice: refuse to admit or reuse strict statement-coverage evidence when an active Go workspace is used or a local replacement target is outside the selected source module; strict run/check must report that unsupported scope and cannot pass from old cached evidence. GOWORK=off disables workspace use and remains supported. Local replacements whose targets are inside the same inventoried module stay supported; do not follow arbitrary external directories. Non-strict behavior remains unchanged. Add regression coverage and record multi-module provenance support as separate future work. Choose (a) this explicit refusal, or (b) expand #23 now to fingerprint active workspace files, their modules and out-of-module local replacement dependency trees."
    answer: "Choose (a): refuse strict evidence for an active Go workspace or a local replacement target outside the inventoried source-module boundary, including excluded nested modules. Both strict run and strict check must report unsupported scope, and existing cached evidence cannot bypass the refusal. GOWORK=off remains supported; replacement inputs already inside the actual inventoried module remain supported. Do not follow arbitrary external dependency trees. Preserve non-strict behavior and record multi-module provenance as separate future work."
    decision: 19
  - id: q-28
    item: "debt-move-findings"
    question: "Issues #20 and #23 are complete with all-OS CI green. Issue #25 asks for old/new debt entry IDs when unchanged functions move, but this checkout only plans the debt file, top-level check, range/staged checks and debt list in IDEAS.md; no implementation exists. Recommended next step: specify the minimum debt schema/entry-ID and Git tree/index-reading foundation as separate small slices, then implement range/staged move reporting with regression tests. Agree on contracts before starting an implementor, and do not silently include every planned adopt/tighten/measurement command. This expands beyond a small JSON reporting patch. Choose (a) authorize scoping that minimal foundation now, or (b) leave #25 pending until the broader debt subsystem is built separately."
    answer: "Authorize scoping the minimum debt/check foundation as separate small slices before old/new move-ID reporting. Agree on debt schema/entry IDs and Git tree/index-reading contracts first. Do not silently include adopt, tighten, full measurement gating or every other planned debt command in this batch."
    decision: none
  - id: q-29
    item: "debt-inventory"
    question: "Debt IDs have not shipped locally. Recommend intrinsic metric:<file>#<namespace>#<name>, derived from structured fields, with percent escaped as %25 and # as %23 inside each component. Preserve slash-separated repository-relative path prefixes, case and Unicode; do not use line numbers, repository names or ordinal IDs. cc: belongs to the host-selected source alias, not the CLI. Reject ambiguous source selectors (such as indistinguishable repeated init functions) rather than invent unstable IDs. Debt schema version defines serialization. Alternative: retain planned metric:<file>#<namespace.name> with explicit injective escaping for the dot-joined symbol. Approve the separated-field intrinsic format or choose the planned dot spelling; neither is a shipped debt-format change."
    answer: "Use separated-field intrinsic IDs: metric:<file>#<namespace>#<name>, escaping literal percent as %25 and # as %23 within components. Preserve slash-separated repository-relative path prefixes, case and Unicode. The CLI never hard-codes cc:, which belongs to the host source alias. Derive IDs from structured selectors and reject ambiguous source selectors rather than assign unstable ordinals. Debt schema version defines this previously unshipped serialization."
    decision: none
  - id: q-30
    item: "debt-inventory"
    question: "Recommend itos-cc-debt.yaml schema1 with entries containing structured metric, file, namespace and name, plus crap max (finite nonnegative) or mutation min (percentage0..100), exactly the appropriate limit. No owner, stored ID/hash/line, measured value or timestamp. Derive ID/title/current snapshot location; unresolved entries remain listed with their committed ID/file and line:null, never silently dropped or retargeted. Absent file means empty inventory; a present empty/malformed file is an error. Strict YAML rejects unknown fields/schema/metrics, duplicate keys/IDs, aliases/merges, extra documents, invalid types and noncanonical/outside-root paths. CLI schema1 remains separate from debt_schema1. Recommend source-derived move identity instead of storing hashes now; dangling baseline entries cannot establish a move by themselves. Alternative: store versioned source-identity hashes in each entry, requiring manual maintenance until writers exist. Choose minimal source-derived selectors/limits or persisted identity hashes."
    answer: "Use the minimal source-derived schema1: structured metric/file/namespace/name selectors with CRAP max or mutation min percentage limits, deriving IDs and source locations from the selected Git snapshot rather than storing hashes or lines. Preserve unresolved committed entries with line:null. Absent debt file is empty inventory; malformed present files are errors. Strict parsing and separate CLI/debt schema versions follow the recommended contract."
    decision: none
  - id: q-31
    item: "debt-inventory"
    question: "Snapshot-correct source naming is a prerequisite: live lang.Parse can read go.mod or project markers from disk, so committed blobs alone are insufficient. Recommend Go-first debt-inventory/move foundation, resolving namespaces and functions exclusively from the selected Git tree or captured index including its go.mod, not current disk or working directory. Other-language selectors must fail explicitly as unsupported in this first slice rather than appear successfully resolved from live metadata. Missing Go source/function retains its entry with line:null; ambiguous selectors are errors. This narrows the first foundation and requires later language support before those projects use it. Alternative: support Go, TypeScript, Python and Kotlin now, with snapshot-aware namespace/marker resolution for each. Choose Go-first or all current languages; never use live namespace fallback for historical/index sources."
    answer: "Choose Go-first for the initial debt inventory and move foundation. Resolve Go source/namespaces only from the selected Git tree or captured index and its go.mod, never from live unstaged metadata or cwd fallback. Other-language selectors fail explicitly as unsupported for now. Missing source/function remains visible with line:null; ambiguous selectors are errors. Add other language support in later slices."
    decision: none
  - id: q-32
    item: "mutation-fail-fast"
    question: "Recommend --fail-fast stop on the earliest observed actionable FINAL judgment, not source-order determinism; an own-test survivor must finish applicable listed tests first. Publish one stop/admission latch preventing new command launches, cancel unfinished in-flight judgments immediately, and use a shared five-second post-stop cleanup deadline rather than draining baseline-derived timeouts. A parent-aborted mutant is cancelled/undecided, never timeout or killed. Known stale exceptions and strict coverage failures stop before avoidable later preparation. Keep selected planning/global coverage scope unchanged in this first design; do not promise streaming coverage or a total-run latency bound. Choose immediate cancellation with five-second cleanup, or bounded drain-before-cancel with its drain budget to be specified."
    answer: "Choose immediate cancellation at the earliest observed actionable final judgment, with one shared five-second post-stop cleanup deadline. Finish applicable listed stages before declaring a survivor final, stop new command admissions, and never classify parent-aborted work as timeout or killed. Stop known exception/strict failures before avoidable later work. Keep selected planning/global coverage scope unchanged for now, without claiming a five-second total-runtime or streaming-preparation guarantee."
    decision: 20
  - id: q-33
    item: "mutation-fail-fast"
    question: "Issue #26 needs owned-descendant cleanup, but current Windows cancellation kills only the parent and Unix groups cannot contain intentionally daemonized/session-escaping children. Recommend a separately verified process-supervision prerequisite: race-safe Windows Job Object ownership, Unix process-group ownership and cleanup on cancellation/command completion, joining all owned worker/output waiters. Apply supervision to the new fail-fast mode’s mutation/baseline/selection and list/coverage commands; never kill unrelated processes or by executable-name matching. Explicitly declare intentionally detaching/session-escaping Unix commands unsupported; do not claim container-strength isolation. Cleanup/start/ownership failures must be reported, never silently downgraded or recorded as mutant kills. Alternative: require stronger OS/container isolation to contain arbitrary escaping descendants before this feature can ship. Choose ordinary non-detaching owned process trees with that explicit boundary, or stronger isolation first."
    answer: "Choose supervised ordinary owned process trees: race-safe Windows Job Objects and Unix process groups, with cleanup on cancellation and command completion and joins of owned worker/output waiters. Intentionally daemonizing/session-escaping Unix commands are explicitly unsupported; this is not container-strength containment. Supervise the fail-fast mutation/baseline/selection/list/coverage paths, report startup/ownership/cleanup failures, never silently downgrade containment or turn them into mutant kills, and never target unrelated processes or match by executable name. Verify the supervision prerequisite separately before exposing --fail-fast."
    decision: 21
  - id: q-34
    item: "mutation-fail-fast"
    question: "Recommend fail-fast preserve every valid completed/reused judgment and its original scope/freshness evidence, including earlier judgments in a file whose later selection/baseline fails; this is an explicit new-mode exception to default whole-file preservation, and aggregate defaults stay unchanged. Cancelled/unattempted/blocked sites have no fabricated mutation outcome and cannot newly satisfy completeness; check validates recognized outcomes plus current-site enumeration. Genuinely fresh prior cache is not invalidated solely because a forced --mutate-all rerun was cancelled; current-run incompleteness and prior-cache completeness are separate facts. List all selected files in machine output, add stopped/complete/stop reason and disjoint completed/cancelled/unattempted/blocked work counts, plus actual baseline stage status without treating not-run as executed success. Keep mutation counts and judged selection identity meanings; leave source annotations unchanged for incomplete files. Choose preserving valid partial progress and explicit machine states, or discard progress from any interrupted/failed file while reporting it incomplete."
    answer: "Preserve valid completed/reused judgments and their original scope/freshness evidence in fail-fast mode, even when later work in the file fails. Aggregate behavior keeps existing snapshot rules. Cancelled, blocked and unattempted sites have no mutation outcome and cannot create completeness; check recognizes valid outcomes and enumerates current sites. Fresh prior evidence remains usable after a cancelled forced rerun, separately from the current run being incomplete. Include all selected files and explicit stopped/complete/stop-subject plus disjoint completed/cancelled/unattempted/blocked states and actual baseline stages. Preserve mutation count/judged meanings and leave annotations unchanged for incomplete files."
    decision: 22
  - id: q-35
    item: "mutation-command-ownership"
    question: "Process-tree cleanup has compilable pre-change behavioral tests through worker.run and killGroup, but the current worker exposes no parent context or deterministic ownership/cleanup failure seam. Recommend first recording actual cleanup reds and already-passing startup guards, then permitting explicitly labelled new-capability tests for cancellation result classification and injected supervision failures once the new API exists; never claim those tests were behavioral red against the old product. Alternative: split an enabling refactor/test-seam task first, preserving existing behavior, then demand behavioral reds against that prerequisite before implementing the remaining ownership behavior. Which test plan should govern ID-MUT-167/168? No product changes have begun."
    answer: "The person approved option 2 after the throwaway spike: scope and divide a separately checked execution/testability prerequisite before implementing owned-process cleanup. Preserve legacy worker.run caller behavior; new internal context and failure seams are explicit new capabilities, not original-product red evidence. Against the prerequisite, commit and observe compilable behavioral reds for the remaining ownership guarantees before fixing them. Keep the prerequisite small and separate cancellation/lifecycle improvements that cannot honestly be called behavior-preserving. Size the work before implementation; no full scheduler, public fail-fast flag or snapshot changes in the prerequisite."
    decision: none
  - id: q-36
    item: "mutation-fail-fast"
    question: "ADR-0021 requires Windows Job ownership as well as Unix process groups before --fail-fast is exposed, and Windows (#29) is deferred until a Windows machine. Linux and macOS supervision has landed (mutation-command-ownership, macos-counted-run). Recommend shipping --fail-fast on Linux and macOS first, refusing it on Windows before launching commands (fail-fast.platform, exit 3) as counted mode does, with Windows fail-fast a follow-up under #29. Alternative: keep #26 waiting for Windows ownership."
    answer: "Ship --fail-fast on Linux and macOS first; Windows refuses it with fail-fast.platform (exit 3) before launching commands, and Windows fail-fast follows under #29. The person agreed on 2026-10-10 (\"sure let's go with 26\", to that recommendation)."
