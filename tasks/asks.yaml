    item: "T-86"
    question: "T-86 (feature-owned vertical slices, so an ordinary feature change stays in one folder and agents can work on different features at once) needs ADR-0029's layout revised. Where do feature folders live, where do scenarios and steps live, how are commands assembled without central hand edits, and how is path ownership recorded? Recommended: internal/slices/<name>/ with engines left where they are; .feature files and steps stay in features/ with their hand lists generated; a stdlib generator writing a committed cmd/itos-cc/commands_gen.go, checked current in CI; ownership a docs convention first."
    answer: "The person's calls on 2026-10-20, each the recommendation. Feature folders live under internal/slices/<name>/: units, dry, scrap, crap, mutation (run, check, list, sample and except as one) and version, each owning its CLI and application code, its own pure domain, consumer-owned ports, adapters, fakes and tests in subpackages that keep the domain, port, porttest and adapter separation, so a slice's domain still imports no adapter, UI, kong or I/O. Engines stay where they are behind stable APIs: lang, selection, coverage, snapshot, project and git history, settings, process ownership, the UI in internal/cli and an import-resolution engine lifted out of graph. A slice imports no other slice, checked by tools/bin/architecture-check. The .feature files and their step code stay in features/, one harness; the hand lists in features/steps.go and the in-process driver's adapters are generated. Commands are assembled by a stdlib go/parser generator under tools/ that reads each slice's declaration and writes a committed cmd/itos-cc/commands_gen.go, registering slices through the kong fork's DynamicCommand in name order and binding ports through providers so itos-cc.yaml is still read only when a command runs; a CI static step checks the file is current. Which paths each slice owns is a docs convention first, engines, generated files and assembly needing a task of their own; an itos feature only if the parallel-agents trial after T-86 shows agents straying. The coordinator's calls: slices take their ports as methods on cmd's adapters; duplication's Fingerprint and Jaccard move into lang, used by dry and scrap; graph keeps a copy of changerisk's four-line Score; serve and graph stay legacy outside the slices; cmd's mutation integration tests stay in cmd as assembly tests that mutation owns by path."
    decision: 51
  - id: q-73
    question: "Where do the scenarios run outside CI? (a, recommended) Locally the in-process driver alone, with the ports' fakes; the binary driver is opt-in by an environment variable that ci.yml and cd.yml set, so CI keeps its binary smoke set and range-named scenarios and CD the whole binary suite on every system, the @binary-only scenarios (real tools, real processes and signals, real builds and folders) running there only. (b) Locally the in-process driver plus the binary driver for the @binary-only and deferred scenarios alone, needing every real tool installed. (c) Locally both drivers in full, as today: itos.yaml's scenario lines, go test ./... and crap or mutation over this repository build and run the binary."
    answer: "(a), the person on 2026-10-21: local runs are in-memory end-to-end tests with fakes, as a FastAPI service's TestClient with dependency overrides; the real binary is CI's and CD's. Whether code only the @binary-only scenarios reach should gain contract or adapter tests that run locally is a separate item, measured before it is built."
    decision: 52
  - id: q-74
    item: "dart-support"
    question: "Which Dart projects does the first version support? (a, recommended) Flutter apps and packages, run with flutter test, all five commands (units, dry, scrap, crap, mutation), Flutter 3.27 or newer with Dart 3.6 (pub workspaces); pure Dart packages (dart test) become a later idea. (b) Flutter and pure Dart together from the start: a second runner, coverage path base and CI install to build and keep. (c) Flutter with fewer commands first (units, dry, scrap, crap) and mutation later."
  - id: q-75
    item: "dart-support"
    question: "What does itos-cc do with a Flutter app's platform folders (android, ios, macos, linux, windows, web)? android holds a Gradle build with MainActivity.kt, which today reads as a Kotlin project: crap and mutation would plan Gradle for it, and a strict run fails on the unmeasured language. (a, recommended) A pubspec.yaml that depends on the flutter SDK makes those folders part of the Flutter app, left out of measuring, mutation and worker copies by default; a project that wants its Kotlin or Swift measured names it in itos-cc.yaml. (b) Measure each platform folder as its own build root, as today: Gradle runs for android in every crap and mutation run. (c) Leave them in but never fail a strict run on them."
  - id: q-76
    item: "dart-support"
    question: "Which Flutter tests count, and how is coverage measured? (a, recommended) Unit and widget tests under test/ (headless, flutter_tester); integration_test/ and test_driver/ never count, as they need a device. Line coverage from flutter test's LCOV, a lib/ file the report never names counting as 0%; coverage attributed per test file, not per test name (Flutter's 2-5 s start per run makes per-name too slow); no coverage of processes tests start (no GOCOVERDIR analogue), as decisions 26 and 27 allow. (b) As (a) plus per-test-name coverage, at one flutter test start per test. (c) As (a) plus integration_test/ on a device or emulator where one is present."
  - id: q-77
    item: "dart-support"
    question: "What about generated Dart code (*.g.dart, *.freezed.dart, *.mocks.dart, l10n output)? (a, recommended) Left out of every measure and of mutation by default, recognised by its generated-file header or those globs, and coverage:ignore-line/start/end/file pragmas honoured as not coverable; worker copies keep the files so tests still compile; itos-cc.yaml can bring a file back. (b) Measured like any source, the project excluding them in itos-cc.yaml itself. (c) Only the pragmas honoured, no default exclusion."
  - id: q-78
    item: "dart-support"
    question: "May Dart's items be built by several implementing agents at once, each in its own worktree with the hooks installed, after the slices refactor closes? (a, recommended) Yes, as the parallel trial: one agent alone for the grammar and language engine (D1), then up to five at once for selection, dry, scrap, coverage and crap, and reach (D2-D6), each item's files disjoint from the others' (shared tables, go.mod and cd.yml each owned by one item), the coordinator landing them one at a time; then mutation and CI, strict evidence and counted runs, and docs. (b) Two at a time first, widening if it goes well. (c) One agent at a time, as now."
  - id: q-79
    item: "T-165"
    question: "ADR-0051 says the in-process driver's adapters are generated. The plan for slices-scenario-registration found they change per port, not per slice: a slice declaring only ports cmd's adapters already answer adds nothing, and which fake answers each port is knowledge no slice declaration holds. Should they be generated? (a, recommended) No: they stay hand-written, moved into an inProcessAdapters provider beside diskAdapters, and a test fails when any adapters field is unbound on disk or in process, so a new port cannot be forgotten in either; recorded as an amendment to ADR-0051. (b) Yes, as ADR-0051 says: every port gets a named in-process constructor by convention and a generator writes adapters, diskAdapters and the in-process literal, rewriting 14 adapters literals across 5 files. (c) Neither now: leave memory.Run as it is and revisit when a slice adds a port."
