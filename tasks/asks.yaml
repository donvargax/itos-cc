  - id: q-68
    item: "p1-counted-live-tool-caches"
    question: "p1-counted-live-tool-caches (found by T-128): a counted run links the live project's node_modules into its frozen export, so Vitest writes node_modules/.vite/vitest/<hash>/results.json into the live project. Recommended: give the export's tools caches of their own (Vite's cacheDir, or a .vite and .cache beside the export, removed with it), so a counted run keeps its promise that the live working tree is left unchanged, ignored files included. Alternative: allow writes to dependency caches git ignores, and say so in the scenario 'A counted run judges a project through its installed tools, offline'."
