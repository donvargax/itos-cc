    answer: "Skip ignored files (person, 2026-10-18): worker copies leave out files git ignores, apart from the dependency folders the copies already link (node_modules, a virtualenv, Gradle's caches), so a test's leftovers and stray build output never reach a copy; specified as its own slice after slice-13."
