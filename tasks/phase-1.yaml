- id: T-33
  type: build
  title: itos-cc builds with a kong fork whose user-input failures are typed
  why: >
    q-55: kong v1.16.1 reports every user-input failure as a plain string, its unknown-flag type
    unexported, so an unknown flag, an unknown command and a stray argument cannot be told apart
    without matching text. In the donvargax/kong fork, each user-input failure becomes an exported
    error type, wrapped in ParseError and matched with errors.As, its Error() text byte for byte as
    before: unknown flag (flag, candidates), unexpected argument (argument, whether a command was
    expected, candidates), unexpected token, missing value and invalid value (flag or argument,
    value, expected type), a value outside its enum (allowed values), missing required flags,
    missing positional arguments, a missing command (candidates), xor conflicts and and-groups
    (flags); errors in an app's own declarations stay strings. kong's own tests pass, with a test
    for each type. The fork's own module path is github.com/donvargax/kong, which itos-cc imports
    at a pinned version, never through a replace: go install refuses a module whose go.mod has one,
    and the README installs itos-cc with go install. The PR goes from a branch of the fork that keeps
    kong's module path: once the pilot (T-32) proves the types, to alecthomas/kong, disclosing AI
    assistance, after the person's review; when a kong release carries them, itos-cc imports kong
    again. Nothing that needs the fork goes into the go-template-itos issue until then.
