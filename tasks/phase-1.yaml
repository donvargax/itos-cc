- id: T-162
  type: refactor
  title: Lift import resolution out of graph into internal/imports
  why: >
    T-86 (ADR-0051, R11), after T-161: the import-resolution engine ADR-0051 lists. Import
    resolution lives in serve's legacy graph package; the mutation slice reaches it through
    importgraph's Reach (internal/slices/mutation/adapters/importgraph/reach.go,
    graph.TestsImporting) while graph imports the slice's domain, so the two depend on each other
    and only importgraph being a package of its own keeps Go from a cycle. Move it into
    internal/imports, package imports, an adapter-side engine as internal/processes is (not a
    domain, not lang-side: it parses through project.ParseFile, finds markers with project.FindUp
    and reads and decodes tsconfig.json, which domain-io and decision 50 refuse in lang). The move
    commit git mv's graph/tests.go to internal/imports/reach.go, graph/tsconfig.go to
    internal/imports/tsconfig.go, graph/tests_test.go to internal/imports/reach_test.go and
    .metrics/mutate/graph/tsconfig.go.json to .metrics/mutate/internal/imports/tsconfig.go.json
    (contents as they are, as 5fbd27b did), and cuts into internal/imports/resolve.go graph.go's
    resolver (moduleID, resolveAll, index, resolve, typescript, tsFile, aliases, python,
    pythonModule, samePackage, kotlin, join, parentModule) and build.go's dependencies, with only
    the edits needed to build; graph_test.go's TestTSConfigAliases and TestStripJSONC move to
    internal/imports/tsconfig_test.go. The API: File (Rel, Abs, Language, Namespace exported, the
    fields graph reads; imports, test flag and Kotlin's declared and used names unexported);
    Of(root, *lang.File) File (was dependencies); Resolve(ctx, root, files []File) Resolution with
    Module(f) (slash-separated from the root, "(root)" for a root Go package or Python __init__.py,
    the package directory for those, the file without its extension elsewhere), Edges (import
    statements and Kotlin same-package uses between modules, with counts) and External (each
    module's packages from outside the repository); Reach(ctx, root, sources, tests []File)
    map[string][]string (was importingTests and applyingConftests); TestsImporting(ctx, root string,
    sources, tests []string) (map[string][]string, error), keeping graph's doc comment. The engine
    keeps its own stopped, rel and appendUnique (ADR-0051's small duplication) and imports the
    coverage runner for coverage.PythonTestFile, so pytest's naming rule stays one copy. Afterwards
    graph's fileInfo holds an imports.File, parse and parseTest call imports.Of, Build calls
    imports.Reach, newRepoGraph builds module ids as name + "/" + Resolution.Module(f) and takes
    edges and External from the Resolution (http.go uses the same ids); graph.TestsImporting goes
    and stale_test.go calls the engine's. importgraph keeps its name and stays a thin adapter of its
    own: its Reach calls imports.TestsImporting and still turns the context's cause into
    InputCancelled and an error into InputFailed (an engine imports no slice, so it cannot return
    the domain's failures); it imports neither graph nor project. graph keeps its dependency on the
    mutation domain (serve reading mutation's judgment; slices-close names it an allowed legacy
    consumer), now the one arrow between them. Rules: a new imports rule over
    **/internal/imports/**, code and tests, allowing internal/lang$, project$ and coverage$ and
    denying the module, one deny entry only (T-159's sorted-prefix trap); slices and slice-fakes
    exclude **/internal/imports/**; importgraph's allow list becomes the domain and
    internal/imports$, dropping project$ and graph$, its never-merge comment rewritten.
    check_test.go: internal/imports joins the stubs and every target and layer list (domain,
    adapters, slices, ui, processes, kong, rapid, cmd/probe's allowed list); importgraph's row
    allows mutation's domain and internal/imports and refuses graph and project; a new engine block
    like processes', code and tests, refusing every domain but lang, every slice, adapter (T-161's
    included) and porttest, the UI, cmd/probe, internal/version, graph, config and metrics,
    accepting lang, project, coverage, os and encoding/json; graph importing the engine accepted.
    Comments naming graph.TestsImporting follow (internal/coverage/port/measurer.go, the mutation
    domain's run.go and doc.go). Docs: docs/go.md (an internal/imports bullet after
    internal/processes, importgraph's adapter notes, the adapter boundary bullet and an imports
    boundary bullet beside processes'), docs/architecture.md, README's layout table (adapters row, a
    new internal/imports row, the graph row). Unchanged: graph's /api/graph output (node ids,
    parents, labels, edges and counts, external packages, units, metrics, staleness), every
    TestsImporting result, cancellation, parse errors as project words them, serve's watching and
    rebuilds (Build's signature and caches; a tsconfig.json edit alone still triggers no rebuild),
    every message. Before the first commit and after the last, marshal graph.NewBuilder's graph over
    testdata/shop and over the repository root, diff the JSON, commit nothing of it, and state the
    result in the docs commit's body. In process, the MUT reach scenarios bind porttest's declared
    Reach, so they guard the slice side only; the engine's local evidence is its moved tests,
    graph's tests, importgraph's ReachContract and freshenv's fixtures over the real Reach. The
    moved snapshots' stale entries are the nightly run's to refresh (no local mutation run).
- id: T-163
  type: refactor
  title: Resolve each language's imports through a resolver of its own in internal/imports
  why: >
    T-86 (ADR-0051, R11, second half), after the engine's lift, so adding a language to import
    resolution is a new resolver in internal/imports, never an edit to its callers or to switches
    across it: Dart's reach (docs/dart/touchpoints.md) needs package:, relative, export and part
    resolution and flutter_test_config.dart as a support file. Today each language is a case in
    about six places: Module's Go and __init__.py rule, the index's switch, resolve's switch,
    samePackage's and Of's Kotlin checks, Reach's Go one-hop branch and Python's conftests. Put them
    behind an unexported language interface: facts(file, *lang.File) (what Of keeps beyond imports,
    Kotlin's declared and used names), module(file) (the module from the root), index(root, files)
    (a resolver over its own language's files in one Resolve call, with resolve(ctx, file, imp)
    returning modules and external packages and unimported(file) returning modules used with no
    import, Kotlin's same package; the TypeScript tsconfig cache stays scoped to one Resolve call),
    oneHop() (Go's own package plus its importers) and support(tests) (the implicit support files a
    test loads, today pytest's conftest.py up to its build root found by FindUp, else the root).
    Each language in a file of its own (golang.go, python.go, typescript.go beside tsconfig.go,
    kotlin.go), and languages.go holding the table keyed by the lang.Spec name as a literal, no init
    registry; a language with no entry keeps today's default (its module is the file without its
    extension, no index, nothing resolves, its tests reach transitively). Resolve, Reach and Of loop
    over the table and name no language. No file moves and the public API (File, Of, Resolve and its
    Resolution, Reach, TestsImporting) is unchanged, so graph, importgraph, cmd, the rules and
    check_test.go are untouched; Dart's part of <name> form may later need module to see the index,
    which Resolution.Module already absorbs, so nothing speculative is built. docs/go.md's
    internal/imports bullet says a language is a resolver in a file of its own plus a line in
    languages.go, and docs/dart/touchpoints.md's import-resolution rows name internal/imports'
    files. Unchanged, as the engine's tests, graph's tests and importgraph's ReachContract hold:
    every module id, edge and count, external package, reach list and its order, the tsconfig cache
    per directory, cancellation; no runtime.GOOS anywhere.
