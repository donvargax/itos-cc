- id: T-151
  type: refactor
  title: Lift process ownership out of mutation's worktrees into an engine
  why: >
    T-86 (ADR-0051), before crap moves. internal/worktrees, mutation's workers adapter, holds the
    process-ownership engine both mutation and crap use: OwnedExecutor (owned_executor.go),
