- id: T-117
  type: test
  title: Reuse a manifest-driven runner for scenario assertion checks
  why: >
    The person approved the recommended refactor speedups on 2026-10-15. Consolidate
    the repeated temporary strictness runners before T80, after T79 is accepted.
    This is developer test infrastructure, not a product command or a new mutation
    testing engine. Use the existing Go toolchain and standard library, plus an
    already-pinned Gherkin library only if needed; no new runtime or dependency.
    Put the small executable at tools/bin/step-strictness, following the existing
    Go tools, and document its invocation and evidence limits in features/README.md.
    Reuse the proven runner's serial edit/run/restore approach rather than build a
    framework, parallel runner, automatic expectation generator or new CI tier.
    The manifest follows docs/CONFIG.md where applicable: version 1, documented
    required fields/defaults and a matching JSON Schema, with unknown versions,
    unknown or duplicate keys and invalid values refused before edits. A JSON
    manifest explicitly identifies each reviewed assertion edit, its selected
    scenario ID, source path, original and replacement text and intended failing
    assertion. Refuse empty edits, duplicate probe labels, unsafe or symlinked paths,
    output paths overlapping edited files, missing targets and ambiguous matches
    before changing source. Scope or unique surrounding text must distinguish
    identical checks: T79's first zero-weight probe changed the unselected157 check
    while running158, so its passing result was invalid and excluded. Restrict edits
    to acceptance feature/step source under features; never mutate product sources.
    The expected failure identifies the actual selected scenario and assertion,
    not merely a nonzero exit or any And line. Establish a green control for each
    selected scenario before edits, batching the control selection where practical.
    Run only that probe's selected scenario for each edit, using the existing
    TestFeatures harness and default Go test timeout, with a bounded runner deadline.
    A detected assertion requires the intended step to be reached and fail, including
    the required outline examples. Compile/setup/When failures, an unexpected step,
    undefined or ambiguous steps, timeout, a skipped/omitted selection and zero
    scenarios are invalid evidence. An unchanged passing assertion is reported as
    undetected, never counted as success. Do not infer native-platform execution
    from a skip. Preserve raw logs, actual subprocess status, scenario/step failures
    and a machine-readable report distinguishing detected, undetected and invalid
    probes, with explicit counts and original/restored source hashes. Retried
    attempts use distinct log paths; never overwrite an earlier attempt or point
    its record at a different run.
    Capture the exact initial bytes and modes, including legitimate uncommitted
    implementation work, before editing. Validate the whole manifest first, keep
    durable recovery data outside the source tree, and restore after each probe and
    every handled failure, deadline or interruption. Stop and join the owned runner
    before restoring; use the caller's context and existing platform call patterns,
    without inventing a general process supervisor or deferred Windows ownership.
    Verify restoration by content hashes and modes. Never overwrite an unexpected
    concurrent edit during restore; retain recovery data and report the conflict.
    Document recovery after an uncatchable kill rather than claiming finally runs
    under SIGKILL. Use the shared checkout with one implementing agent, no worktrees.
    Add focused tests for wrong-step and compile/setup/skip rejection, ambiguous edit
    targets and duplicate probe labels, undetected assertions and restoration on
    success and handled failures.
    Small disposable fixtures and parser transcripts are appropriate; retain a tiny
    real smoke manifest using already-live MUT156 for end-to-end validation and
    demonstrate at least one actual intended assertion failure and exact restoration.
    Run the tiny real plan locally with go run ./tools/bin/step-strictness -plan
    tools/testdata/step-strictness/smoke.json, recording the resulting evidence.
    This is local task validation, not a ledger check that CI would execute over
    its checkout. A synthetic transcript alone is not that end-to-end evidence.
    Do not replay all
    95 T79 probes merely to validate reuse, and do not add the destructive smoke
    invocation to push gates or run it beside another writer. Existing gates and
    timeouts stay intact. Record actual runtime and the reusable command, not an
    unmeasured speed claim. Later conversions use the runner with their own explicit
    probes and still require review of assertion coverage and real final green runs.
    Keep pytest autoload suppression fixture-local where the owned tests need no
    plugins, as current mutation fixtures already do. Carry the actual environment
    input into Run.Env and future fake-port fingerprints. Do not change the product's
    pytest defaults, dependency caches, listed baselines or nightly mutation policy.
    Dependency reuse is settled from the pinned godog v0.16.0 source:
    its built-in cucumber formatter already emits JSON with feature URI,
    scenario tags and expanded examples, step line/name/keyword and each
    actual result status/error. Consume that report to identify expected
    assertion failures and actual baseline/example execution. Add only an
    optional test-harness report flag to features/features_test.go, writing
    cucumber output to the runner-owned attempt directory alongside the
    existing pretty output (godog supports simultaneous formatters). The
    default harness output and selection remain unchanged; this is never
    a flag of the product binary. Preserve raw test logs as well as the
    original structured reports. A missing or malformed report is invalid
    evidence. Follow actual report statuses and scenario identity; a failed
    setup And cannot count as the expected assertion. Do not reconstruct
    these facts by parsing colored pretty-output summaries or add another
    reporting library, callback framework or copied godog implementation.
    Normalize keyword whitespace and resolve And/But through the preceding
    Given/When/Then phase; only an assertion-phase failure qualifies. Require
    a reviewed error token alongside intended step identity to distinguish
    the assertion from a hook or other error attached to that same step.
    Match required expanded examples against the actual green control's
    complete case inventory, not an inferred count from pretty summaries.
    Godog skipping later steps after the intended assertion fails is its
    normal failure cascade, not an omitted scenario. Distinguish that from
    a case that never reaches the expected assertion or runs no steps.
    Bound this developer tool to Linux and macOS process execution for now.
    Reuse the existing minimal POSIX process-group cancellation pattern and
    stop/join before restoration; do not build a general supervisor. Windows
    execution must fail explicitly before any source or evidence-file write,
    with no partial supported run. Keep parser, validation and recovery tests
    portable and test that refusal. Do not use taskkill's process-tree snapshot
    as captured ownership or claim that WaitDelay proves child termination.
    This limitation belongs to the assertion tool, not the product's supported
    platforms or deferred mutation ownership. Document it; actual native
    Windows product scenarios still run in the existing CI as specified.
    Accept ordinary source permission bits only; refuse setuid, setgid or
    sticky bits before writes, and preserve a concurrent addition as a
    conflict rather than silently dropping it during exact restoration.
    The first implementation 70e2c8f, pushed with specification 26a4f62,
    passed the local package and live MUT156 smoke but failed macOS CI
    38764010659: two direct restoration tests used t.TempDir's /var alias
    after prepare had canonicalized the owned source to /private/var.
    The safety guard correctly refused that symlinked path. Revert 24562fc
    removed the attempt immediately. Retain the failed logs and successful
    live smoke evidence; canonicalize the owned fixture root, preserve the
    noLinks guard, and pass the focused package and exact repaired CI.

- id: T-118
  type: test
  title: Observe joined fixture peers before cooperative cleanup
  why: >
    The specification-only c5ef771 workflow 38850524767, macOS job 116810496982, failed only in
    MUT184 after-scenario cleanup with three TCP connection-reset errors. Its product source is
    identical to the previously green T91 source. MUT184's interrupted control actually joins its
    product and captures three authenticated helpers, but its logical assertions do not consume
    their EOF. mutationExecution.cleanup currently calls cooperative peer Close, which writes late
    STOP before reading those already-ended sockets. After the existing unrelated-control join/EOF
    and before peers.Close, when owned is nonnil and owned.returned, observe strict EOF on every
    captured owned peer under the existing cleanup context. This is fixture cleanup only, with no
    feature prose, product behavior, protocol API, new timeout or public termination claim. Keep
    bounded cooperative Stop for live/error setup and preserve every EOF/reset/protocol/deadline
    failure; never treat reset or timeout as EOF or swallow Close errors. Add a real
    authenticated-helper regression guard against the current cleanup API that compiles and fails
    the no-late-STOP assertion before the helper fix, preserving raw red evidence and committing
    that test first. The helper must actually exit and be joined; observe actual connection writes
    rather than expected-call mocks or sleeps. Retain strict EOF/Ping/authentication/protocol
    negatives and live Stop/cancellation-join guards. Run focused peer tests and native MUT184 plus
    interruption/ownership neighbors, reporting actual native passes and typed platform omissions
    separately. Broader gates run only through normal hooks and exact full CI. Keep all T92 source
    safely stashed until this separate test task is full-green, closed and published, then retake
    T92 before restoring its exact owned work. No own-code mutation, new dependency,
    agents/worktrees, gate weakening or published rewrite.
- id: T-119
  type: ci
  title: Enforce Go lint across the completed refactor module
  why: >
    Complete the parked gate-golangci-lint requirement after T-116 and before
    refactor-final-proof. ADR-0033 requires each adopted gate to have its own
    task. The current active itos.yaml runs pinned golangci-lint only over
    internal, which is not evidence that cmd, top-level libraries and tools
    pass the module-wide check requested by the adoption. Widen the actual
    configured push-CI command to tools/bin/pinned golangci-lint run ./...,
    retaining the pinned tool and every valid existing rule and architecture
    fixture. Fix findings in their owning code; no blanket directory/test
    exclusions, weakened length or context rules, suppression of valid
    findings, or replacement with a narrower green command. New package
    arrows follow the completed layout and existing documented extension
    procedure, with accepted/refused fixtures for any changed boundary.
    Preserve public behavior, raw errors and output, snapshot/config bytes,
    notices, contributors and harvested-source credits. Any behavior change
    is separate specified work, not a lint cleanup. Keep focused affected
    checks meaningful and run broad gates through their configured hooks and
    CI rather than a repeated manual preflight. The final exact pushed head
    must show the module-wide lint command actually passing; presence of the
    configuration or an earlier internal-only pass does not establish it.
    Record the completed-source head for final equivalence proof so that
    any fixes here are included in that one comparison. Do not start final
    proof or own-source mutation, change nightly T-46, or implement T-86.
- id: T-120
  type: ci
  title: Declare a fast project pre-commit hook and document clone setup
  why: >
    Complete the parked pre-commit-hook requirement after T-119 and before
    refactor-final-proof, separately from the module-wide lint gate as
    ADR-0033 requires. A present tools/hooks/pre-commit script is not a
    declared project hook: the observed clone declares only itos commit-msg
    and pre-push, and README has no project hook setup recipe. Reconcile the
    inherited full-module lint and network vulnerability checks with the
    current check-tier policy. The project pre-commit hook performs only a
    fast deterministic check of the staged Go formatting; full-module lint
    stays in configured push CI, and all valid active CI/pre-push checks,
    including the existing govulncheck step, stay enabled. Do not add another
    full-module or network gate to every commit, or silently move or disable
    a currently valid gate. Document the actual placement and its reason,
    distinguishing the inherited template script from the project's hook.
    Check the staged blob, not unstaged working-tree content. Reject an
    unformatted staged Go file even if the working copy was fixed, and
    accept a formatted staged blob with unrelated unstaged edits. Deleted
    paths, non-Go/prose-only commits and existing unrelated unformatted Go
    files must not trigger extra work. Preserve paths with spaces. Report
    relevant paths and leave index/worktree bytes untouched; no automatic
    staging, rewriting or commit bypass. Preserve third-party notices and
    harvested-source credits when adapting the script. Add the smallest
    fixture check tools/bin/pre-commit-check exercising accepted/refused
    real Git commits in an owned temporary repository, including actual
    hook invocation, staged-versus-unstaged controls and a spaced path.
    This developer check mutates fixture files only, never our own sources.
    Declare the project hook in this clone through supported local git
    hook configuration while preserving itos's hooks and other settings.
    Document exact repeatable per-clone declaration/verification in README;
    do not claim other clones are configured or rely on script existence.
    Record actual declaration and functional evidence before closure.
    No public CLI, release, mutation-proof or future T-86 changes belong here.
- id: T-121
  type: test
  title: Bound native ownership timeout fixtures independently of baseline duration
  why: >
    A spec-only push at ddf6b91 surfaced native macOS workflow 38874803995 job 116887159857 failing
    MUT187, ownedRemoved: owned cleanup exceeded bounded return. Its committed product is identical
    to d3f3e2e, whose full workflow 38871215262 passed. This is an independently surfaced fixture
    setup gap, not a new T94 product regression or an itos defect; artifact upload failures are
    cascades. The actual timeout wait took10.235 seconds, while owned peer EOF and the recorded
    timeout outcome passed. Native baseline duration is measured runtime, not the Tests
    declaration's nominal100ms. With the default timeout factor10, the mutant deadline is10 times
    that runtime plus5 seconds; the existing10second return guard starts before that deadline
    expires. Give ONLY the ordinary timeout fixture its existing positive public flag
    --timeout-factor 0.01, leaving counted, success, cancellation and fail-fast parameters
    unchanged. Preserve every existing10second/EOF/tree identity/
    worker-removal/source-restoration/unrelated-process/timeout-outcome assertion. Do not increase
    thresholds, add retries/skips or implementation-mirroring argument tests, change product
    behavior or gates, or alter feature text. Existing actual native ownership scenarios hold this
    fixture repair. Record original red CI and phase-labelled focused raw reports; require actual165
    execution locally on Linux and actual187 on macOS in exact source CI, with all applicable
    controls and platform omissions reported honestly. No own-source mutation, new dependency,
    agents/worktrees or per-task binary comparison. T94 WIP is safely preserved separately; complete
    and publish this repair before supported T94 retake and restoration of its own paths.
- id: T-122
  type: ci
  title: Cut CI time per push by skipping tests on prose-only ranges and parallelizing the slow test steps
  why: >
    Every push runs the whole test matrix, about 22 minutes on the critical path, even a prose-only
    take, queue or close commit that changes only tasks/ (c857b28's run 38915572729 took 21 minutes
    while its ci job took 26 seconds). Each refactor item makes about three pushes, so CI time
    dominates the loop. Measured on run 38911387674 (8f77daa): ubuntu test 22 min, of which go test
    ./... 3.5 min and the installed language tools step 15.4 min run one after the other; windows go
    test ./... 13.3 min; macos 12 min; ci job 2.4 min. Do three things and nothing else. (1)
    Prose-only: add a small scope job that computes the same range as the ci job (itos ci range with
    the same head and base) and asks itos ci scope FROM TO; the test matrix and the new language
    jobs skip when it says docs_only=true. An empty FROM (no green run to start from) runs
    everything, never skips. Never reimplement ci.prose.paths matching in shell or YAML paths
    filters: itos ci scope is the one rule. The scope job must add no more than about a minute
    before the test jobs start on a source push. The ci job stays as it is, verify and its prose
    plan included. A run whose test jobs were skipped must still conclude success, so itos ci watch
    and itos work done read it green, and the release job must still run on a range that is not
    prose-only and cut nothing on a prose-only one exactly as today; check how needs treats skipped
    jobs and use explicit conditions on the release job if needed, never dropping ci or a test job
    from its needs. (2) Language tools: move the real TypeScript, Python, Kotlin and Maven step out
    of test (ubuntu-latest) into its own job named languages, running beside the matrix rather than
    after go test, sharded so the slowest shard is well under the current 15 minutes (for example by
    language, with the Kotlin/Maven and Go-startup families split as their timings say). Every Go
    test name and every scenario selector the current step runs must run in exactly one shard with
    the same environment (ITOS_CC_LANGUAGE_TOOLS, ITOS_CC_NODE_MODULES, pinned tool versions,
    caches, Maven SHA-512 check); write the old-to-new selector map in the commit body and verify
    the union equals the old list, none dropped. Each shard sets up only the tools its tests need.
    (3) Windows: measure from run 38911387674's log (go test -json or the per-package times) which
    packages dominate windows go test ./..., then split go test into parallel jobs or matrix entries
    along that measurement so no test job's critical path exceeds about 10 minutes; every package
    still runs on every OS it runs on today, with the same ITOS_CC_SKIP_FEATURES and timeout, and
    the native scenario steps and their artifact uploads keep running on all three systems. No test,
    scenario, check or platform may be removed, skipped on source ranges or weakened; only order,
    parallelism and the prose-only skip change. Keep the workflow's comments in its style, naming
    why each job exists, and update the existing comments that the change makes untrue. Pinned
    action SHAs stay pinned; no new third-party action without a recorded selection. Verify on the
    real CI after the push: report the source push's run with its critical path and each job's time,
    and a prose-only push's run (the item's close commit counts) showing the test jobs skipped and
    the run green; target under about 10 minutes for a source push and under about 3 for a
    prose-only one, and say plainly if a target is missed and why. Recorded 2026-10-17 by the
    person's request; queued before T-98.
- id: T-123
  type: ci
  title: Cancel a superseded run's test and language jobs
  why: >
    T-122 runs about 19 jobs at once per source push, near the free plan's 20 concurrent jobs and 5
    macOS ones, so two overlapping pushes queue each other's jobs. A newer push's run already covers
    the older run's commits: itos ci range starts at the last green run, and itos push, ci watch and
    work done follow the newer run when one is cancelled (itos#17). So the test and languages jobs
    get job-level concurrency per ref and matrix entry with cancel-in-progress true. It is not set
    at workflow level, because that would cancel a release job halfway through publishing; the
    release job keeps its own never-cancelled group, and an older run whose tests were cancelled
    cuts no release because its release condition needs them to pass. The ci and scope jobs are
    cheap and keep running. Recorded 2026-10-17 at the person's request.
- id: T-124
  type: docs
  title: Say why mocking libraries are banned
  why: >
    docs/engineering.md bans mocking libraries and scripts of expected calls, but not why the
    library ban exists. The point is to keep call assertions out: a generated double that returns
    canned values is only a stub, and once a library is in the module its EXPECT style is one
    keystroke away. Fakes with state, held to the real adapters by shared port contracts, are what
    the tests use; even no-write checks read the fake's state. One sentence so agents read it as
    intent, not a tool list. Recorded 2026-10-17 at the person's request.
- id: T-125
  type: refactor
  title: Run the mutation scenarios in process
  why: >
    Split from T-100 on 2026-10-17: T-100 moves the run handlers into the slice; this item makes the
    converted mutation scenarios run through the in-memory driver as well as the binary. T-100's S7
    rules hold here unchanged: the domain knows no UI or I/O, adapters are chosen at cmd, our fakes
    and never mocks or scripted calls, no own-code mutation runs, no new dependencies, targeted
    local checks with broad gates through hooks and CI, equivalence cases added to
    refactor-final-proof. Complete memory Driver.Tests/Coverage/import/history/exception plumbing so
    the same converted scenarios execute through both drivers. Retain binary-only only for genuine
    external process ownership, worker-copy links/PYTHONPATH/bytecode, real integration collectors,
    counted preparation stages and static tool inventory that memory cannot faithfully stand in for.
    Every intentional skip must be visible; no vacuous pass of unimplemented fake behavior. Add
    mutate.feature to InProcess. Remove ITOS_CC_SKIP_FEATURES=mutate.feature from every CI job that
    sets it (the ci job and each test part since T-122) so pushCI again runs mutation scenarios
    through the normal merged selection; language-tools line remains enabled. Show actual in-process
    counts/timing against binary counts with skips explained. Staged cross-command exceptions:
    MUT-134, 153, 154, 163 and 207 observe both mutation and serve. Serve stays on its legacy
    handler: its moves (T-102 to T-108, T-112, T-113) are deferred because serve leaves for its own
    web app. Their in-process selection defers these five named scenarios explicitly, with that
    reason, the deferred serve work as owner and visible omission logs; they keep running through
    the binary driver. Do not add permanent binary-only tags or swallow Driver.Graph errors. All
    other eligible mutation scenarios run normally. T-73's Driver.ObserveWrites records real fake
    Store.Write revisions, including identical JSON. Source annotation writers move here: route
    every attempted successful source write through the memory driver's Write or an instrumented
    source-port adapter, even when bytes agree. Do not infer an unwritten source from equal bytes
    during writeback. MUT102's source and snapshot observer must pass in process once mutation
    scenarios join InProcess. Complete T75's per-(directory, Command) Tests upserts and optional
    JSONL Trace through the actual bound fake Workers. Require baseline-before-trials, actual
    command-selected outcomes, actual copied-source digests and execution locations outside the
    original fixture; retain an actual-binding negative regression, no scripted trace. Complete
    Driver.Head from T91's history state and prove seed selection independently. T74's CHECK_MARKER
    is a fixture environment variable not yet supported by memory.Run: adapt that fixture to an
    embedded fixed path or honestly declared fixture environment without broad environment support
    or a silent pass. All eligible sampling scenarios must execute with these observations when
    mutation joins InProcess. Trace identity uses canonical cwd and canonical original_root,
    realpathSync observations in the real TS fixture. Memory traces derive both from actual virtual
    execution/original project state. A path alias must not make execution in the original project
    look like a worker copy. Complete the real product environment inputs through actual fake
    bindings: in particular MUT164's Run.Env GOWORK=off must reach the bound Toolchain while an
    active workspace without that override is refused. This differs from a fixture-only
    CHECK_MARKER; do not replace the product override with a fixed fixture path or ignore it. Any
    T-79 read/list observer must observe real fake-port reads/listings, with honest capability
    omissions where the binary cannot observe them, never a hardcoded empty result. Bind both
    Workers and Measurer to the settled optional TestTrace.Tests inventory for own-test scenarios
    216/217. Emit the standard trace base plus optional test only from actual executed request
    selections and actual input/root, preserving unrelated runnable tests in the inventory so
    accidental broad execution fails. Prove these cases and the whole-suite unrelated-test
    counterfactual against the real bound memory ports; canned expected names, omitted coverage
    observations or empty traces cannot stand for the selection policy. The T-78 ledger records the
    declaration contract. Honor Coverage.Report's actual format through the bound memory Measurer:
    Go cover profiles, LCOV and JaCoCo XML from T78's real declarations. The old LCOV-only scenario
    helper cannot stand in for parsing the actual Go block or Kotlin line evidence. Exercise
    representative existing strict Go and Kotlin scenarios through the real handler binding,
    preserving paths and missing-report failures; use the existing domain parser, not a fixture-ID
    dispatch or canned facts. Bind actual controlled runtime environment inputs such as
    PYTEST_DISABLE_PLUGIN_AUTOLOAD and GOWORK from Run.Env to the real fake Toolchain/Workers
    requests and fingerprint computation. An ignored variable or a blanket permanent binary-only tag
    is not equivalent in-process execution. Bind T79's separate Coverage.IntegrationReport through
    the existing format-aware coverage parser, actual line matching/filtering and Integrated
    provenance, with malformed-report failures and actual listed-test requests. WithoutC8 records
    actual TypeScript collector absence without discarding valid in-process data; report its
    existing typed missing fact only for a built-in collector request, preserving raw-report and
    no-coverage workflows. No fixture-specific verdicts or blanket integration labels establish
    this. Bind the actual configured platform value for counted and fail-fast admission, including
    MUT248 native Windows refusals. Do not emulate ITOS_CC_TEST_PLATFORM inside a product binary or
    swallow platform errors. Keep the separately bounded native T80 CI scenarios after removing the
    broader T83 omission, and retain the documentation/private admission guards. Fold the temporary
    T81 native-matrix invocation back into the ordinary suite only after removing the broad T83
    omission and observing all its applicable counted/worktree cases there. Remove only that
    now-duplicate T81 invocation; preserve the separately required T80 native-platform invocations
    unchanged.
    Where T-100 left it: the memory driver refuses a validated mutation run with an explicit check
