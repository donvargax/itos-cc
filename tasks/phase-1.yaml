- id: T-89
  type: refactor
  title: Give mutation toolchain facts, fingerprints and test reach through ports
  why: >
    S7 after T-88. Complete the existing plan boundaries for Toolchain, Fingerprints and Reach, with
    test-command selection split into pure choices in internal/mutants and I/O at adapters.
    Complete pure command policy over the actual facts supplied here; T-87 leaves discovery,
    probes and helpers coupled to legacy coverage at their current boundary rather than inventing
    a speculative tool-facts DTO or copying coverage helpers. Toolchain
    supplies observed manifests, installed tools and execution facts; reuse existing
    selection/lang/coverage ports where they already express the need rather than adding a
    forwarding layer. Fingerprints supply file/input hashes and inventories with the existing strict
    coverage provenance boundaries, not a newly broadened or narrowed mutant scope. Reach supplies
    current transitive source/test import reach through internal/importgraph wrapping
    graph.TestsImporting until S8 moves graph. Every port speaks domain values directly, declares
    typed sealed failures and takes ctx first for external work; no held/background context, UI,
    JSON, filesystem/process implementation or runtime.GOOS branch in domain logic. Resolve package
    dependency direction without repeated DTOs or speculative generics and record the contract.
    Supply in-memory fakes for domain/in-process testing, shared fake/adapter contract suites for
    capabilities both can hold, real platform details at adapters; fake Reach follows declared
    imports, Fingerprints hashes memory text, Toolchain observes memory files. Preserve
    own-tests-first selection for all languages, Python editable PYTHONPATH, Gradle/Maven choice and
    paths, listed support hashes, whole-suite module evidence, integration reach and strict
    workspace/local-replacement refusal. Wire cmd with real adapters; do not yet move Run
    orchestration or Fresh/count preparation. Add architecture rules/accept-refuse fixtures and
    docs. Add MUT07 setup-row commands and Python editable PYTHONPATH to refactor-final-proof rather
    than running per-task binary comparisons. Light local package and named scenario checks; broad
    gates through hooks/CI, no mutation run over this repo, no worktrees/session moves/agents; no
    new dependency without recorded selection.
    Strict-scope inputs include per-run GOWORK, notably MUT164's GOWORK=off support
    counterexample. The memory Toolchain must observe that actual Run.Env override together
    with its actual memory go.work/go.mod files and inventory, independently of snapshot
    evidence. Preserve refusal and support controls, with an actual-binding regression if
    needed. If T-79 adds read/list observations, connect them to actual memory port operations
    rather than scripted observation events.
    Standard runtime environment values actually supplied by mutation fixtures,
    including PYTEST_DISABLE_PLUGIN_AUTOLOAD as well as GOWORK, are real inputs.
    Forward them from the current Run.Env into the bound fake Toolchain/Workers and
    compute environment fingerprints from those actual values. Do not ignore them,
    copy fingerprints from a stored snapshot, or mark logical cases binary-only to
    evade the old memory driver's environment rejection. This does not introduce
    a generic no-op environment API; fixture-only CHECK_MARKER uses its separately
    specified fixed-path/declaration correction.
    MUT164 distinguishes lexical dependency refusal from ordinary in-project
    discovery: a same-root nested module without a replacement is read by a
    successful cached public check. Preserve that behavior and the Lstat-only
    replacement-scope policy without following target dependency trees. Bind
    read observations to actual selection/surroundings/Toolchain operations,
    with genuine external targets kept separate from ordinary in-root reads
    and positive fake-port controls. Unsupported run/check operations neither
    execute test/list/coverage commands nor refresh independent evidence.
    Follow T-88's model-bearing contract direction for mutation-owned contracts
    that refer to mutation-owned values: place them beside those values in
    internal/mutants, with adapters and our porttest fakes importing them inward.
    Reuse existing selection, lang and coverage contracts directly where they
    already express the operation. Do not create a child-port import cycle,
    forwarding-only package, duplicate result model or generic parameter solely
    for a directory recipe. Record any additional real dependency correction
    before implementation and keep strict accept/refuse architecture fixtures.
    Tool discovery, manifest parsing, installed-tool checks and interpreter probes
    stay at the I/O boundary; pure policy constructs the existing Command from
    observed facts. Preserve current precedence and override behavior, including
    a Python shell override avoiding the unused pytest probe, the actual virtual
    environment interpreter choice, installed Vitest/Jest versus script choice,
    and Maven reactor selection. Current pythonInterpreter takes the last existing
    interpreter in .venv then venv order, whereas PythonCoverageInputs takes the
    first. Preserve both observations rather than unifying their preferences in
    this refactor. Do not change a preexisting preference while
    moving it. The existing pytest import probe inherits the caller working
    directory; Command.Root and Command.Dir do not set its cwd. Preserve that
    distinction with actual Run.Dir facts, including nested project roots.
    Do not copy legacy coverage helpers into the domain to avoid
    supplying the actual test files or classes those helpers observe.
    An absent optional manifest or tool, or an unsuccessful optional probe that
    currently chooses a fallback, remains an observed negative fact rather than
    a newly fatal validation failure. Preserve caller cancellation and failures
    that already surface; typed port errors must not silently tighten policy.
    Tool availability and probe facts must be independent of the command the
    scenario expects the policy to choose. Use the actual Run.Without inventory,
    memory manifests and executable entries, and explicit tool-setup declarations
    where execution facts cannot be represented by file contents. Extend the
    existing Given setup narrowly if such a fact is missing, with binary setup
    observing the real capability and the fake consuming its independent input.
    Never infer installed tools or successful probes from Tests.Command, its
    declared outcome, an expected command string or a scenario identity. Keep
    positive and negative controls through the actual Toolchain binding.
    Concrete T-89 direction keeps Toolchain, Fingerprints and Reach beside
    mutation values. Toolchain observes the build/module roots, installed
    runner paths, package manager, interpreter/probe result and runnable
    Python files or Kotlin classes; the pure policy constructs Command from
    those facts, not filesystem calls or a second command model.
    internal/testtools owns those observations and directly reuses current
    project and coverage helpers. internal/testinputs owns test, support,
    suite and independent-coverage fingerprints with current inventory
    boundaries and environment values. internal/importgraph wraps the graph
    import closure over supplied source/test inventory. Existing selection
    and lang contracts keep discovery and parsing; do not introduce another
    generic filesystem or subprocess port. Legacy direct-call compatibility
    stays explicit until orchestration and frozen preparation move in
    T-92/T-95, while cmd receives actual contracts and guards injection.
    Fakes use actual memory files, declared import edges and independently
    declared executable/probe facts.
    The graph package already imports legacy mutate; only cmd composes
    importgraph Reach, never a mutate fallback importing graph again.
    Move the existing pure GradleTests and MavenTests formatting functions
    once into mutants and retain temporary forwarders in existing legacy
    coverage, for T-90 to remove as those callers move. Python runnable-file
    and module discovery still uses existing coverage helpers; one pure
    Python argv constructor serves both ordinary and supervised fresh
    commands without changing the latter's probe. Scope admission belongs
    beside Fingerprints' provenance inventory, keeping adapters independent.
    Driver.Tools(ctx, dir, ToolSetup) declares only otherwise unrepresentable
    setup observations: independently installed NodeBins and an optional
    Python interpreter/pytest-importability fact. Omitted Python is distinct
    from explicit false; probes are keyed by actual interpreter identity and
    caller directory, with actual fixture environment overrides. Binary
    setup verifies NodeBin's existing Stat-only lookup and the real probe at
    that cwd/environment, failing mismatches and distinguishing cancellation
    from failed import. Memory creates actual installed .bin entries and
    stores the independent probe fact; no observed probe defaults true and
    none comes from Tests.Command or outcomes. Limit Given additions to the
    affected setup. Shell override avoids a product probe even when setup
    independently observed tool availability. There is no generic executable
    registry, subprocess API or early mutation-handler promotion.
    Optional Tests.Imports declares resolved file-to-file import/reference
    adjacency from the actual Given source, test and support files. These
    are never desired source-to-test reach lists, argv, traces or outcomes.
    Memory stores root-level copies independently of command-keyed Workers
    declarations; omitted Imports does not erase known facts and conflicting
    declarations fail. Every requested graph node must have explicit facts,
    including an empty adjacency for known no edges. Unknown referenced
    paths and unsupported declarations fail rather than proving no reach.
    Reach computes Go's package/one-hop rule and non-Go closure, applicable
    conftest support and Kotlin references from those facts; the binary keeps
    its actual parser until S8. An imports-only Tests declaration has no
    Command or execution outcomes and stores root-level graph facts only;
    it neither installs tools nor declares a runnable test command. This
    covers selection-only fixtures without inventing their test results.
    Partial-result finalization preserves recordListed's existing best-effort
    actual file reads even after caller cancellation. Only that finalization
    leaf derives context.WithoutCancel(ctx) for retained listed-file hashes;
    unreadable files still hash empty nonfatally. Ordinary current fingerprints,
    scope admission, probes, tests and snapshot publication keep the original
    caller context. This neither admits new work nor authorizes a write after
    cancellation; it preserves the pre-port artifact provenance semantics.
    Attempt dc9d9ffe26606320e229b68b317bf75105e08f57 passed the named
    public 35-case/202-step selection and focused contracts, but exact CI
    38832592601 refused staticcheck QF1001 at porttest/tools.go:236 for a
    negated compound coverage-runner boolean. Revert 6ec9b99 immediately
    restored the source before writeup; all contract/proof metadata remains.
    Reapply the reviewed source and simplify that equivalent boolean without
    a suppression, gate change or behavior change. Retain the original
    failure and stage-specific evidence; exact repaired CI remains required.
    Original dc9 native Ubuntu/macOS jobs then exposed the expired
    TestMemoryReadObservationIsExplicitUntilPortsMove guard: actual read
    ports now exist, so a missing target returns fs.ErrNotExist rather than
    the former temporary unsupported sentinel. Source 7d549b7 still held
    that identical guard and was already published as run 38833297307 when
    the evidence arrived; revert bae2656 restored it immediately. Replace
    only the expired expectation with a portable missing-target refusal,
    preserving new actual read/list, assertion-read exclusion and removed-
    target controls. This completes the already specified capability,
    without restoring a fake no-op or claiming a new product-behavior red.
    The completed original Windows job also exposed two test-fixture
    portability errors: an observed short-path cwd differed textually from
    its long canonical spelling, and the listed-hash fixture's drive-less
    root was not absolute. Compare actual probe directories by Stat/SameFile
    while retaining argv/environment/importability/interpreter assertions;
    give the listed fixture an absolute native temp root while retaining
    exact actual hashes, missing-file empty hashes and caller cancellation.
    These are fixture-only corrections, with no product OS branch or skip.
- id: T-90
  type: refactor
  title: Extend coverage measurement for mutation per-test evidence and static inventory
  why: >
    S7 after T-89. Extend the existing coverage domain port and internal/coveragetools adapter with
    per-test coverage and executable inventory as domain-valued operations; eliminate the legacy
    MeasureTests callback workaround. Keep the aggregate Measure contract and strict
    producer/input-boundary admission unchanged. Per-test coverage preserves the single
    harness-split run through ITOS_CC_TEST_COVERDIR, fallback once per listed test,
    process/subprocess integration evidence, test IDs and paths, missing collectors and
    partial/failing measurements across Go, TypeScript, Python and Kotlin. Inventory preserves
    evidence for executable functions no test loads, zero-site functions,
    workspace/local-replacement refusal, and the difference between mutant selection and provenance
    scope. The real adapter wraps existing runners; fakes consume scenario Coverage and Tests
    declarations in memory and never run tools or touch disk. Port operations use domain
    Report/TestCoverage/inventory values directly without repeated DTOs; ctx first for I/O, sealed
    gaps/failures, no context held or recreated. Keep current Measurer type architecture unless a
    minimal dependency correction is necessary and record it; do not preempt the later ADR47 review
    or future T86. Extend fake/adapter contract suites for shared behavior, keep installed-tool-only
    cases at adapters and binary scenarios, and update docs/architecture fixtures where boundaries
    change. Preserve output/error/exit/schema semantics and current coverage fallback rather than
    tightening policy. Focus local checks to changed coverage packages and named scenarios, broad
    gates through hooks/CI. No per-task binary comparison, own-code mutation runs, worktrees/session
    moves, agents, or new dependency without recorded selection.
    T-78's own-test trace inventory also applies when the bound Measurer executes a
    coverage selection. Derive optional test observations from that actual request's
    scope/selected test files or classes and the actual fixture root; use the full
    TestTrace.Tests inventory, including unrelated runnable tests, and the existing
    canonical cwd/original_root/source_sha256 base shape. Do not write the desired names
    merely because measurement was requested. Whole-suite measurement selects the full
    inventory, unsupported shapes error, and nil inventories keep prior trace behavior.
    T78's Coverage.Report declarations include real Go cover profiles (mode: set),
    LCOV and Kotlin JaCoCo XML. The current memory scenario driver reads only LCOV;
    that is not proof of these mutation formats before the command moves. Use the
    existing coverage domain's format-aware parser and report builders in the actual
    bound memory Measurer, preserving Go block positions, source/root path matching
    and Kotlin line facts. Do not silently turn an unsupported or malformed declared
    report into an empty measured success, invent missing facts or add another DTO.
    T79 Coverage.IntegrationReport declares a separate real subprocess report
    in the existing Go/LCOV/JaCoCo formats. Parse both reports through the existing
    coverage domain parser and apply Report.Integrated with actual in-process
    inventory matching/filtering and existing merge/build APIs; never label all
    lines integrated. Empty means no subprocess evidence, malformed nonempty
    reports fail. Preserve actual per-test IDs from Tests.Listed.Lines and the
    bound Measurer request. TypeScript WithoutC8 supplies typed integration
    missing/tool facts while preserving valid in-process coverage, only when an
    actual request invokes that built-in collector. A stored declaration alone
    must not manufacture an error for named/existing raw reports or no-coverage.
    Concrete ownership and binding settlement for T90: keep the existing aggregate
    port.Measurer[*Report] and its callers intact. The new model-bearing per-test
    and inventory capability belongs beside Report/TestCoverage in internal/coverage,
    composing the aggregate contract where needed. The domain already imports its
    child port for Files/Gap, so do not add another result type parameter, duplicate
    model, leaf-model package or move all existing ports merely to avoid that cycle.
    Record the narrow package-rule correction before implementation; it does not
    decide the later ADR47 review. Move the existing pure Test/PerTest values once
    to their domain owner and use temporary legacy aliases where actual callers
    still need them. PerTest.Select is pure command construction, not an I/O callback;
    preserve it rather than inventing another command-template framework.
    Wire actual mutation loadCoverage and strictCoverage inventory calls through
    the invocation's bound capabilities. Guard the real consumers with independent
    fake evidence and missing/wrong-binding counterexamples; a new interface that
    production still bypasses is not completion. Disposable real source discovery
    may remain until handlers move, stated honestly rather than claimed all-memory.
    Keep aggregate malformed/unreadable named reports as Unreadable gaps, or
    MeasuredNothing with --coverage-command, retaining other good reports. Rejecting
    malformed fixture declarations must not introduce a new fatal CLI failure.
    Inventory command failure still leaves files without proof and is logged;
    cancellation still stops the actual caller. Do not make its formerly best-effort
    failure fatal or manufacture proof from syntax when a collector has no inventory.
    The concrete root contract is MutationMeasurer, composing the unchanged
    aggregate Measurer[*Report] with MeasureListed(ctx, Request, *PerTest) and
    Inventory(ctx, *Report, language). Inventory mutates the existing Report
    through its domain API; ordinary collector failures stay logged and leave
    no proof, while cancellation returns the existing sealed Cancelled failure.
    Invocation MutationCoverage supplies this capability independently from
    aggregate Coverage; neither mutation consumer constructs a real fallback.
    Test and PerTest move once into internal/coverage; legacy coverage aliases
    preserve the existing runner and pure selection constructor until its callers
    move. The root-owned fake and shared suite live in internal/coverage/porttest,
    reusing the existing aggregate fake directly. The narrow package rules admit
    that root fake only to tests/fixture composition, as for mutants/porttest;
    production domain code still cannot import a fake or adapter. This records
    the model-bearing root exception without changing the aggregate child port.
    Optional Coverage.InventoryReport/InventoryExit/InventoryOutput describe
    independently observed static collector bytes and command outcome, used only
    by actual Inventory calls for the Report's unloaded Python/TypeScript files.
    An explicit empty-file record proves that empty population; absent bytes do
    not. Existing measured or unrelated files and Go/Kotlin static requests gain
    no proof from this declaration. Report.List forces inventory lines unexecuted.
    Optional ListedTests.ConversionExit/ConversionOutput describe the external
    Go covdata result after the actual per-ID CoverageMetadata artifact is
    written/read. They default to success and affect that Go collector only;
    failed conversion leaves valid sibling-language and sibling-ID evidence.
    Collection failure remains separate, with aggregate coverage retained.
    No opaque metadata parser or preparation verdict is introduced. The strict
    supervised converter remains at its existing boundary until T95.
    Measurement trace observation is fixture-owned: Driver.Tests/Run admission
    rejects independently invalid source, inventory and declared runner shapes.
    The actual bound coverage request still selects emitted observations from
    that full inventory and actual source bytes. A request-dependent unsupported
    trace shape is retained by the test wrapper and returned as a Driver.Run
    observation error after the product joins; it is never suppressed, translated
    into Unwritable, or added to production's sealed measurement failure set.
    The supported measurement itself delegates unchanged to the root fake.
    The first named binary control passed 19/20 cases; MUT123's final snapshot
    assertion failed because its later clean selected baseline's owned helper
    go build failed automatic VCS stamping with exit 128. The diagnostic preserved
    successful aggregate and fallback collection. Both fixture build branches
    use -buildvcs=false, retaining -cover and all actual product commands,
    source/ID observations and baseline-failure handling. This removes irrelevant
    fixture executable metadata rather than changing worker Git or CLI policy.
    An independent disposable covdata oracle on the exact malformed T81 metadata
    bytes observed exit 1 and unexpected EOF; the bad-metadata declaration records
    that converter result while the binary still executes its real converter.
    Post-publication self-review found two memory-harness gaps, independently
    confirmed by the coordinator. A failed static collector with no report must
    still log its declared diagnostic before returning best-effort/no proof.
    Listed collection facts belong to the root's independently declared harness,
    not the command-keyed Workers outcome map: retain the latest explicit root
    setup, preserve it when a later Tests upsert omits Listed, and own deep copies
    of its nested maps, slices and metadata. This removes command-map iteration
    order from Split/collection/conversion facts without selecting desired argv.
    Focused harness-regression assertions and existing measurement/binding guards
    cover the correction; no new CLI behavior or behavioral-red claim is made.
    First published implementation ed617d0 failed CI38841139032. Revert
    0cf65d3 restored source immediately before this attempt record. The new
    broad coverage-fakes rule overlapped slice-fakes, so six existing slice
    probes emitted a different refusal owner than their exact architecture
    contract. Scope the new rule to the existing pure-domain path inventory,
    excluding porttest/tests, retaining slice ownership and the cross-domain
    refusal. Native Ubuntu also exposed an existing command-retention fixture
    with no file for its declared trace source; create owned independent source
    bytes before declaration while retaining every old assertion and actual
    admission. Restore the reviewed source after supported give-back/retake,
    apply these configuration/fixture corrections and the already specified
    deterministic Listed/failed-empty inventory follow-ups. Preserve original
    failed logs and native diagnostics; no check is weakened or new product
    behavior claimed. Remaining original native job diagnostics stay observed
    before the repaired implementation is published.
    The original workflow subsequently completed failed; macOS and Windows
    reproduced only that same missing-source fixture, with no additional named
    failures. The original architecture and common native fixture diagnostics
    are complete; repaired source still requires independent exact full CI.
- id: T-91
  type: refactor
  title: Read mutation history through a Git history port and an in-memory counterpart
  why: >
    S7 after T-90. Move mutation history and committed-input reads behind a domain-owned History
    boundary and internal/githistory adapter using current Git behavior. Preserve --since
    invalid-ref/no-repository diagnostics, immutable base/head source and test snapshots, source
    rename matching with/without edits, same-name unit identity, changed-line comparison and
    logical-root mapping, unborn/bare Git classification, frozen counted inputs and strict scope
    boundaries. Context first for external work, no held/background context, sealed domain failures
    classified at UI, no Git/OS/JSON implementation in domain. Extend cmd in-process driver's fake
    Git with the refs, commit contents, branches and renames the Givens need, no real
    filesystem/process/network access or scripted call mocks. Define a shared contract suite for
    real and fake History results and typed failures, real Git-only setup/errors stay at adapter
    tests. Wire real adapter at composition boundary and current legacy callers without moving Run
    or all Fresh preparation yet. Avoid repeated domain/port DTOs and record dependency direction
    before introducing a cycle workaround. Add architecture boundaries/accept-refuse fixtures and
    docs; retain tests until scenarios/domain contracts hold equivalent checks. Add --since missing
    ref, outside Git, and renames with/without edits to refactor-final-proof, no per-task binary
    comparison. Local checks focused, broad gates only configured hooks/CI, no mutation run of this
    repo/worktrees/session moves/agents/unapproved dependencies.
    T75's Driver.Head(ctx,dir) needs the actual HEAD ID of this extended fake history. The
    previous memory Git had only a commit count, so its Head capability explicitly errors
    until this task supplies real fake-history state. Do not derive the expected HEAD from
    mutation sample output. Wire this observation and verify it independently of sample's
    seed.
    Keep the two existing committed-history consumers distinct: ordinary --since
    uses ref...HEAD under the caller's working directory with HEAD source bytes,
    while counted preparation uses a once-resolved base and pinned head at the
    logical repository root. Preserve three-dot/merge-base behavior and relative
    path mapping; do not replace either range with a working-tree or two-dot diff.
    Retain pure-deletion function admission separately from added/changed line
    ranges, unchanged rename entries with no changed functions, renamed edits,
    and Kept hashes for same-name units. Move model-bearing mutation contracts
    beside their values in internal/mutants, with porttest fakes and inward
    githistory dependencies, following T88/T89 rather than creating a child cycle.
    The fake history holds immutable commit trees, refs and parent relationships
    derived from the Givens' actual staging/commit/branch operations. Later edits
    or staging must not mutate already captured commits. Its Head observation
    comes from that same independent state; neither sample output nor a desired
    seed supplies it. Shared contracts exercise branching history, immutable
    committed bytes and these range distinctions, not a script of expected calls.
    Wire actual --since and default-sample-seed consumers through their bound
    History and verify missing/wrong bindings. Keep frozen-tree materialization
    and counted orchestration at their existing boundary until T95; history
    values must not smuggle scratch files, subprocess handles or held contexts
    into the domain. Preserve committed symlink/gitlink refusal and modes at the
    current export boundary rather than following their targets in the fake.
    Inventory every actual history caller before finalizing the contract,
    including DeletedSince in exceptionsElsewhere and both RenamesSince and
    RenamesUncommitted in notRenamed, as well as ChangedSince and sampleSeed.
    Bind those queries through History while their orchestration stays in
    its current place until T-92/T-93. Preserve the maps' distinct meanings:
    ChangedSince's rename map names current-to-prior files under the caller;
    orphan rename queries name prior-to-current files across the whole
    repository. Do not derive the latter from the narrowed changed-file map.
    The working rename query compares HEAD with tracked working/index state,
    recognizing a staged git mv or added target but not a plain untracked mv.
    Deleted-file exception checks run only when no explicit paths narrow
    --since. Ordinary orphan Git-query failure judges no orphan, without
    a new public error. Keep the existing mapped-path/exclusion/presence
    decisions, including Lstat semantics, at their current boundary until
    their own orchestration task. These are existing behaviors, not new
    history syntax, filesystem ports or early handler moves.
    Include the focused public neighbors ID-MUT-77/78 for actual HEAD and
    explicit-seed reproduction, and ID-MUT-238/239 for committed and staged
    rename snapshot retention, alongside the existing --since checks.
    Concrete T91 boundary direction: mutants owns History beside its models,
    with Head, Resolve, ReadCommitted, ChangedSince, DeletedSince,
    RenamesSince and RenamesUncommitted operations, each taking caller ctx
    first. The adapter is bound to the actual caller Dir; committed reads
    name root-relative paths and return owned bytes, never materialized
    paths or process handles. ChangedFunctions moves once beside the
    existing LineRange, with a project compatibility alias for old callers.
    Sealed history failures distinguish no repository, invalid reference,
    cancellation carrying the original cause, and an actual query failure
    carrying its unchanged reason. Cmd translates those at the existing
    usage/environment boundaries; orphan query failures remain conservative.
    internal/githistory wraps explicit context/directory variants of the
    existing project Git queries. Project imports only pure domain values,
    so it does not delegate back into its adapter or create a cycle; its
    existing direct wrappers and guards remain during legacy migration.
    Counted gitAt, export/materialization, supported modes and symlink/gitlink
    admission remain at their supervised legacy boundary until T95. The
    fake owns immutable trees and parents from actual stage/commit/branch
    operations, using real fixture text for line comparisons and rename
    matching; it never runs Git or returns expected-call scripts. No new
    dependency, generic Git executor or tree-export framework is introduced.
- id: T-92
  type: refactor
  title: Move mutation run orchestration into the domain over its ports
  why: >
    S7 after T-91. Move existing mutation Run orchestration into internal/mutants over the
    established Workers, Toolchain, Fingerprints, Reach, coverage and History ports. Domain code
    reads no real files, runs no process/Git/tool, imports no UI/JSON/adapters and owns no exit
    codes; dependencies flow inward and ports use domain values. It owns reuse and site judgments,
    own-tests-first/listed fallback, selection-baseline caching by ID set, timeout derivation from
    each baseline, strict coverage admission, broad/listed freshness, exception handling and
    aggregate/fail-fast scheduling. Preserve one shared post-abort cleanup budget and truthful
    partial evidence, never reinterpret a cancelled/unattempted site as killed; pass ctx first and
    never store/create one inside logic. Progress reaches presentation as domain facts/events, not
    formatted text or direct output. Keep snapshot publication/annotation timing, orphan removal and
    internal-error behavior as they are; mutation-run-saves-each-file is separate behavior and must
    not be folded into this refactor. The memory Workers fake derives outcomes/elapsed times from
    Driver.Tests and coverage facts from Driver.Coverage, never invokes tools. Cover orchestration
    with our port fakes, deterministic outcomes and typed failures rather than mocks or timing
    sleeps; preserve meaningful existing guards until public scenarios/domain tests hold them.
    Legacy cmd handler temporarily calls the new domain and retains formatting. Add
    fixtures/rules/docs for changed dependencies, meet domain coverage, and add worker error mid-run
    plus listed fail-fast cases to refactor-final-proof without running per-task binary comparisons.
    Focus local checks to the domain and named fixture scenarios, gates through configured hooks/CI
    only; no own-code mutation run, worktrees/session moves/agents or unapproved dependencies.
    T80 classified MUT168 and MUT190 as private adapter contracts, preserving
    their original prose and all underlying ownership guards. They are not
    executable public scenarios, so this task's scenario selection omits those
    nonexistent IDs. Keep their actual worktrees adapter tests in the configured
    native all-package CI; do not substitute a public passing placeholder.
    Preserve MUT166/183/188/193's join-before-input-removal guarantee at the actual
    orchestration boundary. Use held requests through the bound Workers fake and
    actual input lifetime state to prove cancellation joins work before release;
    premature release must fail the guard. Keep deterministic adapter proofs too,
    without treating final EOF and absent paths as proof of the internal order.
    Before moving Run, inventory its remaining source reads, rename-existence
    checks, snapshot codec calls and annotation writes against the actual ports.
    Existing selection/lang operations still own discovery and parsing. Snapshot
    publication must carry the pure Snapshot through a concrete encoding boundary:
    keep the existing snapshot codec and generic Store semantics outside mutants,
    not a direct default JSON encoding of the now untagged pure model. Reuse the
    current Store where it expresses the need; settle and record only the smallest
    missing model-bearing capability before code, without a DTO twin, leaf-model
    package, folder-only generic or universal filesystem/process abstraction.
    The current annotation boundary re-reads the source at publication time,
    replaces only its summary, preserves its permission bits and skips a write
    when bytes are identical. Keep those semantics through an actual bound source
    writing capability, with the pure annotation rule owned once by mutants;
    do not overwrite current source from an earlier planning copy or count an
    identical byte rewrite as no write. Its memory counterpart records actual
    writes for Driver.ObserveWrites, independently of desired expected artifacts.
    Preserve the existing point at which a failed run, baseline or listed
    selection prevents snapshot/annotation publication and the order of failures
    during publication. This does not authorize the separate saves-each-file
    behavior. Actual consumer missing/wrong-binding checks must rule out silent
    legacy disk defaults after the domain move; temporary direct legacy wrappers
    are not a second runner implementation or the domain's dependency.
    Snapshot read admission retains its current order: obtain the store root,
    decode the complete stored record, and treat an absent record or one
    naming another file as no snapshot before observing current command
    policy. Only an admitted TypeScript record needs the current toolchain
    observation that upgrades legacy own-scope outcomes to whole-suite
    scope. A missing or mismatched record must not start that probe.
    Keep this domain policy separate from concrete decoding; a model-valued
    storage operation must not silently turn runner discovery into a codec
    effect. Preserve store-failure and post-read command-failure precedence.
    Shared guards use independently declared snapshot and tool facts, not
    expected query scripts or default JSON of the untagged domain model.
    As settled in T-49, fail-fast cancellation derives from the caller's
    context and may retain only its cancel function, never the context.
    Do not invent a Background/TODO root, context payload or captured I/O
    closure during extraction. Keep WithoutCancel confined to existing real
    cleanup; ordinary observations and publication receive the caller context.
    Preserve the owned-work stop without adding another lifetime framework.
    Ordinary Run still parses current selected source through selection/lang.
    History supplies committed --since admission, not a replacement live tree.
    Pinned counted inputs remain at their existing boundary until T-95.
    Inventory configured test listing as well as measurement. It currently runs
    lazily when ordinary pending work first needs coverage, and fills the same
    listed-ID/file inventory later used in selections and snapshots. Preserve
    first-ID-wins parsing, optional filenames and CRLF/whitespace treatment.
    A failed list stays tests.list-failed and stops before trials/publication;
    ordinary best-effort measurement failure keeps its different fallback.
    Bind listing through a narrow model-valued capability, settling its actual
    owner/API before code, with declaration-driven memory evidence and actual
    missing/wrong-binding controls; no live-shell callback hidden in the domain.
    The concrete T-92 contract direction is recorded before product changes.
    Model-bearing MutationSnapshots belongs beside Snapshot in mutants and
    supplies Root, Read, Write and Remove with the existing snapshot-port
    failures. Read returns a fully decoded Snapshot or absence; domain admission
    retains the recorded root/decode/file/toolchain order. Existing metricsdir
    owns the one concrete mutation codec and implements this capability over
    the current generic Store. Move the codec once and retain thin legacy
    SnapshotJSON, UnitJSON, MutantJSON and ReadSnapshotJSON delegates where
    callers need them. Preserve physical names, failure context, byte order,
    legacy keys, nil/empty distinctions and atomic writes. Keep the independent
    literal byte guards, Go coverage-key checks and legacy suite-evidence guard;
    move rightful private codec tests rather than copying private wire models.
    SourceEdits belongs to mutants with context-first Missing and Annotate
    operations, implemented by workdir and the actual memory tree. Missing
    retains Stat/IsNotExist follow semantics; other stat errors do not prove
    absence. Annotate rereads current bytes and uses one pure annotation
    replacement rule, comparing equality before stat/write and preserving
    permissions. Its memory implementation observes actual writes. Separately
    extract the pure orphan reason from observed presence, exclusion and scope
    values once for T-93 reuse. Orphan observation remains Lstat-based at its
    current boundary, with mapped-path/recorded-file admission and conservative
    errors intact; strict snapshot decoding is not permissive orphan metadata.
    TestLister belongs to mutants and accepts the existing Command value. Its
    listing-specific result carries stdout, exit status and the unchanged
    command failure reason; it must not reuse CommandResult's combined output.
    Nonzero or failed-start listing results retain tests.list-failed, including
    the current -1 when no exit status exists. Cancellation forwards its cause
    through InputFailure. The real testtools adapter streams stderr immediately
    to its composed log while returning stdout alone. The fake reads independent
    root listing facts; actual requests select and parse those observations.
    Shared guards distinguish stdout ID rows from stderr diagnostics and retain
    unsuccessful-command reasons, first-ID-wins and optional-file parsing.
    Run options carry the bound MutationMeasurer and its existing request,
    optional premeasured Report, configured Test/PerTest values and TestLister
    instead of the Coverage I/O callback. Listing remains lazy for ordinary
    pending work and fills the same shared Listed.Files inventory. Replace the
    CoverageInputs I/O callback too: existing bound Toolchain and Fingerprints
    observe producer/runtime inputs from the actual root, command mode, support
    and source. Keep pure cached-evidence/map queries as pure functions. Bound
    adapters own logging and domain events carry progress facts to presentation;
    no captured UI/input closure or direct legacy disk fallback enters Run.
    Sample currently draws/checks legacy candidates and shares the same private
    execution state and scheduler. Move that genuine state/scheduler once;
    expose only a constructor, pending-site admission and observed result/outcome
    access needed by Sample. Keep its draw, checks, grouping and read-only policy
    legacy until T-94, without a second scheduler or semantic DTO. Retain and
    exercise listed-scope, baseline-failure, read-only and seed neighbor guards.
    During T-92 design and unpushed implementation, the independent spec-only
    c5ef771 workflow 38850524767 failed macOS job 116810496982 in MUT184's
    after-scenario cleanup: three authenticated helper sockets reset when late
    cooperative STOP messages preceded observation of their already-joined exits.
    That published source is byte-identical to the previously green T-91 source;
    no T-92 product work was published or caused this failure. Preserve the raw
    incident and all T-92 WIP in recovery stash 856243934ec3f0f4a332adec915ae0338de09f67
    while a separate named test task repairs the existing fixture cleanup.
    T-92 is temporarily given back only for that independent repair, with all
    direction and implementation recovery preserved; resume after its verified
    full-green published closure, with a supported retake-first transition.
    Frozen trials also share the listed-selection baseline cache and timeout
    rule. Keep its actual owner once in mutants, with the narrow baseline
    result/command access that legacy fresh trials need until T-95; frozen
    materialization, preparation and trial orchestration remain at that boundary.
    Retained query callbacks normalize relative paths lexically against the
    already supplied absolute caller directory; they never consult process cwd.
    The first published extraction 870d630, with proof-note head 996abd6,
    failed exact workflow 38857472438 core job 116832061175 in the existing
    internal-package lint gate. Its four valid source findings were an unchecked
    WorkerPool.Close at run.go:613, unchecked helper fmt.Fprint at probe_test.go:21,
    a 646-counted-line run.go above the 600-line policy, and a test helper with
    context after testing.T at run_join_test.go:47. Restore source first in
    f3bc63a, preserving proof notes, all prior contracts and the three stashes.
    Passing focused evidence remains attempt-one partial evidence, not full CI:
    thirty native-applicable cases passed 138 steps, four macOS cases omitted
    26 steps on Linux before the final caller-context correction; affected
    final-source cases 126 and 197 passed ten steps, and focused boundary,
    Sample, held-join and publication guards passed. The historical 80.6 percent
    domain profile predates that final correction. Remaining native jobs of the
    failed workflow were still running at this repair record.
    Before republication, split genuine domain planning and execution into
    focused files in the same package to meet the existing length policy,
    with one scheduler and no new abstraction. Put context first in the test
    helper and callers, and check actual helper output errors. Handle the typed
    WorkerPool.Close failure at the domain boundary while retaining a primary
    run failure and cleanup/join ordering. Real worktrees.Close still returns
    nil and historical scratch removal remains best effort; do not turn that
    cleanup into a newly fatal command-line behavior or bypass the lint gate.
    The repaired source aa23f4d passed the core lint job but exact workflow
    38858684786 failed Windows job 116835813176 in two retained fixture guards.
    The held other-worker fail-fast case could not read native other/other.go
    from the fake at run_join_test.go:94. RealListingContract's success and
    unsuccessful-command cases passed an escaped quoted native helper path
    that cmd.exe did not recognize as an executable. Later artifact failures
    followed the package-suite failure; they are not separate gate defects.
    Restore source first in published 02639c3, leaving the entire tree equal
    to the pre-reapplication ecd652c, including all earlier ledger contracts,
    repair history, proof cases and the three stashes. Preserve both attempts'
    original logs and distinguish focused passes from full native CI success.
    Before the next repair, honor the existing fake path-key contract in the
    held fixture and native helper invocation/quoting in the real listing
    fixture. Keep actual entered mutated work, held join/release observations,
    stdout-only listing rows, streamed stderr and unsuccessful status guards
    substantive on Windows. Add no platform skip, loosened assertion, gate
    change or product behavior while correcting these fixture operations.
- id: T-93
  type: refactor
  title: Move mutation check and list orchestration behind the domain boundary
  why: >
    S7 after T-92. Move remaining check/list behavior from legacy mutate and command code to
    internal/mutants over its established selection, parsing, snapshot, fingerprint and reach
    boundaries, keeping cmd presentation temporarily intact. Pure judgments already moved in T-87
    remain the single rules shared by mutation check, reuse and graph; do not duplicate them in
    adapters or UI. Preserve sites and line/column ordering, same-name unit matching,
    stale/missing/unrecorded distinctions, broad/listed freshness, excluded files, gone sites and
    orphans, strict function/line evidence and empty-selection behavior. Domain code does no real
    I/O, JSON encoding/decoding, UI formatting or exit selection; typed snapshot values flow across
    the boundary and any wire decoding remains at an adapter. Context first for all external work,
    no stored/recreated context, no raw implementation failures escaping a sealed domain contract.
    Existing CLI output/problems/snapshot schema/bytes remain unchanged; build no new behavior or
    flags. Add focused domain tests with our in-memory port fakes for outcomes and injected
    failures; keep valid guards until covered by migrated scenarios/domain tests. Real adapters
    remain wired at cmd, which still formats check/list until their handler tasks. Update docs and
    boundary fixtures where arrows change, meet domain coverage, add any new equivalence edge to
    refactor-final-proof rather than comparing binaries per task. Gates only through configured
    hooks/CI, focused local checks, no own-code mutation runs/worktrees/session moves/agents or
    unapproved dependencies.
    Reuse the orphan behavior already extracted for run in T-92; check/list
    must not grow a second interpretation or acquire orphan removal writes.
    For an uncancelled orphan presence observation, existing Lstat semantics
    count anything at the path, including a directory or dangling symlink,
    as present; a permission or other error does not prove that it is gone.
    A Stat-backed Exists result is not automatically this contract. Reuse an
    established capability only if it holds these semantics, or record the
    minimum real contract gap before implementation.
    Preserve mapped-path presence before decoding a recorded outside-root
    source. Only an absolute recorded source whose snapshot name agrees is
    followed; an unreadable or malformed metadata read falls back to the
    mapped path. Keep that permissive metadata observation separate from
    stricter full-snapshot decoding rather than changing orphan admission.
    JSON stays at the adapter, and existing typed mutation values remain
    the contract. Check/list remain read-only on success and failure; run's
    orphan removal still follows its existing publication ordering.
    List currently emits each earlier file's sites before a later parse
    failure. Preserve that ordered partial result and let the existing CLI
    render the same prefix before reporting the failure. Check has its own
    admission and presentation order; do not transfer list's partial-output
    policy to check or discard list's prefix during a bulk domain call.
    Preserve no-source returns, empty arrays and stable source/line/column
    ordering. Use mixed good/bad source guards for this edge and record it
    for final equivalence proof rather than comparing binaries per task.
    Check uses a narrow MutationSnapshotReader with context-first Root and
    Read returning the existing root string or Snapshot and snapport.Failure.
    MutationSnapshots embeds that reader and retains its existing Write and
    Remove methods. Add a separate MutationCatalog with context-first Root,
    List returning []string and snapport.Failure, and RecordedFile taking a
    store-relative snapshot name and returning string and snapport.Failure.
    The same metricsdir.Mutations and our model-valued fake satisfy these
    contracts; check/list receive no snapshot write capability. Catalog List
    delegates to the existing regular-json listing under mutate and retains
    its store-relative names. Do not round-trip every listed name through a
    canonical source key, including POSIX backslash and outside-root names.
    RecordedFile decodes only existing file metadata at the concrete edge;
    absence returns empty without failure, and unreadable/malformed metadata
    uses existing typed snapshot failures and the established fallback.
    Add SourcePresence with Present(ctx, path) returning bool and InputFailure,
    on the existing workdir.SourceEdits and our fake. An uncancelled real
    observation uses Lstat and treats only not-exist as absent; cancellation
    retains its cause. Keep fake Lstat observations independent of Missing's
    Stat observations, including dangling links and ordinary errors.
    Do not substitute conservative presence for renamedToAFile's current
    successful-Lstat evidence at a rename target. Its ordinary errors do not
    establish a target, and rename-chain cycle/priority rules stay unchanged.
    Preserve checkParsed's Sample, exceptParsed and renew consumers: their
    stale-but-judged mutants differ from checkFile's filtering. Retain their
    listed-scope, baseline-failure, read-only and deterministic-seed guards,
    strict zero-site inventory, codec evidence and actual binding controls.
    SourcePresence also exposes RenameTarget(ctx, path) returning bool and InputFailure,
    meaning successful Lstat evidence only. Ordinary Lstat errors return false without
    failure, while caller cancellation retains InputCancelled and its cause. The same real and
    fake SourceEdits implement it; independent fake Lstat errors, directories and dangling
    links remain distinct from follow-Stat Missing. Domain rename traversal invokes this
    observation lazily, preserving since-first priority, cycle termination and the existing
    success-only target test; do not pre-scan irrelevant targets or substitute conservative
    Present.
    The same model-valued Snapshots fake must expose already-held Values and successful
    Write/Remove operations coherently through its catalog. Derive canonical names only for
    model keys and new writes; preserve raw CatalogFiles names and permissive malformed
    metadata observations without round-tripping inventory through source keys. A successful
    overwrite replaces the old metadata of that physical name; failed or cancelled
    writes/removals leave state unchanged. Hold this lifecycle through one shared real/fake
    contract and independent fake failure states; this is harness conformance, not new CLI
    behavior.
    The first source attempt, 388e60d and 22fdb42 with proof note 9bfcd58, was published as
    9bfcd58. Workflow 38868646788 failed Ubuntu job 116867257185 at
    TestMutationHistoryConsumersRequireActualBindings, mutation_history_binding_test.go:80.
    That retained T-91 fixture supplied History alone to notRenamed and omitted the newly
    required SourcePresence binding; the committed/working rename control returned mutation
    source presence binding is missing. This is our fixture wiring omission, not a wrong gate
    or an itos defect. Artifact preservation failures followed the stopped test step and are
    cascades. Local 36-case/158-step public passes, 83.1 percent domain coverage and focused
    guard passes remain honest local-stage evidence, not full CI success. Source-only revert
    25100adc78d40ebfe6eddf4f964b08f1b04c8daf restored and published the pre-source
    implementation FIRST, preserving every contract and the proof note. Before republication,
    bind independent SourcePresence from the history fixture actual m.files and m.dirs,
    preserving its committed/staged rename, wrong/missing History, no-Git and cancellation
    assertions and actual physical target decoys. Add missing and wrong Presence controls
    proving no host fallback, include this retained history consumer in focused retry
    verification, and audit all affected direct callers for the new binding. Keep production
    defaults absent and every existing gate unchanged; no new CLI behavior or own-source
    mutation is authorized by this harness repair.
- id: T-94
  type: refactor
  title: Move mutation sample and exceptions behind domain-owned boundaries
  why: >
    S7 after T-93, split from check/list so each change lands independently. Move mutation sample
    and exception judgment/renewal orchestration into internal/mutants over its existing execution,
    evidence and snapshot boundaries. Introduce the domain-owned Exceptions boundary and a real
    config adapter for reading/updating itos-cc.yaml; annotation/source writes use a meaningful
    typed external boundary, never direct filesystem code in the domain or slice. Ports return
    domain values without field-copy DTOs; keep representation translation only where the external
    format genuinely differs. Preserve sample deterministic rank/seed/count, recorded
    scope/covering-test selection and its own baseline, stale/unrecorded/gone-site rules, mismatch
    output facts, exception same-name/hash/site matching, rename tracking, renewal and unchanged
    old-column behavior, excluded stale entries and existing annotation timing. This task does not
    fix the separately recorded exception cleanup/renewal issues or change any
    output/schema/exit/flag. All external operations take ctx first, sealed failures; no
    held/background context or runtime.GOOS logic. Fake Exceptions/annotation stores operate wholly
    in memory, driven by scenario files; fake/adapter contract suites hold shared results and
    failures and config parsing tests retain raw YAML edge coverage. Legacy cmd still presents
    sample/except until handler moves, domain emits facts rather than UI text. Update
    import-boundary rules/fixtures/docs and retain meaningful guards until migrated scenarios/domain
    tests hold them. Add relevant exception rename/renew/sample cases to final-proof, not per-task
    binary comparisons. Light focused checks locally; configured hooks/CI for broad gates. No
    mutation run over this repository/worktrees/session moves/agents or new dependency without
    recorded selection.
    Exception and Tests already belong to internal/mutants; config aliases
    them and exceptionWire owns YAML names and optional fields. Define the
    Exceptions capability beside its existing values, without another model,
    child-port cycle or generic parameter added solely for package layout.
    Preserve Except's SameSite replacement versus append, entry comments,
    unrelated settings and comments, current file permissions and refusal
    to overwrite an unreadable or invalid document. Keep current Parse
    policy rather than applying a new configuration format in this refactor.
    Renew matches the complete Old value, consumes duplicate entries once
    each and writes nothing if any Old is absent. Preserve its single
    batch write before success presentation, not a partial write per entry.
    Updates reread the current document, preserving other settings changed
    since initial selection. Do not serialize a stale whole Config over it.
    Unit fakes own exception values; scenario bindings must update actual
    memory configuration bytes so fixture read/write assertions observe the
    result. Reuse one format-preserving codec at the adapter boundary; no
    YAML nodes or parser implementation in the domain or its porttest fake.
    Bind actual except and renew consumers to this capability, with positive
    and missing/wrong-binding controls; constructing an unused port while
    calling legacy config.Except/Renew is not migration. Keep any remaining
    real discovery setup honest until handlers move, and reuse T-92's source
    publication boundary for annotation rather than adding another writer.
    Renewal currently admits an existing supported non-directory source
    through Stat, following symlinks. A directory, missing path or existing
    unsupported source instead permits the moved-function search; another
    Stat error aborts before any exception update. Preserve this distinction
    through an actual bound source observation. Neither orphan Lstat presence
    nor the rename-follow Missing boolean alone answers that question.
    Record the minimum remaining observation contract after T-93 before
    building it, and retain this admission/failure edge in focused guards
    and final proof. Do not introduce new path or cleanup behavior here.
    Preserve actual config failure classification: Parse/type/shape errors
    retain their InvalidError reason/key facts for config.invalid, while
    ordinary read/write failures retain their current I/O classification.
    A missing document is empty for Read and permits Except creation, but
    nonempty Renew still fails that read; empty Renew performs no I/O.
