    sample. Keep reusable template CLI/version/release tooling and third-party notices intact. Drop
    only sample assertions from restored main tests; do not expose count as a public command or
    remove unrelated unreadable/stdin boundary checks. Reconcile docs/go.md, README and features
    README with actual packages and two-driver coverage, remove completed-stage temporary
    scaffolding and stale claims. No new public behavior/flag/output/exit changes, no freshly
    fabricated mutation results and no own-code mutation runs. Report exact removed paths/references
    and final S0..S9 state, plus unresolved parked template/gate ideas with concrete implemented
    commit/config evidence for coordinator reconciliation; do not manually edit work owners/statuses
    or silently mark an idea complete. Prepare refactor-final-proof with the final product head and
    full deliberate-difference list, but do not begin it or turn mutation proof/nightly back on in
    this task. FutureT86 remains later. Local checks limited to named top-level CLI scenarios and
    relevant package compile/tests, broad gates hooks/CI, no worktrees/sessionmoves/agents.
    Reconcile docs/CONFIG.md's inherited claim that the project has no own configuration with
    the actual itos-cc.yaml loader; distinguish format policy from implemented behavior without
    adding configuration features. Final guides must distinguish configured checks from disabled
    proof/nightly work awaiting later tasks, rather than claim mutation proof is running.
    Reconcile template-bare-decision-citations locally as part of documentation cleanup:
    comments citing the template's decision 26 or 23 must name itos-template explicitly where
    they refer to that source, preserving source notices. Do not send external upstream messages
    as part of this task. Report the evidence for coordinator registry reconciliation.
    Reconcile the remaining gate ideas at their actual scope: current CI
    lint covers internal only, while gate-golangci-lint asks for the module;
    a present pre-commit script is not a declared project hook. Keep any
    unfinished gate as separately named work before umbrella completion.
