- id: T-95
  type: refactor
  title: Isolate fresh counted preparation behind its domain port and retire legacy mutate
  why: >
    S7 after T-94. Complete the current plan with one coarse domain-owned Fresh boundary for fresh
    counted mutation preparation and publication, keeping immutable Git
    freezing/materialization/process/tool details at a real adapter rather than leaking a web of
    implementation steps into the domain. This is the coordinator choice under the person's
    overnight authorization: an explicit domain-valued request/result and sealed failures at an
    environment preparation boundary is cleaner than exposing each filesystem/process operation.
    Reuse the established History/Workers/coverage/fingerprint capabilities through injection;
    adapters do not select or import other concrete adapters. Preserve committed-source selection,
    count/seed reproducibility and deterministic rank, frozen config/support/test inputs and
    provenance, stage/working-copy cleanup ownership, bounded subprocess lifecycle, preparation
    failure and interruption semantics, truthful retained partial judgments, scope admission, and
    all existing cache/publication rules. No per-file save feature or native Windows ownership
    implementation is included. Context first, never stored or recreated; OS behavior supplied as
    value, no UI/JSON/exit/process implementation in domain. Provide memory Fresh behavior for
    Givens it can faithfully exercise, retain binary-only tags for real ownership/frozen-stage tool
    behavior as the plan requires, and add contract cases for shared observable outcomes and typed
    failures without mocks. Move remaining top-level mutate implementation to its domain/adapters
    and remove obsolete compatibility shims so no production caller imports legacy mutate once this
    task completes; graph may use pure domain and injected adapters without its S8 slice move yet.
    Preserve snapshot wire representation at adapter boundary. Update docs/architecture fixtures and
    domain coverage. Focus local checks on moved packages and named fixture scenarios; broad gates
    only hooks/CI. No own-code mutation runs, worktrees/session moves/agents or new dependencies
    without recorded selection.
    The Fresh contract and its domain values belong beside mutants' models,
    with minimum sealed failures and real/memory shared contract outcomes.
    The selected coarse API is Plan(ctx, FreshRequest) (*FreshPlan, FreshFailure),
    Prepare(ctx, *FreshPlan, coverageport.Scope) (*FreshPreparation, FreshFailure),
    and Release(ctx, *FreshPlan), all methods of mutants.Fresh. The pre-existing
    snapshot-state constant Fresh collides with that port name in Go: rename the
    constant to SnapshotFresh and update its consumers, preserving the exact
    "fresh" wire value, freshness policy and assertions. Reserve Fresh for the
    new port; do not add a forwarding package or duplicate freshness model.
    FreshRequest owns
    the existing Root, Paths, Since, Count and Seed inputs. Plan returns the actual
    frozen plan or a typed failure, cleaning its own partial materialization when
    planning fails. Prepare returns actual ordered partial evidence as well as its
    failure; it never turns a failed collector command into successful coverage.
    Release owns the frozen export after preparation and joined trials. It is
    deliberately best effort, preserving the existing ignored physical RemoveAll
    failure, and invalidates the released plan just as its former Close did.
    This is distinct from WorkerPool.Close: check and retain that port's genuine
    typed lifetime failures rather than discarding them. No context is stored;
    cleanup must join entered work even when the caller's context is already done.
    Move the genuine FreshPlan, FreshBaseline, FreshPreparation, tool and stage
    evidence values once. Use the original coverage Scope, Test and Report values,
    not new equivalents. Move CommandExecution's genuine Args/Dir/Err observation
    to internal/coverage and retain a top-level alias where legacy coverage runners
    need it. Move project.Files to selection's existing Files ownership rather than
    copying source/test fields into a new Fresh inventory; a library alias may keep
    current callers compiling. Audit the added Excluded field's internal uses and
    preserve all public wire representations, ordering and nil-versus-empty facts.
    Keep ExternalBoundary wording, JSON tags and progress text in presentation.
    Pure admission/ranking/count/seed policy stays in shared mutants/selection
    functions called by real and memory planning, with no second fake algorithm.
    Put physical frozen environment preparation in internal/freshenv, implementing
    Fresh with injected capabilities. Compose actual Workers, Toolchain,
    coverage and Fingerprints at cmd; no concrete adapter defaults or type asserts
    inside domain behavior and no adapter imports selecting another concrete adapter.
    History stays bound at its genuine query consumers. The coarse physical Fresh
    adapter keeps owned Git metadata, mode/blob export, scratch and pinned diff
    operations through its injected owned executor. Existing History returns owned
    bytes and query facts, not export modes or scratch handles; its ordinary *At
    implementation does not provide counted process supervision. Do not replace
    owned Git commands with unsupervised queries or keep a decorative unused History
    field merely to claim injection. Memory Fresh consumes actual immutable history
    fixture state, with the same shared pure admission and selection policy.
    Keep mutants/porttest codec-free. Its Fresh construction may receive one pure
    DecodeConfig function from actual frozen bytes to the existing exclusion globs,
    *Tests, []Exception and *FreshInvalid. Composition implements it with the one
    existing config.Parse codec, forwarding its actual Reason and Key; no Config
    twin, pre-parsed desired settings, host reads, context capture or scenario-ID
    branching. A missing file supplies nil bytes, as config.Read already does.
    Require this binding when the fake plans/prepares and derive every setting
    from that plan's actual immutable committed configuration, separately from live
    bytes. Keep the production Fresh port unchanged. Shared guards distinguish
    committed invalid/live valid and committed valid/live invalid configuration,
    plus absent settings, exclusions and configured test/exception values.
    To bind Fresh through a real command invocation without scripted Plan returns,
    the memory adapter may project independently declared collector, command and
    probe observations from the logical project root into its actual owned frozen
    export. Rebase root-owned semantic directory/path keys and resolve relative
    artifact/command facts against the actual export; never guess scratch counters.
    Keep absolute external tool identities and literal user shell/environment or
    raw artifact content unchanged. Do not use blanket string replacement, copy
    live config/source/test bytes into the frozen tree, or select desired stages,
    final reports or verdicts by scenario identity. Actual requests choose those
    independent observations; traces record the actual frozen/worker execution cwd
    and bytes. Keep live facts and each plan's projected observations separate so
    release removes only that plan's state and cannot change other plans or live
    inputs. No production port or configuration model is added by this fake seam.
    Reuse the existing bound Tree and Surroundings for frozen source observations.
    Trials must still read actual frozen bytes after preparation and preserve the
    original bounds/original-text checks: replacing those reads with a plan-time
    byte cache could hide source changes made by tools during preparation. Memory
    bindings must expose the actual committed/frozen fixture state through those
    same observation ports, separately from live inputs and independent tool results.
    Preserve the fresh Python probe's project-root cwd, owned execution, actual
    command observation and cancellation failure. Ordinary Toolchain currently probes
    from its caller Dir and treats an unsuccessful optional probe as a negative fact;
    do not globally replace that behavior when composing the counted binding.
    Preserve the real command argv, probe records, baseline deduplication and fresh
    TypeScript own-versus-suite observation. Reuse one SelectionBaselines owner.
    FreshFailure is sealed: FreshRefused carries the existing repository/since/path/
    scratch/unsupported refusal kind and cause; FreshInvalid carries the actual
    settings Reason and Key; FreshFailed carries the actual stage, when any, and
    cause; FreshCancelled preserves the caller cause. UI maps these typed facts to
    existing problems, messages, metadata and codes, including tools versus other
    preparation failures and invalid committed config. No message matching or new
    exit-code behavior is introduced by this boundary migration.
    Do not turn environment preparation into a generic file/process API.
    Preserve the distinction between admitted Units (including zero-site Go
    functions), Eligible sites and Selected trials. Preparation measures the
    admitted judged-language scope; no-site non-Go inputs require no tool.
    No eligible sites skip preparation unless strict Go inventory is required.
    Preserve ordered actual stages and partial evidence on failure, stopping
    before baseline/trials after failed preparation. Ordinary best-effort
    per-test conversion from T-90 must not replace supervised fail-closed
    conversion here: a profile left by a failed command cannot erase failure.
    Freeze configuration and support/test/source bytes from the pinned commit;
    live installed dependencies and tools remain an explicit outside boundary.
    Preserve isolated runtime Git HEAD/index, removal of caller Git overrides,
    offline Go/Gradle/Maven policy and no-bytecode environment through injected
    execution. Do not install dependencies, download tools or trust live config.
    Counted mode writes no snapshot, annotation or reusable coverage cache.
    Keep preparation and trials under their shared abort/cleanup owner, join
    entered work before frozen input removal, and retain actual stage and
    interruption findings. Fake preparation derives evidence from immutable
    committed fixture state and independent collector/tool results, never
    expected stages, desired verdicts or supplied final coverage maps. Real
    process ownership and native frozen materialization stay binary fixtures.
    Compose the shared preparation/trial cleanup owner for counted work only.
    Workers.Open currently adopts a supplied Owner even for MutationRun, so
    installing a counted owner on the ordinary binding changes its local
    command cleanup budget. Preserve ordinary runs' independent budgets;
    FrozenTrials and preparation alone share the counted abort deadline.
    Do not make this domain migration a global change to cleanup ownership.
    Retiring mutate also removes graph's legacy observation defaults. Keep this
    bounded to existing mutation freshness observations, ahead of the later S8
    graph move. graph.NewBuilder takes roots and a MutationInputs binding bundle
    containing Snapshots func(root string) MutationSnapshotReader, Toolchain and
    Fingerprints, all existing mutants capabilities. No copied model, new process
    API or generic provider registry. Server.New receives and passes that bundle;
    cmd and actual retained graph/server fixtures compose the real bindings.
    The snapshot factory is pure construction from an already discovered project
    root and performs no eager reads. Missing bindings fail explicitly rather than
    selecting metricsdir/testtools/testinputs inside graph or server. Preserve
    per-project roots, snapshot cache stamps, read/admission-before-TypeScript
    normalization, actual current test/listed/support/suite hashes and their
    existing best-effort failure policy. Caller context reaches observations;
    do not rewrite graph discovery, overlay rules, caching, scheduling or output
    in this retirement. Add actual binding guards and preserve graph/check
    agreement and retained stale-snapshot assertions.
    Retirement identified an obsolete private wrapper-only assertion:
    TestListedFinalizationRetainsActualHashesAfterCallerCancellation calls only
    legacy recordListedWithInputs, which detaches with WithoutCancel; actual Run
    already uses T-92's caller-context domain implementation. Retire that unused
    wrapper/helper assertion explicitly, not as equivalent coverage of detachment.
    Preserve its valid actual-byte hash, missing-file empty hash, support and
    current-observation cancellation/cause guards in domain tests using the caller
    context. Keep the actual caller-cancel/no-publication and fail-fast parent-live
    listed guards. Do not restore detached domain observations or retain a test-only
    production shim to preserve dead behavior. Record each old/new test obligation.
    Attempt source65e4540 and reviewed spec heads4d90182/7e8dac8 were published
    at7e8dac82857e4617297546d403414fa9db2e4976. Exact workflow38897405629
    core job116961095695 failed eleven valid existing lint checks in moved code.
    Eight command-policy fixture MkdirAll/WriteFile errors were unchecked;
    freshenv preparation's helper switch needs the equivalent tagged form,
    testinputs broad-inventory comparison needs the equivalent De Morgan form,
    and G703 flags freshenv fileExists's existence-only os.Stat observation.
    The source-only ordinary revert30e1231ab55604d8425268640dba72b14071db7c
    was committed and published first, before this attempt record, preserving
    every later contract and proof note. This is our moved-code repair, not an
    itos defect. Prior domain/shared/binding/retained outcomes remain local-phase
    evidence; the original MUT179 failure remains unexplained and the isolated
    and original-selection diagnostic passes are not a causal correction or
    final native proof. The original workflow's other jobs were still active
    when core diagnostics were recorded; review their actual terminal findings
    before corrected-source republication. Reapply only the source revert after
    supported give-back and a published retake. Check the eight actual fixture
    setup errors and simplify the two equivalent conditions without weakening
    assertions. Inspect G703's actual existence-only callsites and supported
    external/symlink interpreter semantics before settling its narrow repair;
    do not add new containment restrictions, conceal the sink or use blanket
    suppression. Retain all thresholds, rules, meaningful guards and raw
    evidence. Focus on affected checks; broad gates remain configured CI.
    The G703 sink is used only to observe whether the selected interpreter
    exists at frozen-root .venv/venv/bin/python or explicit VIRTUAL_ENV/bin/python.
    The existing contract deliberately permits external installed environments
    and symlink identities. This Stat reads no file bytes and writes nothing;
    no separate untrusted relative operand is admitted. Preserve that supported
    policy with one operation-specific G703 annotation at the actual Stat sink,
    explaining the installed-interpreter observation. Do not hide the sink,
    reject legitimate external environments, or exclude another rule or path.
- id: T-96
  type: refactor
  title: Parse the mutation group with Kong before moving its handlers
  why: >
    S7 after T-95. Parse the whole mutation command group with the existing pinned donvargax/kong
    fork, defining the group/child CLI structs and contracts under one internal/mutation slice while
    handlers still call the current cmd orchestration. These are coordinator choices under overnight
    autonomy: one group slice keeps related command semantics together, and parser migration before
    handler moves isolates CLI compatibility from domain wiring. Use existing cli.Selection, choice
    enums, cumulative flags, typed numeric/value errors and shared help, with worker defaults
    supplied as boundary values/Kong variables, not runtime-dependent domain logic. Preserve exact
    help bytes and ordering for mutation plus run/check/list/sample/except, global --json placement,
    group flags/errors/unknown subcommand guesses, repeat/interspersed/equals/-- argument behavior
    and all current codes until S10. Config/tool/snapshot reads stay lazy after successful parsing
    so help works with broken config or absent tools. Fresh command instances and one parser per
    run; no global mutable registration, new DI library or futureT86 generated-registration work.
    Keep adapters injected at cmd, pure domains free of parser/UI. Any old CLI edge a live scenario
    cannot express is recorded and held by focused parser tests, not silently changed. Add every
    subcommand help, help mutation run, mutation rn, mutation --changed run and
    --json-before-command cases to final-proof without a per-task comparison. Update boundaries/docs
    as needed and retain old meaningful checks until covered. Local checks focused, full gates
    hooks/CI only; no own-code mutation/worktrees/session moves/agents or unapproved dependencies.
    Preserve provided-flag facts separately from empty or zero typed values.
    Explicit run --count 0 enters counted validation, never ordinary run;
    run --seed= without count retains its missing-count conflict, while
    run --count 1 --seed= refuses the empty seed. Sample --seed= instead
    supplies its empty seed without asking History.Head. Except with an
    omitted reason differs from --reason= in its problem rule and value.
    Keep original numeric spelling where range errors report the flag value,
    including zero forms, and preserve literal no-coverage/no-annotate names
    without adding positive aliases. Hold these cases with focused parser
    guards and final proof, using the one parser's provided/raw-value facts.
    Preserve top-level help's existing flattened mutation subcommand list
    when Kong owns the group; a single group-summary row changes that help.
    Extend the shared moved-help and help-topic routing for nested commands,
    including help mutation run and extra-topic refusals. Trace the selected
    group or child on the same parser without reading configuration or tools.
    Source-backed compatibility includes runGroup's existing group-leading
    --json behavior: it selects JSON for group errors, but a stripped leading
    group flag is not forwarded to a known child's execution. Thus mutation
    --json list remains plain unless the child itself receives --json, whereas
    --json mutation list passes JSON to the child. Repeated stripped group
    --json flags are not new child duplicate errors. Preserve this quirk and
    distinguish group-before-child, top-level and child JSON placements in
    focused guards and the one final equivalence proof; a policy fix is separate.
