- id: T-142
  type: ci
  title: Land Renovate's updates with their Task footer in the commit's last paragraph
  why: >
    Found 2026-10-20: main has been red since 6548192 (PR #52, actions/checkout v7), and cdd48bc
    (#59) and dd4cd26 (#60) followed it (CI 39424311663, itos verify: 'build commits need a Task:
    T-... footer'). Each message does hold 'Task: T-131' (twice), but Renovate landed the pull
    request through GitHub's own merge (committer GitHub, ' (#60)' after the title), a squash, and
    GitHub appended 'Co-authored-by: donvargax-renovate[bot] ...' as a paragraph of its own. Git
    reads trailers only from a message's last paragraph (git interpret-trailers --parse on dd4cd26
    prints the Co-authored-by line alone), so itos is right to refuse them; the fix is in how
    Renovate lands a commit, not in itos. Make every Renovate update reach main with its message
    exactly as Renovate wrote it, the Task footer alone in the last paragraph and once. ci.yml and
    cd.yml run only on pull requests and pushes to main, so a renovate/ branch gets no checks
    until a pull request exists, and branch automerge always ended in one; the person chose
    (2026-10-20) to make pull requests the normal path rather than run CI on renovate/ pushes:
    automergeType "pr", set explicitly, in .github/renovate.json5 and automergeStrategy "rebase",
    unless the Renovate docs at the runner's pinned
    version (44.167.5, donvargax/github-admin's renovate.yml) show a merge method that keeps the
    commit and its message better, with a comment saying why. The repository has allow_auto_merge
    off: say from the docs how platformAutomerge behaves then and when an update lands. Both
    lines stay local only until donvargax/renovate-config#6 is released and the preset pin moves
    past v1.3.0; then they come out of this file, and the comment says so. Find why Task: T-131 appears twice (go-template-itos's file notes that
    commitTrailers adds up rather than replaces when configs merge) and make it appear once.
    Rewrite README's CI section for the pull-request path (a pull request per update, both
    workflows on it, rebase-merged once every check is green), from Renovate's docs and the
    github-admin run logs: branch automerge opened #59 and #60 after prNotPendingHours (last
    rebased 2026-10-19 01:46 by run 39186372802, opened 2026-10-20 04:33 by run 39370032256) and
    merged them through the pull request (39394630179, 39423985675). Keep the shared preset and the
    T-131 footer rule otherwise as they are; change nothing in other repositories
    (go-template-itos#3 tracks the template; the coordinator files any backport). Validate the file
    locally with Renovate's own config validator at 44.167.5 and report its output. The three
    commits already on main are published and stay as they are; the person decided (q-71) that CI
    gets past them by moving itos.yaml's commits.since from 313ea4a to dd4cd26, in its own ci
    commit of this task, rewriting the comment above it to say both what it was (where
    verification starts: the commits before itos) and why it moved (the three Renovate commits,
    6548192, cdd48bc and dd4cd26, whose Task footer GitHub's squash Co-authored-by paragraph pushed
    out of the trailer block). No waiver mechanism, and itos keeps git's trailer rule. Push that
    commit first, alone, so main turns green before the Renovate change. The proof that the
    Renovate change works is the next update Renovate lands: report what the coordinator should
    look for.
- id: T-143
  type: refactor
  title: Dispatch any selected command through one generic call, with no per-command case
  why: >
    First task of T-86 (ADR-0051), in cmd only, no layout change. cmd/itos-cc/dispatch.go hard-codes
    the mutation group's admission and help (about lines 118-135), binds a handler and has a switch
    case per mutation child (141-158), binds lazy config for crap, dry and units by name (161-175)
    and has a case per command calling callSafely with c.X.Run and c.X.JSON (170-180); parserOf
    binds scrap's handler eagerly (73). Replace them with one generic path: kong's parsed.Selected()
    node and Context.Call on its Run (the donvargax/kong fork v1.16.2-itos.1, context.go:923), group
    admission for any node that has children rather than the name mutation, a command's --json read
    from the parsed node rather than a field per command, and handlers and itos-cc.yaml bound
    through BindToProvider so config is still read only when a Run needs it, never for help or
    version, and config.invalid fails only the command that reads it (provider errors come back
    unwrapped, callbacks.go:273-274). Help, help order, the unknown-command guess, errors, exit
    codes, the interrupt exit and a fresh parser per run stay byte for byte; callSafely still turns
    a panic into the internal failure. The adapters struct and diskAdapters stay as they are (later
    tasks). No new dependency. Kong stays only in cmd and internal/cli. Byte equivalence is proven
    once at T-86's end, not here.
- id: T-144
  type: ci
  title: Refuse a slice under internal/slices importing another slice
  why: >
    T-86 (ADR-0051): no package under internal/slices/X imports one under internal/slices/Y.
    depguard cannot say not a sibling without a rule per slice, since its deny list is a prefix and
    would refuse a slice's own subpackages too. Add to tools/bin/architecture-check a check over go
    list's imports (stdlib tools only, as its linked check does) that refuses such an import, naming
    both packages, while accepting a slice importing its own subpackages, any engine, and
    cmd/itos-cc importing every slice. Its fixtures in tools/testdata/architecture accept a slice's
    own-subpackage import and cmd's, and refuse a sibling import, the refusal's message checked.
    internal/slices does not exist yet, so the check lands green on today's tree; it must not refuse
    anything there. Describe the rule beside the other arrows in docs/go.md's boundary list, naming
    ADR-0051.
