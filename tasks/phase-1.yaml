# The ledger's phase 1: the tasks that drive every commit but a feat, a fix or
# a docs, each named in its commit's Task footer (itos commit --task T-2).
# A task:
#
#   - id: T-2
#     type: chore # one of commits.types
#     title: What it is
#     why: Why it is worth doing. # optional
#     done_when: # the checks that prove it, which itos task T-2 runs
#       - run: a command that exits 0 once it is done
- id: T-1
  type: chore
  title: Adopt itos
  why: >
    The commit that adds itos.yaml, this ledger and the work registry names it:
    itos commit --task T-1.
  done_when:
    - run: itos config check
- id: T-2
  type: test
  title: Tag every scenario with an ID and require the Scenarios footer
  why: >
    No scenario carries an ID tag, so a feat or a fix cannot name the
    scenarios it turns green and the Scenarios footer is off. Tag each
    Scenario and Scenario Outline of features/*.feature on the line above it,
    numbered from 01 in file order, with its file's prefix: architecture_graph
    GRAPH, cli CLI, complexity CPLX, coverage COV, crap CRAP, dry DRY,
    file_selection SEL, metrics_snapshots SNAP, mutate MUT, scrap SCRAP,
    serve SERVE, units UNIT, viewer VIEW (so @ID-MUT-01). Change no step and
    no scenario's name. Fill features/smoke.yaml with one live scenario of
    each file, a fast one central to it. Then set
    commits.footers.Scenarios.required_for to [feat, fix] in itos.yaml, in
    the same commit as the tags, so no feat or fix lands between them
    unchecked.
  done_when:
    - run: >-
        awk 'FNR==1{prev=""} /^[[:space:]]*Scenario( Outline)?:/ && prev !~ /@ID-[A-Z]+-[0-9]+/
        {print FILENAME":"FNR": no ID tag"; bad=1} NF{prev=$0} END{exit bad}' features/*.feature
    - run: itos tests smoke check scenario
    - run: grep -Eq 'required_for:[[:space:]]*\[feat, fix\]' itos.yaml
    - run: itos config check
- id: T-3
  type: ci
  title: Nightly mutation job that commits its results back even when it fails
  why: >
    Mutation testing of the whole suite is too slow for every push, so it runs
    nightly, and .metrics/mutate/ must be committed back or every night is a
    first run. itos-cc mutate exits 1 when any mutant survives, which on this
    codebase is every night, so a job that commits only on success never
    stores anything. Add .github/workflows/nightly.yml: on a schedule at
    09:00 UTC (2am Pacific) and on workflow_dispatch; one ubuntu-latest job
    with contents: write and a concurrency group so two runs never overlap;
    actions pinned to the same commits as ci.yml; build itos-cc from the
    checked-out source and run "itos-cc mutate --all-tests --no-annotate"
    over the project (--no-annotate because no committed source carries the
    summary comment, and the job must not rewrite the sources). The mutate
    step fails the job as it exits; a later step that runs whenever the job
    was not cancelled commits .metrics/mutate/ alone, only when it changed,
    as github-actions[bot] with the header "chore: record the nightly
    mutation results" and the footer "Task: T-3" (the commit rules need a
    Task footer for chore), then rebases onto origin/main and pushes,
    retrying a few times if main moved. Its success never turns the job
    green. Update README's nightly paragraph to point at the workflow.
  done_when:
    - run: actionlint .github/workflows/nightly.yml
    - run: grep -q -- '--all-tests --no-annotate' .github/workflows/nightly.yml
    - run: "grep -q 'Task: T-3' .github/workflows/nightly.yml"
    - run: grep -q 'workflow_dispatch' .github/workflows/nightly.yml
- id: T-4
  type: fix
  title: Snapshot writes at the same time pass on Windows
  why: >
    main has been red on windows-latest since ceef519 (run 37563106445):
    TestWritesAtTheSameTimeLeaveOneWholeSnapshot in metrics/ gets "rename
    .metrics\x.json.*.tmp .metrics\x.json: Access is denied." from 12 of 20
    concurrent Writes, and "mode -rw-rw-rw-, want 0644". On Windows a rename
    onto a file that another rename is replacing fails with
    ERROR_ACCESS_DENIED or ERROR_SHARING_VIOLATION for a moment; Go's own
    cmd/go retries those (cmd/go/internal/robustio). metrics.Write retries the
    rename on those two errors for a bounded time (about a second, short
    sleeps) on Windows only, and still returns the error after that. Windows
    has no Unix permission bits (Go reports 0666 for a writable file), so the
    test checks the mode only off Windows. Keep the test's concurrency as it
    is: it is what proves the fix.
  done_when:
    - run: GOOS=windows go vet ./metrics/
    - run: go test -count=1 ./metrics/
- id: T-5
  type: ci
  title: The nightly installs the viewer's packages, so its TypeScript is mutated too
  why: >
    The first nightly (run 37564055070) said "viewer: Vitest is not installed;
    run npm install" and then "baseline tests fail; snapshot not updated" for
    every file under viewer/src: the workflow never installs the viewer's
    packages, so the TypeScript half of the project is never mutated. Before
    the Mutate step, nightly.yml sets up Node with actions/setup-node pinned
    to a commit SHA (with its version in a comment, as the other actions are),
    node-version set to the current LTS major as a number, npm caching keyed
    on viewer/package-lock.json, and runs npm ci in viewer/. If itos-cc's
    Vitest coverage needs a package the viewer does not have (such as
    @vitest/coverage-v8 at the Vitest major), add it to viewer's
    devDependencies at an exact version, in its own build commit. The proof
    is a nightly run with viewer files reporting killed and survived mutants
    instead of a failing baseline; the coordinator starts that run, not the
    agent. Nothing about the Go half changes.
  done_when:
    - run: actionlint .github/workflows/nightly.yml
    - run: grep -q 'actions/setup-node@[0-9a-f]\{40\}' .github/workflows/nightly.yml
    - run: grep -q 'npm ci' .github/workflows/nightly.yml
    - run: cd viewer && npm ci --ignore-scripts >/dev/null && npx vitest run
- id: T-6
  type: ci
  title: CI gives go test 20 minutes, so Windows fits cmd/itos-cc's tests
  why: >
    On windows-latest, cmd/itos-cc's tests grew from 364s to 570s over three runs and passed go
    test's default 10-minute limit with listed-selection-baseline (run 37696128627), though no test
    failed. On the person's word (2026-10-07) the limit goes to 20 minutes now; making those tests
    faster on Windows is the idea windows-test-speed. Every test still runs; only the hang guard
    moves.
  done_when:
    - run: grep -q -- 'go test -timeout 20m ./...' .github/workflows/ci.yml
- id: T-7
  type: build
  title: The viewer's lockfile raises source-map-js past the versions npm audit flags as high
  why: >
    npm audit in viewer/ reports GHSA-68fv-2mgg-jv7q (an event-loop denial of service through
    indexed source-map section offsets) for source-map-js 1.0.0 to 1.2.1, which the lockfile pins
    at 1.2.1 through vite's postcss and @vitest/coverage-v8's magicast. It is a build- and
    test-time dependency only. A build commit raises it in viewer/package-lock.json alone, with no
    direct dependency of package.json changed and no override unless no parent allows a fixed
    version; the viewer still builds and its tests pass. The check reads the lockfile rather than
    running npm audit, so a later, unrelated advisory does not fail this task.
  done_when:
    - run: node -e "const l=require('./viewer/package-lock.json');const v=Object.entries(l.packages).filter(([k])=>k.endsWith('node_modules/source-map-js')).map(([,p])=>p.version);process.exit(v.length>0&&v.every(x=>!/^1\.[01]\.|^1\.2\.[01]$/.test(x))?0:1)"
    - run: npm --prefix viewer ci
      timeout: 600
    - run: npm --prefix viewer test
      timeout: 600
    - run: npm --prefix viewer run build
      timeout: 600
- id: T-8
  type: test
  title: ID-MUT-135's test leaves its mutants' own tests room on a slow runner
  why: >
    TestASelectionsTimeoutComesFromItsOwnRun failed once on windows-latest (CI run 37718895582,
    passed on rerun): the mutant 1 to 0 of main.go's looping line hit its 2.0s timeout on its own
    tests, where it should survive them and then time out with ID-A-01. The own tests' baseline is
    quick, so their timeout is the 2s minimum, and building and running go test on a Windows runner
    can take longer. The fix is in the test alone: give the own tests' runs room (a larger
    --timeout-factor with the assertions derived from it, or a slower own-tests baseline in the
    fixture), keeping everything it checks: ID-A-01 runs once alone without a mutant before any
    mutant runs it; the selection's timeout is the factor times that run, at least 2s; each mutant
    of the loop times out with ID-A-01 well before the factor times both tests' time; their outcome
    is timeout, scope listed, tests ID-A-01. If instead the own tests' timeout turns out to come from
    a baseline that did not build what a mutant's run builds (a cached build or test result), that is
    a product bug: stop and report it as an idea rather than widening the test.
  done_when:
    - run: go test ./cmd/itos-cc -run '^TestASelectionsTimeoutComesFromItsOwnRun$' -count=1
      timeout: 600
- id: T-9
  type: refactor
  title: Extract mutation command execution without changing legacy behavior
  why: >
    Option 2 of q-35, approved after the private spike, needs a separately verified execution
    boundary before owned-process safety changes. Keep worker.run(Command, timeout) and its callers
    unchanged. Leave worker-copy/root mapping, argv and shell selection, environment/PathEnv,
    timeout creation, combined output, elapsed time and current result classification equivalent.
    Extract execution of an already configured command into a small instance-local runner with
    deterministic lifecycle observation; its default still installs current killGroup behavior.
    Preserve Start/Wait errors and streams. This task adds no parent-run cancellation policy,
    cleanup-on-normal-return fix, Windows Job backend, fail-fast flag, scheduler or snapshot
    changes. Characterization tests come before extraction; passing legacy guards are not behavioral
    reds. Tests cover setup and legacy result/lifecycle equivalence with controlled fixture helpers
    on Linux, while shared code remains Windows-compatible. Later T-10 supplies explicit testability
    capabilities, and platform-scoped ownership slices implement safety behavior against those
    seams.
    The first attempt characterized execution in 7ed2367 and extracted it in e27e6a7.
    Exact-head CI 37890127956 passed Linux and Windows but failed on macOS because
    the setup test compared /var/folders with its physical /private/var/folders alias.
    The coordinator withdrew the extraction in 89ab4b1 before investigating further.
    Repair the characterization to compare the actual and expected physical worker
    directories while retaining environment, PathEnv and output assertions. Verify
    those guards against the original worker before retrying the extraction, then
    require all-OS CI for the implemented head before closing this task. This
    attempt is not behavioral-red ownership evidence and no production execution
    defect has been demonstrated by that path-alias failure.
  done_when:
    - run: grep -q 'func TestWorkerRunPreservesCommandSetup(' mutate/command_runner_test.go
    - run: grep -q 'func TestCommandRunnerPreservesLegacyResults(' mutate/command_runner_test.go
    - run: grep -q 'func TestCommandRunnerPreservesLifecycleOrdering(' mutate/command_runner_test.go
    - run: go test -timeout 20m -count=1 ./mutate
      timeout: 1200
    - run: go test -race -timeout 20m -count=1 ./mutate
      timeout: 1200
- id: T-10
  type: refactor
  title: Expose internal context and lifecycle seams for ownership tests
  why: >
    After T-9, add the small explicit testability capabilities approved as option 2 of q-35: an
    internal parent-context entrypoint, instance-local lifecycle/containment-operation injection,
    and deterministic completion observation. The legacy worker.run adapter still supplies
    context.Background and retains its command setup and current result behavior. Reuse the
    configured command and streams rather than reconstructing argv/shell/env. These are new internal
    capabilities, not behavioral reds against the original product; record that distinction. This
    task only makes missing ownership behavior reachable: do not implement correct
    cancellation-versus-timeout classification, completed-exit precedence, cleanup-on-error,
    normal-return tree cleanup, fail-closed containment or Windows Job ownership here. If exposing a
    seam cannot be separated from one of those behavior changes, stop and specify that as platform
    ownership work rather than disguising a safety fix as refactor. Keep dependencies per runner
    instance, with no test-only global hooks or general process framework. Verify legacy background
    adapter, explicit parent-context acceptance, injected lifecycle operations and unchanged
    preconfigured streams. No public fail-fast flag or scheduler/snapshot/preparation integration.
    Against this prerequisite the Linux and Windows slices first commit compiling behavior tests and
    record real failures before implementing their guarantees.
  done_when:
    - run: grep -q 'func TestLegacyWorkerAdapterUsesBackgroundContext(' mutate/command_runner_context_test.go
    - run: grep -q 'func TestCommandRunnerAcceptsParentContext(' mutate/command_runner_context_test.go
    - run: grep -q 'func TestCommandRunnerAcceptsInstanceLocalLifecycleOperations(' mutate/command_runner_context_test.go
    - run: grep -q 'func TestCommandRunnerKeepsPreconfiguredStreams(' mutate/command_runner_context_test.go
    - run: go test -timeout 20m -count=1 ./mutate
      timeout: 1200
    - run: go test -race -timeout 20m -count=1 ./mutate
      timeout: 1200
- id: T-11
  type: refactor
  title: Prepare committed inputs and deterministic fresh mutation plans
  why: >
    GitHub #27 requires fresh bounded selection without a mutation-result cache or full mutation
    prepass. Introduce an internal planning capability: resolve HEAD once for one repository,
    inventory selected committed paths/functions from frozen version-controlled inputs, and export
    them to private temporary storage in this checkout while preserving logical root/path
    provenance. Do not execute working-tree or untracked source/test/config edits as committed
    proof; declare external dependency/tool/environment boundaries rather than claim hermetic
    builds. Existing complete run and cached sample behavior remain unchanged. Static candidate
    discovery must not use prior mutation outcomes for admission. Reuse SHA-256 ranking with TEXT
    seed and HEAD default, stable root-relative slash paths and function/site identity that
    distinguishes same-name units, deterministic tie-breaking and an algorithm version. Select
    globally at most N sites before scheduling, with no per-file or worker budgets or mutation
    execution. Later preparation resolves uncovered status without redrawing selection. This task
    adds internal capabilities only, not a public count flag or original-product behavioral-red
    claims. Tiny committed Git fixtures and raw snapshots suffice; run zero local mutant trials and
    no broad mutation-fixture suites. Windows public integration stays in #29. Planning writes no
    snapshots, source annotations or persistent coverage artifacts.
  done_when:
    - run: grep -q 'func TestFreshPlanUsesCommittedInputs(' mutate/fresh_plan_test.go
    - run: grep -q 'func TestFreshPlanSelectsGloballyWithoutMutationCache(' mutate/fresh_plan_test.go
    - run: grep -q 'func TestFreshPlanSeedAndUnitIdentityAreStable(' mutate/fresh_plan_test.go
    - run: go test -timeout 20m -count=1 ./mutate -run "^TestFreshPlan"
      timeout: 1200
    - run: go test -race -timeout 20m -count=1 ./mutate -run "^TestFreshPlan"
      timeout: 1200
- id: T-12
  type: refactor
  title: Expose supervised and fail-closed measurement preparation for bounded execution
  why: >
    GitHub #27 needs reliable preparation evidence before any selected mutant trial. Add an internal
    opt-in preparation path usable by the bounded runner, preserving complete-run defaults. Route
    list, coverage, per-test coverage/conversion and required tool commands through the reusable
    owned executor with parent cancellation; avoid an import cycle by using a neutral boundary or
    instance-local injected execution rather than importing mutate into coverage. Capture every
    actual command success or failure, report admission and measurement stages explicitly, and never
    infer command success merely from a report existing or Report.Missing being empty. Missing or
    malformed reports, per-test conversion errors, provider failures, baseline failures and
    unsupported scope must fail this opt-in path; keep legacy soft-error behavior unchanged for
    existing complete commands. Measure required own and applicable listed reach from frozen
    committed inputs; no preexisting local coverage map is required. Keep the admitted file and
    function scope tied to the pinned source commit and resolved range base, including executable
    functions with zero mutation sites. Do not recover that scope from selected sites alone or
    rerun a live HEAD or mutable --since reference during preparation. Extend the plan's scope
    provenance if necessary; strict Go coverage must still see admitted zero-site functions.
    Planning's isolated bare Git metadata is for committed ignore classification, not a usable
    runtime repository with an unborn HEAD. Ensure Git-aware and Go build tools operate on the
    intended private committed inputs without leaking global Git-directory or working-tree
    overrides into test-created repositories. Resolve external tool and dependency availability
    explicitly, without silently reading dirty tracked inputs or installing packages. A reusable per-scenario
    coverage cache is separate future work, and count N does not bound list, coverage or baseline
    command costs. No persistent sampled coverage publication, public count flag, mutant scheduler,
    fail-fast scheduling or Windows Job implementation in this task. Tests use small controlled
    preparation helper commands and zero local mutant trials; focused checks locally, broad existing
    fixture suites in CI. Clearly label new internal capability tests, not original-product red
    evidence. Linux ownership is a prerequisite and Windows mode integration remains #29.
    First attempt reverted (2026-10-09): 3352f9b (supervised coverage executor) and bbec7ad
    (frozen-plan preparation) turned main red in CI 37985811436 on all three OSes;
    TestStrictGoReportsExecutableFunctionInUnloadedPackageAsMissing no longer found the unloaded
    package's executable function reported as missing evidence, so a complete-run default changed.
    The revert 020c72c takes both out. The test already fails at 3352f9b alone, so the regression
    is in the coverage executor's change to the legacy path (coverage/run.go and its neighbours),
    not in the frozen-plan preparation. The next attempt finds the cause in the product, keeps that
    test unchanged and green, and may reuse the reverted commits' work.
  done_when:
    - run: go test -timeout 20m -count=1 ./cmd/itos-cc -run "^TestStrictGoReportsExecutableFunctionInUnloadedPackageAsMissing$"
      timeout: 1200
    - run: grep -q 'func TestFreshPreparationReportsEveryCommandFailure(' cmd/itos-cc/fresh_preparation_test.go
    - run: grep -q 'func TestFreshPreparationOwnsCommandsAndPreservesListedReach(' cmd/itos-cc/fresh_preparation_test.go
    - run: grep -q 'func TestFreshPreparationPreservesCompleteDefaults(' cmd/itos-cc/fresh_preparation_test.go
    - run: go test -timeout 20m -count=1 ./cmd/itos-cc -run "^TestFreshPreparation"
      timeout: 1200
    - run: go test -race -timeout 20m -count=1 ./cmd/itos-cc -run "^TestFreshPreparation"
      timeout: 1200
- id: T-13
  type: ci
  title: CI runs the real TypeScript, Python and Kotlin tools on Linux
  why: >
    Language parity (the person, 2026-10-10) cannot be verified while CI installs no TypeScript,
    Python or JVM tooling: the one Vitest test skips there and no Python or Kotlin pipeline ever
    runs. Add to the ubuntu-latest test job only (macOS and Windows keep skipping; the coordinator
    chose Linux to bound CI time): Node with a committed tools fixture package (vitest and
    @vitest/coverage-v8 pinned by its lockfile, installed with npm ci), Python with pytest and
    coverage pinned in a committed requirements file, and a JDK with Gradle for a committed Kotlin
    fixture. Tests find these through one helper that skips with the tool named when it is absent,
    so local and other-OS runs stay unchanged. Add one smoke test per language that runs mutation
    run --json on a tiny committed fixture through the real tool (one or two trials, sparse) and
    checks a judged outcome and measured coverage. No product change, no tool downloads by itos-cc
    itself, and no change to what existing tests assert.
  done_when:
    - run: grep -q 'setup-python' .github/workflows/ci.yml
    - run: grep -q 'setup-java' .github/workflows/ci.yml
    - run: grep -q 'npm ci' .github/workflows/ci.yml
    - run: go test -count=1 ./cmd/itos-cc -run '^TestLanguageToolSmoke'
      timeout: 900
- id: T-14
  type: revert
  title: Take whole-suite-freshness-all back off a red main
  why: >
    The first landing of whole-suite-freshness-all, 9970945 (its steps) and 3e10f37 (the feature),
    turned main red in CI 38040233677 on windows-latest alone. The steps of ID-MUT-206 and
    ID-MUT-207 ran Python's runner through --test-command with its absolute path in double quotes,
    which reaches cmd /C escaped so cmd cannot run it, so those outcomes were never recorded and
    read missing. The cause is in the steps' fixture, not the product. Both commits come out
    together, since the steps alone are red; the slice relands with a fixture both platform shells
    run.
  done_when:
    - run: go vet ./...
    - run: go test -count=1 ./mutate/...
      timeout: 600
- id: T-15
  type: ci
  title: CI gives go test 30 minutes while cmd/itos-cc's Windows tests near 20
  why: >
    cmd/itos-cc's tests on windows-latest took 1042s and 1104s in two green runs on 2026-10-10, then
    passed T-6's 20-minute limit in CI 38054039543 (fail-fast-counts' first attempt, a timeout in a
    test no change touched) and took 1136s on the rerun. Every slice adds tests to that package, so
    main would go red on time alone. The limit only guards against a hang: 30 minutes keeps that
    guard and the headroom while windows-test-speed brings the package's time down.
  done_when:
    - run: grep -q -- 'go test -timeout 30m ./...' .github/workflows/ci.yml
- id: T-16
  type: test
  title: cmd/itos-cc's fixture tests run in parallel, bringing Windows CI back under 10 minutes
  why: >
    windows-test-speed, made urgent: cmd/itos-cc's tests took 1136s on windows-latest on 2026-10-10
    and passed T-6's 20-minute limit once, so T-15 raised it to 30. Every CI run waits about 19
    minutes for Windows. None of the package's tests calls t.Parallel, and 24 of its 49 test files
    use os.Chdir, t.Chdir or t.Setenv, which rule it out. Running itos-cc through an explicit
    working directory and environment instead lets the fixture tests, each its own git repository,
    run in parallel. Tests only: no product behaviour changes, and a test that truly needs
    process-wide state stays serial with a comment saying why.
  done_when:
    - run: go vet ./...
    - run: go test -count=1 ./cmd/itos-cc
      timeout: 1200
- id: T-17
  type: test
  title: cmd/itos-cc's fixtures ignore the GOCOVERDIR of a covered test run
  why: >
    Under go test -coverprofile, as the nightly measures cmd/itos-cc's coverage, go test sets
    GOCOVERDIR in the test process's environment and every fixture command inherits it. The
    fail-fast fixture's listed tests treat GOCOVERDIR as itos-cc measuring them, so their failing
    selection passes, and four tests fail only under coverage:
    TestAFailingBaselineStopsTheRunWithoutInventingOutcomes,
    TestOutputDistinguishesCompletedWorkFromCancelledAndUnattemptedWork,
    TestValidJudgmentsInAStoppedFileArePreservedUnfinishedSitesStayUnjudged and
    TestAFileBlockedByAFailingListedSelectionCountsWhatItRanAndReused (found 2026-10-10, already
    failing before T-16 at 44dfd0c; package coverage 81.5% before T-16, 81.8% after). The nightly's
    own-test coverage of cmd/itos-cc fails while they do. Fixture commands get GOCOVERDIR only when
    itos-cc gives it, never from the outer run; the itos-cc subprocess itself keeps it, so its
    coverage still counts.
  done_when:
    - run: go vet ./...
    - run: go test -count=1 -coverprofile=$(mktemp) -run '^(TestAFailingBaselineStopsTheRunWithoutInventingOutcomes|TestOutputDistinguishesCompletedWorkFromCancelledAndUnattemptedWork|TestValidJudgmentsInAStoppedFileArePreservedUnfinishedSitesStayUnjudged|TestAFileBlockedByAFailingListedSelectionCountsWhatItRanAndReused)$' ./cmd/itos-cc
      timeout: 600
- id: T-18
  type: revert
  title: Take own-tests-python back off a red main
  why: >
    The first landing of own-tests-python, d1177a1 (the feature), turned main red in CI 38078607002
    on all three OSes: TestMixedScopesAndPartialRunsKeepTheirOwnDependenciesInEveryLanguage expects
    a Python own outcome whose fixture has no test file reaching it by name to be drawn and reused
    as fresh, and the narrowed own command now judges it differently. The feature comes out alone;
    its steps, 78ff116, skip outside the language-tools job and stay. The slice relands with that
    test updated.
  done_when:
    - run: go vet ./...
    - run: go test -count=1 ./mutate/...
      timeout: 600
- id: T-20
  type: refactor
  title: Snapshot file operations go through replaceable seams
  why: >
    metrics-windows-rename needs red unit tests that inject a rename and a read failing with the
    error Windows returns while another writer or reader holds a snapshot, and that compile against
    the product before the fix. The rename and read of metrics go through package variables
    (osRename, osReadFile) and the Windows retry's error test through another (ephemeral), each the
    call it was, so nothing changes until the fix.
  done_when:
    - run: go vet ./metrics
    - run: go test -count=1 ./metrics
- id: T-21
  type: revert
  title: Take strict-scope-refusals back off a red main
  why: >
    The first landing of strict-scope-refusals, c081fa6 (the feature), turned main red in CI
    38101270114 on windows-latest: TestLineCoverageRefusesOnlyScopesOutsideItsInventory's Python
    examples name targets such as /elsewhere/lib, which Windows does not call absolute, so they were
    joined beneath the build root and admitted. The feature comes out alone; its steps, 1d8259b,
    stay, red until it relands with rooted paths taken as outside the root.
  done_when:
    - run: go vet ./...
    - run: go test -count=1 ./mutate/...
      timeout: 600
- id: T-22
  type: ci
  title: A release publishes the commit main's CI proved, without testing it again
  why: >
    A pushed vX.Y.Z tag ran the whole test matrix again (about 20 minutes on three OSes plus the
    language tools) on a commit whose main push had already passed that exact matrix: v0.10.0
    (97f4b13), v0.11.0 (bed614d) and v0.12.0 (53cb215) each had a green main run on the same sha.
    The repeat proved nothing new and was where both release flakes struck (v0.9.0, v0.10.0), each
    holding the release until a rerun. On a tag, test is skipped; draft first requires a successful
    main push run of CI for exactly that sha, waiting for one still running, and fails with a
    message when there is none, so an untested commit still cannot publish. Pull requests and main
    pushes are unchanged.
  done_when:
    - run: grep -q 'Require a green main CI run of this commit' .github/workflows/release.yml
    - run: "grep -q 'actions: read' .github/workflows/ci.yml"
- id: T-23
  type: test
  title: The macOS pid-file and race-build cleanup tests are deterministic
  why: >
    Two flaky tests in mutate:
    TestMacOSSupervisionFailuresDoNotPermitUnsafeFallback/captured_group_only read an empty
