  type: refactor
  title: Move units into internal/slices/units, declaring its command for assembly
  why: >
    T-86's first slice move (ADR-0051), units being the cheapest and least shared: internal/units
    (CLI, Contract, Query, Handler, Run) uses only the selection Tree and lang Surroundings ports
    and the exclude setting. Move it to internal/slices/units, its .metrics/mutate snapshots and
    itos-cc.yaml exceptions with it if it has any (ADR-0037). The slice exports a declaration cmd
    can assemble from: its command name, help line, a constructor giving a fresh CLI value per run,
    and the consumer-owned Ports interface it needs, which cmd's adapters satisfy through methods
    (the coordinator's call in ADR-0051): the selection Tree, lang Surroundings and, for the
    exclude setting, the selection engine's settings reader T-147 adds, so units reads nothing
    through mutation's model; T-143's units handler provider in dispatch.go then builds the handler
    from those ports. Assemble it in cmd by hand this once, through the kong
    fork's DynamicCommand, keeping the top-level help order and the unknown-command guess's tie
    order (DynamicCommand appends after struct fields, kong.go:142-160, so the order must be
    checked); the generator that replaces the hand step is the next task. Its steps stay in
    features/ (units.go, units_routes.go). Update tools/testdata/architecture/check_test.go's
    package lists, .golangci.yml's globs where they name internal/units, and its depguard slices
    rule, which denies the whole module by prefix and lets only the engines through, so it would
    refuse a slice under internal/slices importing its own subpackages (T-144 had to put its
    fixtures in a nested module for that reason): let a slice import its own subpackages while
    architecture-check's sibling rule keeps refusing other slices, with fixtures for both;
    docs/go.md's package list,
    docs/architecture.md and README's layout table. Help, errors, exit codes and lazy config
    unchanged. Depends on T-143 (generic dispatch), T-144 (the sibling rule) and T-147 (the
    exclude setting in selection).
- id: T-146
  type: build
  title: Generate cmd's command assembly from each slice's declaration, checked current in CI
  why: >
    T-86 (ADR-0051): an ordinary new command must need no hand edit outside its slice. A stdlib tool,
    tools/bin/assemble, a Go package as tools/bin/release-notes and release-version are (go/parser
    and go/format, no new dependency) scans internal/slices/*/ for the declaration T-145 introduced and
    writes a committed cmd/itos-cc/commands_gen.go: the slices' imports sorted, their DynamicCommand
    registrations in name order so help and the unknown-command guess keep their order, and the
    binding of cmd's adapters to each slice's Ports. units, the only slice by then, moves from
    T-145's hand assembly to the generated file. Add an itos.yaml ci.steps static step that
    regenerates into a temporary file and fails, naming the file, when the committed one differs, at
    the cheapest tier that catches it. The tool's own test adds a fixture slice in a temporary tree
    and expects it in the output in order, and refuses a slice with no declaration or two with one
    name. Document how to add a command in docs/go.md's Adding a package section. Depends on T-145.
    From T-145 (07f8f44): a slice is found by its package-level var Command = cli.Declaration{Name,
    Help, New} and its type Ports interface; cmd/itos-cc/commands.go is the hand file the generated
    one replaces; kong.PostBuild(byName) sorts the model's children, since dynamic commands append
    after struct fields, and TestTheModelNamesEveryCommandInOrder is the only test guarding that
    order (cli.Usage sorts its own copy), so keep both. One handler constructor shape for every
    slice, so the generator writes the same provider for each: NewHandler(ctx context.Context, p
    Ports) (Handler, error). What varies between slices goes behind a Ports method cmd's adapters
    answer, not into the signature: units' exclusion becomes a Ports method whose cmd side reads
    the settings and keeps config.invalid's wording (settingsError), so the provider still returns
    that problem unwrapped (T-143's finding); dry's and crap's ui.Rel becomes a Ports method too
    when they move. Port method names are shared across slices (SelectionTree, LangSurroundings,
    SelectionSettings), one adapters method serving every slice that declares it.
- id: T-147
  type: refactor
  title: Take the exclude setting out of mutation's Config
  why: >
    T-86 (ADR-0051), before any slice moves, so each slice's Ports is written against the engine's
    settings from the start (the person, 2026-10-20). mutants.Config holds Exclude
    (internal/mutants/settings_reader.go:7-16), the globs every command leaves out, beside
    mutation's own Exceptions and Tests, so crap, dry and units read the exclude setting through
    mutation's model (cmd/itos-cc/adapters.go exclusionOf, called from T-143's handler providers in
    dispatch.go). The selection engine owns it instead: a selection value holding the root and the
    exclude globs, a SettingsReader port for it under internal/selection/port with its fake and
    contract in porttest, and config.Reader satisfying it through the same one codec, so
    itos-cc.yaml is still parsed by one reader and both classify a file alike. crap, dry and units
    read only selection's settings; exclusionOf goes. mutants.Config drops its Exclude field and
    carries the selection value instead, so mutation still reads root, exclude, exceptions and tests
    from one observation of the file at each admission boundary (its SettingsReader's contract), and
    its uses (internal/mutation/handler.go, except.go, internal/freshenv/plan.go) read the globs
    from that value. Problems, their wording, config.invalid failing only the command that reads it
    and lazy config for help are unchanged; no package moves. Move the settings contract's Exclude
    assertions to the selection contract, keeping what each checks.
