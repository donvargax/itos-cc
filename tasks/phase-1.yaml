- id: T-153
  type: test
  title: Run the binary driver only where CI and CD opt in
  why: >
    Decision 52 (q-73): locally the scenarios run in process against the fakes alone, as in-memory
    end-to-end tests, and the built binary runs them in CI and CD. TestFeatures
    (features/features_test.go) runs only when ITOS_CC_FEATURES_BINARY_DRIVER is 1 or
    ITOS_CC_FEATURES_BINARY names a binary (T-132's proof runs one it names, which is opting in);
    otherwise it logs one line saying the binary driver ran nothing and why, naming the variable,
    and builds nothing. The check is the first thing TestFeatures does, before TagFilter, so a
    -scenarios selection naming only binary-only or deferred scenarios passes locally having run
    nothing, as decision 52 accepts. Every workflow that runs go test (ci.yml, cd.yml, nightly.yml,
    refactor-proof.yml) sets ITOS_CC_FEATURES_BINARY_DRIVER: "1" in its top-level env, so itos ci
    run's smoke and range-named scenarios, every cd.yml job and the nightly keep running
    TestFeatures exactly as today: no scenario, job, platform or timeout changes in any workflow.
    itos.yaml's scenario lines stay as they are (they run both tests; locally TestFeatures logs and
    passes), and its comment, features/features_test.go's package comment, features/README.md,
    docs/go.md's driver paragraphs and README's testing and CI text say where each driver runs and
    name decision 52. An agent working on a binary-only scenario sets the variable itself. Measure a
    local go test ./... -count=1 before and after and put both times in the commit body.
- id: T-154
  type: test
  title: Measure what only the binary driver reaches, and name the local tests that would reach it
  why: >
    Decision 52 (q-73), after T-153: locally the scenarios run in process against the fakes alone,
    so code only TestFeatures reaches is checked only in CI and CD. Measure it, on one tree, as two
    module-wide Go profiles: the local tier, go test -count=1 -covermode=set -coverpkg=./... ./...
    with ITOS_CC_FEATURES_BINARY_DRIVER and ITOS_CC_FEATURES_BINARY unset; and the full tier, the
    same with ITOS_CC_FEATURES_BINARY_DRIVER=1 and GOCOVERDIR naming an empty folder, so
    TestFeatures builds itos-cc with -cover (features/features_test.go's package comment) and what
    its scenarios run is converted with go tool covdata textfmt and merged into the full profile.
    Install the real tools CI pins where this machine lacks them only if that needs no system
    package (testdata/tools/node with npm ci, testdata/tools/python's requirements in a virtualenv,
    ITOS_CC_LANGUAGE_TOOLS=1 and ITOS_CC_NODE_MODULES as cd.yml's languages jobs set them); list
    every scenario the binary driver skipped for a missing tool, since what it alone reaches is then
    unmeasured here and stays CD's. The difference is the blocks the full tier covers and the local
    tier does not, by package and function. Classify each function: main's wiring, signal and
    interrupt to exit code paths, build stamping, a real-tool adapter (coverage runners, toolchain
    probes, collectors), worker copies and real folders, git (check-ignore), or other. For each
    group say whether a local adapter or contract test could reach it cheaply (seconds, no real
    Python, Node, Gradle or Maven run), naming the test and where it would live under decisions 44
    and 49 (adapter and contract tests, never a fake standing in for the real tool a scenario
    checks), or that it stays CD's and why. Also try UNIT-06 in process: its binary-only reason
    (crap and mutation run still hand-parsed) is stale since T-100 and T-152; say whether it passes
    there, without changing its tag. Write the result to docs/binary-only-reach.md: the commands and
    environment, both totals, the skipped scenarios, a table of functions only the full tier reaches
    with their group and proposal, and a short summary. Add one idea per proposed group of local
    tests (itos work add), naming the functions; build none of them here. The measurement runs the
    whole suite once per tier, which is this task's work, not a gate.
- id: T-155
  type: refactor
  title: Move version into internal/slices/version over internal/version
  why: >
    T-86 (ADR-0051, R9). version is the last command outside internal/slices: cli.Version and
    cli.Build (internal/cli/version.go) with cmd's versionString (cmd/itos-cc/main.go:19-35) over
    main.version, bound at dispatch.go:88. Two version sources disagree today: .goreleaser.yaml:28
    and the binary driver (features/features_test.go's versionSymbol and commitSymbol) stamp
    internal/version.stamp and .commit, but nothing imports internal/version, so that stamp lands in
    a package the binary never links, and a release reports its version only because Go records the
    module version from the tag; main.version, which versionString reads first, is stamped by
    nobody. First, before any code, record what the released v0.18.3 binary prints (gh release
    download v0.18.3 for linux amd64 into the scratch folder: itos-cc version, itos-cc --version
    --json) and what a go build in the checkout and a go run print, in the move commit's body. Then
    make internal/version the one source: move version to internal/slices/version as a slice of its
    own, in a move commit separate from the edits (cli.Version, its Contract and tests), declaring
    Command and Ports with NewHandler(ctx, Ports) (Handler, error), the generator writing its
    provider, and the handler reading the version from internal/version.Version() (stamp, else the
    module version without its leading v, else the word versionString prints today), so help, the
    text, the JSON key, exit codes and every row of CLI-03 and CLI-18 stay byte for byte; delete
    main.version and versionString, and --version before any command stays the same command
    (cli.Dispatch). If internal/version.Version() cannot reproduce today's output for any build
    kind, keep today's output and adapt internal/version, saying so in the commit. cli.Completion
    and completion.feature stay as they are: the idea shell-completion decides them. Drop version's
    field from commandLine and its hand provider, regenerate commands_gen.go, update check_test.go,
    .golangci.yml, docs/go.md, docs/architecture.md and README's layout table. CLI-03 and CLI-18 are
    binary-only: run them locally with ITOS_CC_FEATURES_BINARY_DRIVER=1 (decision 52).
- id: T-156
  type: refactor
  title: Take mutation's domain out of the project and coverage engines
  why: >
    T-86 (ADR-0051, slices-mutation (d)), the first of the mutation pieces, so no engine imports the
