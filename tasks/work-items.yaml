      out of a function's hash in every language, so a function a range changed only in its comments
      is judged by no run, check or sample, and none of its lines asks coverage evidence under
      --fail-uncovered=lines (ID-MUT-259 holds it for Go; ID-MUT-256 to ID-MUT-258 hold freshness).
      What is left is a change that touches no executable line and is no comment, a signature-only
      change above all, whose function still needs fresh complete evidence under
      --fail-uncovered=lines.
