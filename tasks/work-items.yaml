  - id: slice-29
    title: Dart mutation sites and dry comparisons
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-28]
    kind: slice
    why: >
      Second item of dart-support (D1b), after slice-28 and before the parallel wave, since both
      edit internal/lang/dart.go. Mutation sites (mutation list runs no tool): only swaps that
      compile whatever their operands' types, because a Dart mutant that does not compile still
      costs a flutter test start (5 to 15 s) and the research (docs/dart/tooling.md 6) expects over
      10 % of plain syntax mutants not to compile. So the shared relational and equality swaps, +
      and - (numbers; + on a String does not compile and D7 reports such mutants as not compiling,
      their own status), && and ||, deleting the prefix ! and the unary -, true and false, 0 and 1,
      and a ?? b replaced by b (the left operand and ?? deleted; the TypeScript ?? to || does not
      compile in Dart). Not * and /, as int / int is a double (an idea may bring them back behind an
      analyzer check), not ?. to . (a nullable receiver does not compile), not the postfix null
      assertion x!, and no collection-if condition replacement, which no other language's conditions
      get. The grammar has no call node, so lang.Syntax learns Dart's selector chains (an identifier
      or selector followed by an argument_part is a call of it), which dry, scrap and http read.
      Scenarios MUT-262 and DRY-02's and DRY-04's Dart rows.
