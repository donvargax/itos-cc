  - id: interrupt-exit-130
    title: An interrupted command exits 130, says so once, and a second Ctrl-C ends it at once
    phase: 1
    owner: null
    status: todo
    depends_on: [refactor-final-proof]
    kind: idea
    why: >
      q-51: every command, serve and mutation run --count included, cancels its context on Ctrl-C
      and exits 130 with rule interrupted (count.interrupted's 75 goes), a minor release called out
      in Upgrading. A second Ctrl-C ends it at once, except while the process groups itos-cc owns
      are being killed (ADR-0021); q-37 settles as mutation.cleanup-failed. On Unix, once it has
      reported, it re-raises SIGINT with the default action so a shell's loop stops (q-54). Needs
      the context threaded through coverage and mutate first. Ships in the same minor release as
      semantic-exit-codes.

      Decision 38 (q-51) supersedes decision 31: move the code comments citing decision 31
      (internal/cli, internal/count, internal/disk, cmd/itos-cc/selection.go) to decision 38 in this
      slice.

      Execution constraint for S10: the person requires interruption and semantic exit codes in the
      SAME minor release. Push CI invokes release.yml automatically on feat/fix commits. Therefore
      prepare and verify both specified features before the single product push, and let its release
      cover both together; do not push an interrupt-only feat head and accidentally publish a
      partial transition. Taking/recording items with prose commits beforehand is fine. Keep
      separate red-first evidence and complete scenario coverage for each behavior. Resolve the
      exact coordinated handoff when specifying S10 after final proof; do not change release gates
      or silently bypass automatic release.

      S10 preparation from current code: internal/cli/interrupt.go StopOnInterrupt is the template's
      ADR31 helper, whose second signal skips every cleanup. It must honor ADR38's exception for
      owned process groups, while the UI stays domain-independent; bind per-run lifecycle
      capabilities at cmd, not a global registry or a context held for later I/O. Reuse the existing
      signal driver and deterministic signal-channel unit tests; preserve reliable readiness/cleanup
      and avoid timing-only demonstrations of a second signal after the process already exited. Unix
      must report once and then restore/re-raise SIGINT's default action so shell loops stop;
      Windows reports130 directly. Verify both actual process signal status and user-visible shell
      status honestly, not only exec.ExitError.ExitCode when it returns-1 for signals. Cleanup
      failures keep partial evidence and a distinct mutation.cleanup-failed problem; generic child
      cancellation/timeout must not be misclassified as a user interrupt. Native Windows ownership
      implementation remains deferred. Exact public scenarios are specified after final proof and
      before any product implementation.
    refs: [q-51, q-54, q-37]
  - id: semantic-exit-codes
    title: Exit codes follow square/exit, 75 kept for retry
    phase: 1
    owner: null
    status: todo
    depends_on: [T-30, refactor-final-proof]
    kind: idea
    why: >
      q-56: 80 usage, 81 unknown command, 82 a requirement not met (was 3), 100 internal (was 70),
      75 a failure that may pass when run again, 1 a check's no, 130 interrupted; precedence 130, 80
      and 81, 100, 82, 75, 1. Each problem in --json gains its own exit, as RFC 9457's status
      (q-54). A feat in the same minor release as interrupt-exit-130, proposed to go-template-itos
      alongside the internal/cli contract.

      Execution constraint for S10: interruption and semantic exit codes must ship in one minor
      release. Because main push CI automatically releases feat/fix changes, the product push must
      contain both fully verified implementations together. Coordinate the two item specs/red-first
      scenario evidence before implementation; no intermediate interrupt-only or codes-only product
      push, no bypassed hooks or disabled release gate. Take/registry prose pushes may precede them.
      Keep final-proof comparison before either public exit change.

      At S10 specification, explicitly cover a combined user interrupt and cleanup failure. ADR36's
      later exit precedence keeps130 first; the separate cleanup-failed problem has its own internal
      exit100 after migration, and partial data plus both facts remain visible. Do not silently
      restore the older q37 ordering that put70 above count.interrupted75, or hide the cleanup
      failure as an ordinary interrupt. A fail-fast check failure without an interrupt plus failed
      cleanup exits100 ahead of the check's1. Include plain/JSON outcomes, per-problem exit and
      aggregate precedence in red-first cases, retaining mutation/coverage classifications by types
      rather than message text. Keep these code changes in the single coordinated minor-release
      product push with interruption, after final comparison.
    refs: [q-56, q-54]
