# The work registry: who owns each phase and each piece of work, and what
# waits on what. itos work shows what can start; itos work check validates it.
# An item:
#
#   - id: T-2 # a task's ID, or a name of its own
#     title: What it is
#     phase: 1
#     owner: null # a handle, or null
#     status: todo # todo, doing, done or blocked
#     depends_on: []
phases:
  1: null # the ledger's phase 1, owned by nobody: a handle, or null
queue: []
items:
  - id: T-3
    title: Nightly mutation job that commits its results back even when it fails
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: T-2
    title: Tag every scenario with an ID and require the Scenarios footer
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: slice-1
    title: "mutate --since <ref>: judge only the functions changed since ref"
    phase: 1
    owner: donvargax
    status: done
    depends_on: [T-2]
    kind: slice
    refs: ["#9"]
  - id: T-4
    title: Snapshot writes at the same time pass on Windows
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: slice-2
    title: "mutate --fail-uncovered: an uncovered mutant fails the run"
    phase: 1
    owner: donvargax
    status: done
    depends_on: [slice-1]
    kind: slice
    refs: ["#9"]
  - id: slice-3
    title: mutate --json lists every mutant of each function
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: slice
    refs: ["#9"]
  - id: mutate-since-scan
    title: mutation list takes no --since, so it cannot list only the judged functions' sites
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      With --since, --scan takes its files from the range but lists every site in them, not only the
      sites of the functions --since would judge. No scenario says which it should be; listing only
      the judged functions would preview what a gate runs.
  - id: mutate-since-rename
    title: A pure rename is not in the range of mutate --since
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      git diff -U0 prints no hunk for a file renamed without a content change, so none of its
      functions is judged, and its snapshot stays at the old path under .metrics/mutate while the
      new path has none.
  - id: mutate-since-annotate
    title: mutate --since writes the summary comment of files with nothing judged
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      A file the range changed only outside functions, such as its imports, is selected with "judged
      0 of N", and mutate still writes its snapshot and rewrites its summary comment though nothing
      in it ran. The comment also counts every function the snapshot holds, while stdout counts only
      those judged.
  - id: windows-cross-vet
    title: GOOS=windows go vet ./... cannot pass off Windows
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      The tree-sitter bindings are cgo, and a cross-compiled vet turns cgo off, so every package
      that imports lang fails with "build constraints exclude all Go files"; it failed before
      slice-1 too (e1a44e4). It needs CGO_ENABLED=1 with a mingw-w64 compiler, or the vet of the
      Windows CI job is the only check.
  - id: mutation-check
    title: "mutation check: report missing, stale or failing cached results without running anything"
    phase: 1
    owner: null
    status: todo
    depends_on: [mutation-group]
    kind: slice
    why: >
      Was mutate-check-sample.
      Issue #8: a gate at itos work done needs to trust cached kills without re-running every mutant
      (--check), and CI a sample that spot-checks the cache (sample mode). #9 says itos would call
      mutate --check at work done, so this follows the #9 ideas.

      Issue #8 part 1: a gate (a commit hook) proves results exist for exactly the code being
      committed without running anything: for each selected function compare its current hash with
      the snapshot, and report the missing or stale ones. Parts 2 (tests' hash) and 3 (sample mode)
      are mutate-test-hash and mutate-sample.
    refs: ["#8"]
  - id: mutate-exceptions
    title: "mutate: equivalent mutants excepted in a committed file, each with a reason"
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Issue #10: an equivalent mutant (one no test can kill because it changes no behaviour)
      survives forever. A committed file names each one with a reason, so it stops failing runs
      while staying visible; docs/CLI.md rule 38 names it as the first project setting.
    refs: ["#10"]
  - id: gate-mutation
    title: "Mutation testing for gates: mutate CI workflows and policy YAML against their self-tests"
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Issue #11. Needs a deep design session before it is specified; the person will hold it with a
      different model. Do not specify it or hand it to an agent until that session has happened.
    refs: ["#11"]
  - id: T-5
    title: The nightly installs the viewer's packages, so its TypeScript is mutated too
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: viewer-ci-tests
    title: Push CI runs the viewer's tests and typecheck
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      ci.yml runs go vet and go test only, so a change that breaks viewer/ (vitest run, tsc
      --noEmit) passes CI and is first seen by the nightly, if at all.
  - id: viewer-source-map-js-advisory
    title: Viewer's lockfile pins source-map-js 1.2.1, which npm audit flags as high
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      npm audit in viewer/ reports GHSA-68fv-2mgg-jv7q (event-loop denial of service through indexed
      source-map section offsets) for source-map-js 1.0.0 - 1.2.1, which the lockfile pins at 1.2.1
      through vite 8.3.1's postcss and, since T-5, @vitest/coverage-v8's magicast. Found while
      adding @vitest/coverage-v8 for T-5; the version was already in the lockfile before it. It is a
      build- and test-time dependency only; npm audit fix says a fixed version is available. Raising
      it in the lockfile, in a build commit, and checking vitest run and vite build still pass would
      clear it.
  - id: mutate-unloaded-file-alone
    title: "mutate: a never-loaded file run alone counts as unmeasured, not uncovered"
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      markUncovered counts a language as measured only from the files of the run, and coverage.Build
      drops report entries that match no source, so a file the report never mentions, mutated alone
      (mutate src/unused.ts, or with --since when it is the only file changed), prints 'no coverage;
      running every mutant' instead of being uncovered, though the report measured other files of
      its language (MUT-19, MUT-48). Go fixtures do not show it, since go test reports a package
      without tests at 0%. With --fail-uncovered its mutants then run and fail as survivors rather
      than as uncovered; seen while building slice-2, not reproduced with a TypeScript or LCOV
      fixture.
    refs: ["#9"]
  - id: mutate-scan-line-order
    title: mutation list lists sites function by function, mutation run --json in line order
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      --scan lists sites unit by unit, so the sites of an inline callback (app.get("/u", (req, res)
      => ...)) come after every site of the function around it, not in line order. slice-3 sorts
      --json's "mutants" by line and column, so the two lists now differ in order where a function
      holds an inline unit.
  - id: mutate-windows-kill-tree
    title: A timed-out mutant on Windows kills the processes its tests started
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      On Windows killGroup only bounds WaitDelay: the timeout kills the test command (go test, npx,
      gradle) but not the processes it started, such as go test's test binary. A mutant that turns a
      loop infinite then keeps a core busy until the test binary's own timeout (10m for Go), slowing
      the mutants after it and leaving the worker copy undeletable. A Job object with
      JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE would kill the tree, as Setpgid does on Unix. Found writing
      ID-MUT-53, whose fixture sleeps rather than spins for this reason.
  - id: mutate-test-hash
    title: "mutate: results go stale when the tests that ran against a function change"
    phase: 1
    owner: null
    status: todo
    depends_on: [mutation-check]
    kind: idea
    why: >
      Issue #8 part 2, and IDEAS.md "Killed mutants must notice test changes": a kept kill survives
      the deletion of the test that killed it, since only the function's hash keys it. Record a hash
      of the test files that ran (or that import its module, from the graph) and treat a change as
      stale, in reuse and in the check mode alike.
    refs: ["#8"]
  - id: mutate-sample
    title: "mutate sample mode: re-run cached mutants in CI and fail on a mismatch"
    phase: 1
    owner: null
    status: todo
    depends_on: [mutation-check]
    kind: idea
    why: >
      Issue #8 part 3: CI re-runs N cached mutants chosen at random, or all of the changed
      functions', and fails when an outcome differs from the snapshot, so a committed cache written
      by hand or against other code is caught without a full run.
    refs: ["#8"]
  - id: mutation-group
    title: "mutation group: mutate becomes mutation run, --scan becomes mutation list"
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: slice
    refs: ["#8"]
  - id: mutation-log-prefix
    title: "mutation run's progress lines on stderr still begin mutate:"
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      The mutate package logs 'mutate: baseline …', 'mutate: no coverage for …; running every
      mutant' and 'mutate: no mutations to test' on stderr, and ID-MUT-20 and ID-MUT-22 check two of
      them. Since mutation-group the command is mutation run, so the prefix names a command that no
      longer exists. Plain output, not the contract; changing it means deciding the new text of
      those two scenarios.
  - id: namespace-without-root
    title: A source outside any project root gets its absolute path as namespace
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Found writing the test of ID-CLI-14: mutation list x.ts (and mutate --scan before it) in a
      directory with no package.json, go.mod or .git names the function .tmp.<…>.scan.x#place, the
      directory's absolute path dotted, where a package.json beside it gives x#place. Function IDs,
      and so the cache and the debt IDs, then depend on where the checkout lives. The working
      directory could stand in for a root.
