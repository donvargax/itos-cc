      an item changing Windows-only code can never pass --fail-uncovered on Linux. The issue offers
      two directions: skip such a file here with a reason (mutation.not-built), or merge outcomes
      recorded on each platform into .metrics/mutate/ so a check on Linux trusts Windows CI's. A
      decision of its own.
