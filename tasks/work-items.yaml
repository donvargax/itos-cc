      Likely a mutant in or near cmd/itos-cc main.go run/runGroup whose tests fork without end, eat
      memory, or signal every process. The same mutant could take down a developer's machine, so on
      the person's word (2026-10-07) the investigation waits for a way to run mutation testing of
