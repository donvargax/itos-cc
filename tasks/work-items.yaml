  - id: graph-listed-files-stamp
    title: "serve: rebuild the graph when a listed test's file changes"
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      The graph's builder rebuilds only when its signature changes: sources, tests, the snapshots
      under .metrics, and since listed-kill-freshness the support files. A file a listed test is
      defined in, such as a.feature, is in none of them, so serve keeps showing a listed kill fresh
      after that file changes until something else changes. Stamping the files the snapshots' listed
      maps name would fix it, at the cost of reading the snapshots on every poll.
    refs: ["#14"]
  - id: listed-selection-baseline
    title: Each selection of listed tests has its own baseline and timeout
    phase: 1
    owner: null
    status: doing
    depends_on: [listed-tests]
    kind: slice
    why: >
      Was listed-timeout.
      Found by a side agent before v0.5.0: listed-tests timed every listed run from one run of all
      listed tests (about 30 minutes for a hanging mutant on itos), and only proved them passing
      together.
    refs: ["#14"]
  - id: listed-selection-baseline-cost
    title: The baselines of listed selections cost fewer runs
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      listed-selection-baseline runs each distinct selection of listed tests once without a mutant.
      In a suite tested end to end, nearly every line is reached by its own set of scenarios, so
      there are about as many selections as mutated lines, and a run pays one more run of listed
      tests per line, a quarter to a half more than the mutant runs alone. Whether a selection could
      reuse the time of a superset already run, or of its tests measured one by one, to set its
      timeout, and only prove alone the selections that kill a mutant, is to be decided.
    refs: ["#14"]
