# The work registry: who owns each phase and each piece of work, and what
# waits on what. itos work shows what can start; itos work check validates it.
# An item:
#
#   - id: T-2 # a task's ID, or a name of its own
#     title: What it is
#     phase: 1
#     owner: null # a handle, or null
#     status: todo # todo, doing, done or blocked
#     depends_on: []
phases:
  1: null # the ledger's phase 1, owned by nobody: a handle, or null
queue:
  - T-2
items:
  - id: T-3
    title: Nightly mutation job that commits its results back even when it fails
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: T-2
    title: Tag every scenario with an ID and require the Scenarios footer
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: task
    why: >
      Spec in the ledger, tasks/phase-1.yaml.
  - id: mutate-since
    title: "mutate --since <ref>: judge only the functions changed since ref"
    phase: 1
    owner: null
    status: todo
    depends_on: [T-2]
    kind: idea
    why: >
      Started and cut off before this session: git stash "WIP: mutate --since" holds
      mutate.Options.Judge, FileResult.Judged, the skipped outcome and
      project.ChangedSince/Overlaps. Unfinished: run.go has a truncated "conti" and does not
      compile, snapshot.build still counts skipped sites in Sites, and no command or scenario uses
      it yet. Needs scenarios in mutate.feature before it is work.
  - id: T-4
    title: Snapshot writes at the same time pass on Windows
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: task
    why: >
      Was windows-metrics-write.
      TestWritesAtTheSameTimeLeaveOneWholeSnapshot (metrics/metrics_test.go, from ceef519) fails on
      windows-latest in every CI run since 88b2142 (runs 37563106445, 37563187387, 37563299759):
      os.Rename of a staging .tmp file onto .metrics/x.json returns 'Access is denied' when another
      goroutine renames onto the same file at the same moment, and the mode check wants 0644 where
      Windows reports -rw-rw-rw-. Either retry the rename on Windows (or serialize writers with a
      lock), and skip or relax the permission check there; until then main's CI is red on Windows
      and no item can be closed with itos work done.
