  - id: itos-work-process-friction
    title: Reduce repeated validation and bookkeeping in the itos work lifecycle
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Observed during the current refactor, without changing its queue or gates. T-81 implementation
      CI 38800701382 at 572f06a took 28m57s; its assertion probes took 18m53s and now overlap CI.
      Earlier T-80 evidence recording created a newer task-owned documentation commit and required
      another full CI cycle despite unchanged implementation. Task take/close/queue pushes also
      enter this repository CI platform matrix because the test job is unconditional. Proposed
      improvements for later specification: a validation receipt tied to implementation and required
      checks, with recording evidence separated from invalidating proof; repository CI recognition
      of changes confined to owner/status/queue fields, never source/scenarios/fixtures/gates;
      atomic completion recording validated revision/CI/evidence plus close/dequeue; drafts scoped
      to a task and fields rather than the full ledger file; one authoritative work show
      specification rather than overlapping current ledger and older registry descriptions. Preserve
      all valid checks and rejection of source or check changes after validation. A normal T-81 push
      also needed a narrowly justified approval retry; generated briefs could expose exact delegated
      push scope, an integration concern. These are process proposals, not authorization to bypass
      gates or fold tool changes into the current refactor item.

      Reported upstream on 2026-10-15 as consumer reports:
      https://github.com/donvargax/itos/issues/71 (validated implementation evidence),
      https://github.com/donvargax/itos/issues/72 (registry classification for CI),
      https://github.com/donvargax/itos/issues/73 (atomic validation and closure),
      https://github.com/donvargax/itos/issues/74 (task-scoped drafts),
      https://github.com/donvargax/itos/issues/75 (authoritative work-show specification),
      https://github.com/donvargax/itos/issues/76 (selective draft promotion),
      https://github.com/donvargax/itos/issues/77 (explicit delegated push scope), and
      https://github.com/donvargax/itos/issues/78 (early draft metadata validation). These reports
      do not authorize weakening checks or folding upstream implementation into the current
      refactor.

      A ninth observed friction report was filed and independently verified on 2026-10-15:
      https://github.com/donvargax/itos/issues/79, active job and step progress during long
      background CI watches. The watch preserved correct exact-revision status; the gap was
      visibility while remaining platform jobs ran. No change to required checks or polling by the
      coordinator is requested.

      Also reported the actual T-88 mandatory red-main repair/retry round trip as
      https://github.com/donvargax/itos/issues/80 on 2026-10-15: a reviewable source-revert plan and
      supported retry bookkeeping, preserving immediate main restoration, ordinary history and all
      gates. This is upstream workflow feedback, not authorization for a local bypass or new
      implementation scope.
  - id: strictness-outline-targets
    title: Represent distinct assertion targets for every expanded outline example
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      T-82 found that the local tools/bin/step-strictness version-1 manifest has one exact
      after-edit assertion name per probe. Scenario outlines can expand the same source assertion
      line into different names: SNAP-01 has four snapshot paths and SNAP-09 three file/path
      combinations. A source-check probe cannot currently state a separately reviewed exact target
      name for every expanded example. T82 uses a truthful bounded workaround: temporary feature
      Then literals become one constant wrong artifact/path identity while original commands,
      Given/When, examples and case identities stay unchanged; every example must reach and fail its
      intended Then. Shared source predicates are probed through non-outline scenarios separately.
      Later refine the local runner's explicit per-example assertion identity representation with
      backward compatibility, exact expanded case/step matching and all-example validation; do not
      weaken matching to arbitrary text, masks or accept setup/skips as assertion failures. Specify
      meaningful fixture tests for differing outline names and changed feature literals. This is our
      repository's developer tool, not an itos product defect, and does not block current snapshot
      work or authorize own-code product mutation.
