# The work registry: who owns each phase and each piece of work, and what
# waits on what. itos work shows what can start; itos work check validates it.
# An item:
#
#   - id: T-2 # a task's ID, or a name of its own
#     title: What it is
#     phase: 1
#     owner: null # a handle, or null
#     status: todo # todo, doing, done or blocked
#     depends_on: []
phases:
  1: null # the ledger's phase 1, owned by nobody: a handle, or null
queue:
  - slice-1
items:
  - id: T-3
    title: Nightly mutation job that commits its results back even when it fails
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: T-2
    title: Tag every scenario with an ID and require the Scenarios footer
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: slice-1
    title: "mutate --since <ref>: judge only the functions changed since ref"
    phase: 1
    owner: donvargax
    status: doing
    depends_on: [T-2]
    kind: slice
    why: >
      Was mutate-since.
      Started and cut off before this session: git stash "WIP: mutate --since" holds
      mutate.Options.Judge, FileResult.Judged, the skipped outcome and
      project.ChangedSince/Overlaps. Unfinished: run.go has a truncated "conti" and does not
      compile, snapshot.build still counts skipped sites in Sites, and no command or scenario uses
      it yet. Needs scenarios in mutate.feature before it is work.
    refs: ["#9"]
  - id: T-4
    title: Snapshot writes at the same time pass on Windows
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: mutate-fail-uncovered
    title: "mutate: uncovered mutants of judged functions fail"
    phase: 1
    owner: null
    status: todo
    depends_on: [slice-1]
    kind: idea
    why: >
      Issue #9 part 2: a changed function no test executes passes today, since uncovered mutants
      never run. A gate needs an uncovered mutant in a judged function to fail, reported as such
      (exit 1), behind a flag or the gate mode.
    refs: ["#9"]
  - id: mutate-json-mutants
    title: mutate --json lists every mutant of each function
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Issue #9 part 3: itos reads the result without parsing text or the cache, so --json carries
      each function's mutants (site, operator, outcome: killed, survived, uncovered, timed out).
      Exit codes are already the contract (docs/CLI.md).
    refs: ["#9"]
  - id: mutate-since-scan
    title: mutate --scan --since lists every site of the changed files
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      With --since, --scan takes its files from the range but lists every site in them, not only the
      sites of the functions --since would judge. No scenario says which it should be; listing only
      the judged functions would preview what a gate runs.
