      an end-to-end test's, and random inputs hit the boundaries mutants live on (> against >=, off
      by one). The first nightly left four survivors in crap.Score on *, 1 and -. Seeds are fixed so
      outcomes are reproducible under mutation (fast-check, Hypothesis and rapid take a seed; go
      test runs only a fuzz target's committed corpus).

