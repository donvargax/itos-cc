  - id: renamed-snapshot-left-behind
    title: A renamed file's snapshot stays at its old path when no run selects the new one
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      With since-follows-renames, mutation run --since moves a renamed file's snapshot only when it
      selects the file by its new path. A run whose paths cover only the old path, or any run
      without --since, leaves the old snapshot under .metrics/mutate for a file that is gone, and
      nothing removes it later; mutation check on the new path calls the functions missing until a
      --since run over it. The snapshot also stays when a new file now sits at the old path, since
      it is that file's path again. Whether a run without --since should find such orphans, and
      whether the old snapshot should be dropped or kept there, needs a decision.
  - id: crap-unloaded-file-measured
    title: A file no test loads, scored alone by crap, is untested, not unmeasured
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      coverage.Run counts a plan as Missing (measured-nothing) whenever its report names none of the
      plan's files, so crap --threshold over a file no test loads, alone (crap --threshold 30
      src/unused.ts in a Vitest project, where vitest related finds no test, exits 0 and writes an
      empty lcov.info), fails as coverage.measured-nothing, 'Run the tests and fix them', though the
      run succeeded. Since unloaded-file-uncovered the report knows the run measured its language
      (Report.Measures: every command exited 0 and wrote its report), so such a plan's files could
      score as untested at 0% instead. Read from coverage.Run and Plan.measured while fixing
      unloaded-file-uncovered, not reproduced.
