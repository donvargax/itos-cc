    why: >
      The graph's builder rebuilds only when its signature changes: sources, tests, the snapshots
      under .metrics, and since listed-kill-freshness the support files. A file a listed test is
      defined in, such as a.feature, is in none of them, so serve keeps showing a listed kill fresh
      after that file changes until something else changes. Stamping the files the snapshots' listed
      maps name would fix it, at the cost of reading the snapshots on every poll.

