  - id: outside-root-orphan-unreached
    title: A gone outside-root file leaves a snapshot no run reaches
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Since outside-root-snapshot-kept-fix, a snapshot is judged by the file it records, so the
      snapshot of a gone file outside the project root is an orphan at that absolute path. A run
      without paths at the root covers only the working directory, so it never removes it, and once
      the file directory is gone too no path reaches it either: a path that does not exist is a
      fragment, matched only beneath the working directory. It stays until removed by hand, unnamed
      by mutation check at the root. Whether a run at the root should reach such orphans needs a
      decision.
  - id: outside-root-snapshot-windows
    title: Check whether a run on Windows can write the snapshot of a file outside the root
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      A file outside the project root has its snapshot named .metrics/mutate/<absolute path>.json,
      which on Windows holds the drive colon (mutate\C:\...), a name NTFS likely refuses for a
      directory, so mutation run there may fail to write it. The ID-MUT-237 test and its mutate unit
      test skip where no such directory can be made, so CI does not say which. If it fails, such
      files need a decision on Windows: refuse them, or name their snapshots another way.
  - id: orphans-outside-git
    title: Orphans outside a git repository are never removed
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Since renamed-orphan-kept-fix an orphan is removed only once git shows no rename of its file
      to a file that exists. Outside a git repository, in one with no commit yet, or when git fails,
      renames cannot be read, so fail-safe every orphan is kept, and neither mutation run removes
      nor mutation check names any. A project without git keeps snapshots of deleted files until
      removed by hand. Whether such a project, where nothing can be renamed as git sees it, should
      have its orphans judged by the working tree alone needs a decision.
  - id: shared-failed-baseline-reused
    title: A reused file whose command's baseline failed for another file reports "not-run"
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Since reused-baseline-not-run-fix, a file's "baseline" in mutation run --json says whether its
      own tests' baseline ran in this run, and files sharing a command share it. Yet a file whose
      mutants were all reused, sharing its command (a Go package's) with a file whose baseline ran
      and failed in this run, reports "not-run", with or without --fail-fast, and its snapshot is
      written as reused, though the baseline of its tests did run and fail. "A failed baseline stays
      as it is" kept that case out of the fix, as did --fail-fast's unchanged output; whether it
      should say "failed", and whether its reused outcomes should still be written, is a decision to
      take.
