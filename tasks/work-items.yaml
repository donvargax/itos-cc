  - id: pytest-plugin-autoload-trials
    title: Python mutant trials pay pytest's plugin autoload on every run
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Measured during T-71 on a one-test project: every pytest trial of mutation run took 3.5s, a
      unittest one 0.1s. The cost is pytest itself loading the machine's installed plugins: the same
      pytest command took 3.2s run directly in the tree and 0.22s with
      PYTEST_DISABLE_PLUGIN_AUTOLOAD=1, and import pytest alone 0.14s. Each mutant pays it again, so
      Python mutation runs, and the scenarios that run them, scale with whatever plugins the
      interpreter has. Decide whether itos-cc, its docs or the scenario fixtures should do anything
      about it (a documented PYTEST_ADDOPTS or autoload setting, or a pinned plugin-free fixture
      interpreter), keeping in mind that PYTEST_DISABLE_PLUGIN_AUTOLOAD is one of the Python
      environment inputs of a recorded outcome.

      The person approved fixture-only speedups on 2026-10-15 while the refactor continues. Existing
      controlled mutation fixtures pass PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 through Run.Env; T-117
      records continuing this where tests need no plugins and retaining the environment in actual
      future fingerprints. This is not authorization to disable project plugins globally or change
      product defaults. The broader product-policy part of this idea remains open.
  - id: windows-test-command-quotes
    title: A --test-command with double quotes may not run as written on Windows
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Seen in T-71's CI run 38409191725 on windows-latest: mutation run --test-command 'grep -q "i >
      5" src/board.go && sleep 0.05 || sleep 30' slept 30 seconds on every run, the unmutated
      baseline included, so grep never matched the line it holds; on Linux and macOS it matched.
      itos-cc runs the line as exec.Command("cmd", "/C", line) (mutate/proc_windows.go), and Go
      escapes the line's double quotes as backslash-quote, which cmd does not read as quotes, so the
      > inside them likely became a redirection. Not reproduced on a Windows machine.
      --coverage-command shares the shell path. If confirmed, the fix passes the line through
      SysProcAttr.CmdLine, and a scenario with a quoted --test-command holds it.
