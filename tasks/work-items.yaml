    depends_on: []
    kind: idea
    why: >
      Tests with random inputs and no fixed seed can kill a mutant in one run and not the next, so a
      cached kill flips with no code or test change and mutation check and the planned sample mode
      cannot trust it. A run that re-runs a cached kill with the same function and tests hashes and
      gets another outcome reports it as flaky rather than trusting either outcome.
