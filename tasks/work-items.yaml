  - id: mutation-run-saves-each-file
    title: mutation run saves each file's results as soon as the file is decided
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      A mutation run writes .metrics/mutate/ only after every mutant has run (mutate/run.go:
      execute, then the write loop), except a fail-fast stop's Preserved files. A run cut off by a
      timeout, a kill or a lost machine keeps nothing, so a long run over a big repository never
      makes progress across attempts. Nightly 38231106901 (2026-10-12) ran 267 of 4901 mutants in 6
      hours and was cancelled at GitHub's job limit with nothing saved. Writing each file's snapshot
      once all its judged mutants are decided would keep every finished file; how a stopped run
      reports and exits ties to interrupt-exit-130 and ADR-0022's preserved files. Product behaviour
      with scenarios; its natural place is the mutation move (S6, S7).

      The path above is out of date. mutate/run.go is now internal/mutants/run.go, which calls
      execute (internal/mutants/run_execute.go) at line 199 and writes each file's snapshot after
      it, a fail-fast stop's Preserved files included (lines 287-313). The mutation move (S6, S7)
      finished without this, so it is now a behaviour change of its own, a slice with scenarios, and
      T-46 still names it as one way to make the nightly finish.
