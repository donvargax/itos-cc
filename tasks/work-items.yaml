      a Then step's definition may assert nothing), assertion-heavy a long run of Then checks,
      clusters scenarios repeating the same Given/When steps with the action an Outline or a
      Background, the table action a Scenario Outline with Examples, split a feature file too big
      for one rule. No branches or loops (that logic lives in step definitions, which scrap already
      measures as code) and no mocks. It makes the Gherkin parser, today in go.mod only for this
      repository's own scenario runner, a product dependency. Not in conflict with mutation's
      format-agnostic listed tests: scrap already reads each language's test syntax. Users: this
      repository's and itos's godog suites. Behind the current issue queue unless the person moves
      it.
