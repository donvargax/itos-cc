  - id: graph-testdata-own-root
    title: Graph tests on testdata run from a project root of their own
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Since snapshots-at-root the graph reads the .metrics of each repository's project root, the
      git top level. The graph tests that build graph/testdata/shop sit inside this repository, so
      their project root is this repository and they read its own .metrics: they pass only because
      none of its results match a file of shop. Such tests should run from a root of their own, such
      as a temporary git repository holding a copy of the fixture, so this repository's results
      never leak into them.
  - id: integration-coverage-other-languages
    title: Coverage from tests that run the built program, in TypeScript, Python and Kotlin
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      integration-coverage reads what Go binaries built with -cover write to GOCOVERDIR. The other
      languages have their own way to measure a program the tests start as another process: Node
      writes V8 coverage for every process to NODE_V8_COVERAGE, which c8 report turns into LCOV;
      coverage.py measures subprocesses once COVERAGE_PROCESS_START names its config (coverage
      combine merges the data files); JaCoCo's agent (-javaagent, or JAVA_TOOL_OPTIONS) writes an
      exec file per JVM, merged by jacoco:merge. One idea: let each plan name an environment for its
      commands and a step that turns what was written into a report, merged as integration data as
      Go's is, so --json's coverage says integration there too.
    refs: ["#14"]
  - id: go-coverage-own-exec
    title: "Go coverage: keep a project's own go test -exec"
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      To give binaries the tests build with -cover the run's GOCOVERDIR, the Go coverage command
      runs each test binary through itos-cc with go test -exec, since go test replaces GOCOVERDIR in
      a test binary's environment. A project that runs its tests through its own -exec (in GOFLAGS,
      or a go_GOOS_GOARCH_exec when cross-compiling) loses it on the coverage run, as the flag on
      the command line wins. itos-cc could read GOFLAGS and the target's exec program and run the
      test binary through them in turn.
    refs: ["#14"]
  - id: listed-kill-freshness
    title: A kill made by listed tests goes stale when its tests' files or the step code change
    phase: 1
