  - id: serve-listening-address
    title: serve names the address it listens on, not the one it asked for
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      With --port 0, serve's stderr line and its --json address say 127.0.0.1:0, not the port the
      system picked, so a script or a person cannot reach it; the S10 interrupt scenarios start
      serve on port 0 and wait on that line. Naming listener.Addr() would be a contract change, so
      it needs a scenario first.

      From p1-serve-announces-its-port (T-128, dropped as its duplicate 2026-10-18): the binary
      driver's Graph asks the system for a free port, closes it and hands it to serve; with
      scenarios running at once another can be handed the same port in between, so Graph retries
      serve on another port when it exits 75 before it is ready. Once serve announces its listener's
      address, the harness passes --port 0 and drops the retry.

      This belongs to serve's move to a web app of its own (1b449af, the person's decision of
      2026-10-17), which takes the graph along, since the graph is reachable only through serve.
      Serve's moves in this repository (T-102 to T-108, T-112 and T-113) are deferred until that web
      app is specified. Until then serve stays on its legacy handler, which still announces the
      address it asked for (cmd/itos-cc/serve.go:78).
