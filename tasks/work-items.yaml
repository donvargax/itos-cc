  - id: prepush-mutation-check
    title: A pre-push hook judges a few mutants of the changes being pushed
    phase: 1
    owner: null
    status: todo
    depends_on: [T-184, T-132]
    kind: idea
    why: >
      The person, 2026-10-17: fast mutation feedback on the changes about to be pushed, in the
      pre-push hook. A counted run fits the push tier (ADR-0051 in itos): a seed from HEAD makes it
      deterministic and --count bounds it, for example itos-cc mutation run --since @{upstream}
      --count 5. Today it is far too slow: a domain mutant runs cmd/itos-cc's whole test package,
      one hop away, about 2 to 3 minutes on CI's Linux runner. Once inprocess-mutation-tests makes
      each mutant run only the in-memory scenarios reaching its line (decision 49), measure it and
      set a budget, such as under a minute for 5 mutants, before declaring the hook. The ban on
      mutation runs over this repository's code (AGENTS.md, ADR-0040) holds until the refactor's
      proof turns mutation proof back on; this idea lifts it only for this bounded hook, with the
      person's agreement.

      The refactor's final proof (T-132) is done, but mutation proof stays off until T-46 makes the
      nightly finish and commit (docs/go.md, Quality checks), so the ban above holds until then.

      Corrected 2026-10-22 (T-184's research): a domain mutant's own tests are its package alone
      (ChooseCommand, command_policy.go:24-31), not cmd/itos-cc one hop away; one hop matters only
      to freshness. The slow case is cmd/itos-cc's own files and --all-tests.
  - id: mutation-uncovered-reuse
    title: mutation run reuses a recorded uncovered outcome as it reuses a kill
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Found by the mutation explainer's research, 2026-10-17. mutation run's help says later runs
      retry only other survivors and changed functions, but Previous.Kept
      (internal/mutants/snapshot.go:413-416) never keeps an uncovered outcome, so such sites stay
      pending and every non-strict run over the file measures coverage again just to re-mark them;
      NeedsMutationCoverage's comment calls them reusable, which holds in strict mode only. Decide
      red-first: either reuse an uncovered outcome under the same conditions as a kill (same
      function hash, same reaching tests; no less sound than reusing a kill, which also ignores
      callees), or keep the behaviour and correct the help and the comment. A public change,
      specified in mutate.feature.
  - id: mutation-sample-risk-weighted
    title: mutation sample spends its budget on the kills most likely to be stale
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Found by the mutation explainer's review, 2026-10-17. A cached kill is keyed on its function's
      text and the tests that reach the file, never on the code the function calls, so a callee
      change in another file can leave a kill that would now survive. mutation sample draws
      uniformly by seed. Weight the draw towards kills whose function's package (or the packages it
      imports in the module) changed since the kill was recorded, so a fixed --count catches stale
      kills sooner, keeping the draw deterministic for a given seed and commit. A public change of
      sample's selection, specified in mutate.feature beside MUT-71..84.
