      scenario's literals in turn (numbers stepped by a small amount, quoted words altered), run the
      scenario, and list the expectations whose change still passed: the steps or fixtures that
      cannot tell right from wrong. T-37 found one that way, a grouping fixture whose groups did not
      change with a lower threshold.
