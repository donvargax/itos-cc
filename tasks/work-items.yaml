# The work registry: who owns each phase and each piece of work, and what
# waits on what. itos work shows what can start; itos work check validates it.
# An item:
#
#   - id: T-2 # a task's ID, or a name of its own
#     title: What it is
#     phase: 1
#     owner: null # a handle, or null
#     status: todo # todo, doing, done or blocked
#     depends_on: []
phases:
  1: null # the ledger's phase 1, owned by nobody: a handle, or null
queue:
  - mutation-exceptions
items:
  - id: T-3
    title: Nightly mutation job that commits its results back even when it fails
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: T-2
    title: Tag every scenario with an ID and require the Scenarios footer
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: slice-1
    title: "mutate --since <ref>: judge only the functions changed since ref"
    phase: 1
    owner: donvargax
    status: done
    depends_on: [T-2]
    kind: slice
    refs: ["#9"]
  - id: T-4
    title: Snapshot writes at the same time pass on Windows
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: slice-2
    title: "mutate --fail-uncovered: an uncovered mutant fails the run"
    phase: 1
    owner: donvargax
    status: done
    depends_on: [slice-1]
    kind: slice
    refs: ["#9"]
  - id: slice-3
    title: mutate --json lists every mutant of each function
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: slice
    refs: ["#9"]
  - id: mutate-since-scan
    title: mutation list takes no --since, so it cannot list only the judged functions' sites
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      With --since, --scan takes its files from the range but lists every site in them, not only the
      sites of the functions --since would judge. No scenario says which it should be; listing only
      the judged functions would preview what a gate runs.
  - id: mutate-since-rename
    title: A pure rename is not in the range of mutate --since
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      git diff -U0 prints no hunk for a file renamed without a content change, so none of its
      functions is judged, and its snapshot stays at the old path under .metrics/mutate while the
      new path has none.
  - id: mutate-since-annotate
    title: mutate --since writes the summary comment of files with nothing judged
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      A file the range changed only outside functions, such as its imports, is selected with "judged
      0 of N", and mutate still writes its snapshot and rewrites its summary comment though nothing
      in it ran. The comment also counts every function the snapshot holds, while stdout counts only
      those judged.
  - id: windows-cross-vet
    title: GOOS=windows go vet ./... cannot pass off Windows
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      The tree-sitter bindings are cgo, and a cross-compiled vet turns cgo off, so every package
      that imports lang fails with "build constraints exclude all Go files"; it failed before
      slice-1 too (e1a44e4). It needs CGO_ENABLED=1 with a mingw-w64 compiler, or the vet of the
      Windows CI job is the only check.
  - id: mutation-check
    title: "mutation check: report missing, stale or failing cached results without running anything"
    phase: 1
    owner: donvargax
    status: done
    depends_on: [mutation-group]
    kind: slice
    refs: ["#8"]
  - id: mutation-exceptions
    title: "mutation except: equivalent mutants excepted in itos-cc.yaml, each with a reason"
    phase: 1
    owner: null
    status: doing
    depends_on: []
    kind: slice
    why: >
      Was mutate-exceptions.
      Issue #10: an equivalent mutant (one no test can kill because it changes no behaviour)
      survives forever. A committed file names each one with a reason, so it stops failing runs
      while staying visible; docs/CLI.md rule 38 names it as the first project setting.
    refs: ["#10"]
  - id: gate-mutation
    title: "Mutation testing for gates: mutate CI workflows and policy YAML against their self-tests"
    phase: 1
    owner: null
    status: todo
    deferred: "Parked after itos's experiment (issue #11 comment, 2026-10-07): kills came from string tests, survivors were mostly policy noise. Revisit only with the conditions listed there."
    depends_on: []
    kind: idea
    why: >
      Issue #11. Needs a deep design session before it is specified; the person will hold it with a
      different model. Do not specify it or hand it to an agent until that session has happened.
    refs: ["#11"]
  - id: T-5
    title: The nightly installs the viewer's packages, so its TypeScript is mutated too
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: task
  - id: viewer-ci-tests
    title: Push CI runs the viewer's tests and typecheck
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      ci.yml runs go vet and go test only, so a change that breaks viewer/ (vitest run, tsc
      --noEmit) passes CI and is first seen by the nightly, if at all.
  - id: viewer-source-map-js-advisory
    title: Viewer's lockfile pins source-map-js 1.2.1, which npm audit flags as high
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      npm audit in viewer/ reports GHSA-68fv-2mgg-jv7q (event-loop denial of service through indexed
      source-map section offsets) for source-map-js 1.0.0 - 1.2.1, which the lockfile pins at 1.2.1
      through vite 8.3.1's postcss and, since T-5, @vitest/coverage-v8's magicast. Found while
      adding @vitest/coverage-v8 for T-5; the version was already in the lockfile before it. It is a
      build- and test-time dependency only; npm audit fix says a fixed version is available. Raising
      it in the lockfile, in a build commit, and checking vitest run and vite build still pass would
      clear it.
  - id: mutate-unloaded-file-alone
    title: "mutate: a never-loaded file run alone counts as unmeasured, not uncovered"
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      markUncovered counts a language as measured only from the files of the run, and coverage.Build
      drops report entries that match no source, so a file the report never mentions, mutated alone
      (mutate src/unused.ts, or with --since when it is the only file changed), prints 'no coverage;
      running every mutant' instead of being uncovered, though the report measured other files of
      its language (MUT-19, MUT-48). Go fixtures do not show it, since go test reports a package
      without tests at 0%. With --fail-uncovered its mutants then run and fail as survivors rather
      than as uncovered; seen while building slice-2, not reproduced with a TypeScript or LCOV
      fixture.
    refs: ["#9"]
  - id: mutate-scan-line-order
    title: mutation list lists sites function by function, mutation run --json in line order
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      --scan lists sites unit by unit, so the sites of an inline callback (app.get("/u", (req, res)
      => ...)) come after every site of the function around it, not in line order. slice-3 sorts
      --json's "mutants" by line and column, so the two lists now differ in order where a function
      holds an inline unit.
  - id: mutate-windows-kill-tree
    title: A timed-out mutant on Windows kills the processes its tests started
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      On Windows killGroup only bounds WaitDelay: the timeout kills the test command (go test, npx,
      gradle) but not the processes it started, such as go test's test binary. A mutant that turns a
      loop infinite then keeps a core busy until the test binary's own timeout (10m for Go), slowing
      the mutants after it and leaving the worker copy undeletable. A Job object with
      JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE would kill the tree, as Setpgid does on Unix. Found writing
      ID-MUT-53, whose fixture sleeps rather than spins for this reason.
  - id: mutation-test-hash
    title: "mutation results go stale when the tests that import their file change"
    phase: 1
    owner: donvargax
    status: done
    depends_on: [mutation-check]
    kind: slice
    refs: ["#8"]
  - id: mutation-sample
    title: "mutation sample: re-run a sample of cached mutants in CI and fail on a mismatch"
    phase: 1
    owner: null
    status: done
    depends_on: [mutation-check]
    kind: slice
    refs: ["#8"]
  - id: mutation-group
    title: "mutation group: mutate becomes mutation run, --scan becomes mutation list"
    phase: 1
    owner: donvargax
    status: done
    depends_on: []
    kind: slice
    refs: ["#8"]
  - id: mutation-log-prefix
    title: "mutation run's progress lines on stderr still begin mutate:"
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      The mutate package logs 'mutate: baseline …', 'mutate: no coverage for …; running every
      mutant' and 'mutate: no mutations to test' on stderr, and ID-MUT-20 and ID-MUT-22 check two of
      them. Since mutation-group the command is mutation run, so the prefix names a command that no
      longer exists. Plain output, not the contract; changing it means deciding the new text of
      those two scenarios.
  - id: namespace-without-root
    title: A source outside any project root gets its absolute path as namespace
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Found writing the test of ID-CLI-14: mutation list x.ts (and mutate --scan before it) in a
      directory with no package.json, go.mod or .git names the function .tmp.<…>.scan.x#place, the
      directory's absolute path dotted, where a package.json beside it gives x#place. Function IDs,
      and so the cache and the debt IDs, then depend on where the checkout lives. The working
      directory could stand in for a root.
  - id: mutation-check-unrecorded-sites
    title: "mutation check: a fresh entry that lacks a site is not fully checked"
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      mutation check calls an entry fresh when its hash matches, and judges only the mutants it
      records. When a later itos-cc adds a mutation operator, a function whose text did not change
      has sites its entry never recorded, and check passes it although no run judged them (run would
      run them, as they have no kept outcome). Decide whether such a site makes the function stale
      or missing, or whether the snapshot should record the mutation rules it was made with.
    refs: ["#8"]
  - id: mutate-same-name-units
    title: "mutate: functions sharing a namespace#name share one snapshot key"
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      remembered() maps each namespace#name to the hash of the last unit with that name, so of two
      units with one name in a file (several Go init functions, Kotlin or TypeScript overloads) only
      the last can reuse its outcomes; keepUnjudged and the --since judge also key by name alone.
      mutation check matches any entry of the name with the same hash, so it calls both fresh while
      run reruns the first. Key units by name and position, or by name and hash.
  - id: mutation-test-hash-since
    title: mutation run --since drops the entries of functions not judged when their file's tests changed
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      A snapshot records the tests that import its file once per file (mutation-test-hash, q-4), so
      when they changed, a run with --since cannot keep the old outcomes of the functions it does
      not judge without calling them fresh: it drops their entries, and a later check finds them
      missing rather than stale, and loses any survivor they recorded. Recording the tests per
      function, or keeping the old entries marked stale, would keep them as stale.
  - id: viewer-stale-tests
    title: serve marks a function stale only when it changed, not when the tests that import its file did
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      The graph overlay (graph/build.go, apply) sets Unit.Stale from the function hash alone, while
      mutation run and mutation check now also treat a change to the tests recorded in the snapshot
      (mutation-test-hash) as stale. The viewer can show a kill as current that check calls stale.
  - id: flaky-kills
    title: "mutation: report a mutant whose outcome changes between runs with nothing changed"
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Tests with random inputs and no fixed seed can kill a mutant in one run and not the next, so a
      cached kill flips with no code or test change and mutation check and the planned sample mode
      cannot trust it. A run that re-runs a cached kill with the same function and tests hashes and
      gets another outcome reports it as flaky rather than trusting either outcome.
  - id: property-tests
    title: Seeded property-based tests where only the whole suite kills mutants
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      A property test imports the code it tests, so its kills are tracked by the tests' hash, unlike
      an end-to-end test's, and random inputs hit the boundaries mutants live on (> against >=, off
      by one). The first nightly left four survivors in crap.Score on *, 1 and -. Seeds are fixed so
      outcomes are reproducible under mutation (fast-check, Hypothesis and rapid take a seed; go
      test runs only a fuzz target's committed corpus).
  - id: e2e-coverage
    title: "mutation: measure coverage through an instrumented binary, so end-to-end tests count"
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Under --all-tests, code reached only by tests that run the built binary counts as uncovered:
      the first nightly had every mutant of cmd/itos-cc/crap.go uncovered. go build -cover writes
      coverage to GOCOVERDIR on each run, and go tool covdata textfmt turns it into a profile to
      merge with go test's; Node (NODE_V8_COVERAGE), coverage.py (subprocess) and JaCoCo (agent)
      have their own. Starts with Go.
  - id: test-attribution
    title: "mutation: key results by the tests that execute each function, measured per test file"
    phase: 1
    owner: null
    status: todo
    depends_on: [e2e-coverage]
    kind: idea
    why: >
      The tests' hash (q-4) records the test files that import a file, so a kill made by an
      end-to-end test, or by a test more than one import away, does not go stale when that test
      changes. Coverage measured per test file, binary-running tests included, maps which tests
      execute each function, and the hash can cover exactly those. Costs a coverage run per test
      file when some mutant has to run.
  - id: mutation-sample-scope
    title: "mutation sample: rerun each mutant with the test command that recorded it"
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      A snapshot does not record which tests decided its outcomes: the file's own, --all-tests, or a
      --test-command. mutation sample runs the file's own tests unless told otherwise, so over this
      repository's nightly snapshots (mutation run --all-tests) a kill only an end-to-end test makes
      reads as a survivor, a mutation.mismatch that is no cache error. The help and README say to
      pass the same flags; recording the scope in the snapshot would let sample take it from there,
      and let mutation run refuse to reuse kills made under another scope.
    refs: ["#8"]
  - id: nightly-runner-kill
    title: "nightly: a mutant of cmd/itos-cc kills the CI runner, so no results are ever committed"
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Nightly runs 37600315790 and 37627544105 (2026-10-07) both died with a runner shutdown signal
      at mutant 161 of 2213, right after cmd/itos-cc/main.go:133, and the commit step was skipped.
      Likely a mutant in or near cmd/itos-cc main.go run/runGroup whose tests fork without end, eat
      memory, or signal every process. The same mutant could take down a developer's machine, so on
      the person's word (2026-10-07) the investigation waits for a way to run mutation testing of
      this repository inside a container. Then: find the mutant, cap each mutant's resources, and
      save results as the run goes, so a killed run keeps what it finished.
    refs: ["#8"]
  - id: mutation-annotate-excepted
    title: mutation run's summary comment lists an excepted survivor as survived
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Found building mutation-exceptions (#10). The summary comment mutation run keeps at the end of
      each source file is built from the snapshot alone, which records an excepted survivor as
      survived (so mutation sample needs nothing new). So the comment still says '1 survived' and
      lists the excepted mutant, while mutation run's summary counts it excepted and fails nothing:
      a reader of the file sees a survivor to kill that itos-cc.yaml already explains. The comment
      could count excepted survivors apart, only where there is one as the summary line does, and
      list each with its reason.
    refs: ["#10"]
