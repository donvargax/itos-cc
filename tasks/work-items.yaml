  - id: layered-settings
    title: Settings read from flags, environment and files in layers, as pydantic-settings does
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      The person, 2026-10-20: likes how pydantic-settings reads one typed model from many sources
      with CLI support; not a hard requirement. docs/CLI.md rules 34-35 already ask for flag, then
      environment, then config, with ITOS_CC_ variables, but itos-cc reads no variables of its own
      and keeps mutation.exceptions and mutation.tests file-only on purpose (rule 38's note). The
      kong fork (v1.16.2-itos.1) layers per flag only: env tags, DefaultEnvars(prefix),
      Configuration(loader, paths...) and the Resolver interface; it cannot load itos-cc.yaml's
      nested values. Closest Go library for the whole model: knadh/koanf (file, env, flag providers,
      merge order, decode to a struct; validation separate); viper avoided (global state, key case
      folding). Shape: a layered config adapter behind the settings ports T-147 introduced
      (selection's SettingsReader, mutation's), the domain unchanged, plus a kong Resolver over it
      for flag values; a fork change only for naming which source a bad value came from. Needs a
      library selection recorded, scenarios for precedence and errors naming their source, and the
      person's call on whether exceptions and tests stay file-only. After T-86.

      Scope settled with the person, 2026-10-20: what is judged lives in the commit, how it runs on
      a machine may layer. Layer only operational settings (worker count, timeout factors, output
      format, colour, cache locations): flag, then environment (ITOS_CC_), then itos-cc.yaml, then a
      user-level file. Keep exclude, mutation.exceptions and mutation.tests file-only: exceptions
      are reviewed with the code they excuse, go stale by hash and are written back by mutation
      except; recorded outcomes' freshness depends on the tests' commands and support globs
      (ADR-0011, ADR-0013), and a per-machine variation already fits in plain sight in the committed
      shell strings ('$GOTESTFLAGS'); exclude decides what is measured at all, so an override could
      skip files in CI. mutation run --count reads HEAD's file, so a commit's verdict stays the same
      on every machine. docs/CLI.md rules 34-35's note gains a sentence saying exclude is file-only
      too, for the same reason.
