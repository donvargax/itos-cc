      linked to the already recorded accepted behavior changes, not an allow-anything branch.
      Namespace changes remain outside any blanket allowance. Do not substitute a separate toy
      validator for these controls, or run own-source mutation, change product flags or compare
      binaries per refactor task. This prepares the later proof: settle its concrete final
      manifest/platform scope after T-116 as already required.

      T-89 moves command observations and provenance behind Toolchain, Fingerprints and Reach.
      Compare every MUT07 setup row and its actual reported command, including absent versus
      installed Vitest/Jest, package scripts, Python pytest versus unittest, shell override without
      an unused product probe, last-existing .venv/venv command interpreter versus first-existing
      coverage interpreter, nested caller cwd for the pytest probe, and actual editable PYTHONPATH
      with copied source before the inherited live-install path. Include ordinary optional
      malformed/absent manifest and failed-probe fallbacks, per-run GOWORK=off and Python auto-load
      environment fingerprints, and strict external replacement refusal without dependency reads.
      These are final baseline-characterized comparisons, not an intentional-difference allowance or
      a per-task binary comparison.

      T-90 binds mutation's per-test measurement and static executable inventory through the
      coverage capability. Compare actual harness-split versus once-per-listed-ID fallback runs, IDs
      reaching distinct lines, a failed Go conversion beside valid sibling-language/ID evidence, a
      failed collector that leaves report bytes, and unloaded Python/TypeScript functions including
      an explicitly empty inventory, an unavailable collector and a failed inventory command.
      Include subprocess integration filtering against the in-process inventory, missing c8 only for
      built-in collection, and named/existing reports retaining good siblings beside an unreadable
      report. Preserve actual commands, diagnostics, statuses and original artifacts under the
      existing bounded-volatility rules; this adds no intentional difference or per-task binary
      comparison.

      T-91 routes actual history observations through the bound History. Compare --since with a
      missing ref and outside Git, divergent branches using ref...HEAD, caller-subdirectory
      namespaces and committed HEAD bytes despite uncommitted edits, unchanged renames and renamed
      edits, pure deletions and same-name Kept hashes. Include deleted-file exceptions with and
      without explicit paths, repository-wide committed and staged working rename snapshot retention
      versus an untracked move, actual HEAD default sample seed and explicit-seed bypass. Preserve
      statuses, diagnostics, map direction and original artifacts; no new intentional difference or
      per-task binary comparison.

      T-92 moves ordinary mutation Run orchestration behind its bound model-valued ports. In the
      final whole-refactor comparison, include a real worker error after work has started and a
      listed-selection fail-fast run with held peers, retaining truthful partial outcomes and
      join-before-input-release evidence. Compare a configured coverage command without an explicit
      report in ordinary best-effort Run, both with pending sites and with fully reused outcomes:
      retain the existing fallback diagnostic and continued trials for ordinary measurement failure,
      lazy absence of unnecessary listing/measurement on reuse, strict coverage refusal, and the
      distinct fatal tests.list-failed policy. Include failed configured listing combined with a
      coverage command lacking a report: listing still happens first and its failure remains fatal;
      successful listing retains its diagnostic and ID/file inventory before the coverage fallback.
      Include snapshot publication failure before moved-key removal or annotation, and Sample
      listed-scope, baseline-failure, read-only and stable-seed neighbors affected by the shared
      scheduler extraction. Preserve raw streams, process/shell statuses and artifacts under the
      existing controlled-input and bounded-volatility rules. These are baseline-characterized
      equality cases, with no new intentional-difference allowance and no per-task binary comparison
      or proof implementation now.

      T-93 (Move mutation check and list orchestration behind the domain boundary): compare mutation
      list over an earlier valid source followed by a source that cannot be read or parsed, in plain
      and JSON modes, retaining the same ordered prefix before the failure. Contrast mutation check
      over mixed valid/later-failing sources and ordinary or strict evidence admission: no earlier
      formatted checks are presented before all admission succeeds. Include supported native
      store-relative snapshot names, POSIX literal-backslash names, permissive orphan file metadata
      versus malformed full snapshots, and agreeing absolute recorded sources outside the root,
      preserving actual platform limitations rather than claiming skipped cases ran. Check/list
      remain read-only on success and failure. The comparison follows the existing final
      case/platform manifest and runs once after all current refactor and adoption-gate source
      changes, before either S10 exit-code feature; do not compare binaries per task.
