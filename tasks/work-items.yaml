      comparison on tiny captured-evidence fixtures: identical stdout/stderr/status/artifact bytes
      pass, while independent changes to each stream, exit status, snapshot bytes/field order and
      nil-versus-empty populations fail. A bounded volatile field is accepted only at its declared
