    status: todo
    depends_on: []
    kind: idea
    why: >
      Found building mutation-exceptions (#10). The summary comment mutation run keeps at the end of
      each source file is built from the snapshot alone, which records an excepted survivor as
      survived (so mutation sample needs nothing new). So the comment still says '1 survived' and
      lists the excepted mutant, while mutation run's summary counts it excepted and fails nothing:
      a reader of the file sees a survivor to kill that itos-cc.yaml already explains. The comment
      could count excepted survivors apart, only where there is one as the summary line does, and
      list each with its reason.
    refs: ["#10"]
  - id: mutation-exceptions-deleted-file
    title: an exception for a file that is gone never goes stale
