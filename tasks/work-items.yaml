  - id: step-strictness-check
    title: Automate checking that a converted feature file's steps can fail
    phase: 1
    owner: null
    status: todo
    depends_on: []
    kind: idea
    why: >
      Moving a command step 8 asks that each step of a converted feature file be seen to fail with
      its expectation changed. T-37 did this by hand with a scratch script: it changed one number,
      quoted text, docstring line or table phrase of dry.feature at a time, ran that scenario alone,
      and expected a failure (37 changes), plus 11 edits to steps with no value to change. Every
