# git-cliff's part of a release's notes (tools/bin/release-notes): the range's commits, grouped
# by type, each with its short SHA linked to this project's repository. Run by tools/bin/pinned at
# the version pinned there, with --strip all: the notes' title, their Upgrading section and
# everything else are tools/bin/release-notes'. Harvested with the owner's permission
# (CONTRIBUTORS.md) from itos-template's tools/bin/release-notes/cliff.toml (its T-5), which took
# it from itos's, its groups and their order kept.

[changelog]
body = """
{%- set repository = "donvargax/itos-cc" -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }} \
  ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/{{ repository }}/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
sort_commits = "oldest"
topo_order = false
commit_parsers = [
	{ message = "^feat", group = "<!-- 00 -->Features" },
	{ message = "^fix", group = "<!-- 01 -->Fixes" },
	{ message = "^perf", group = "<!-- 02 -->Performance" },
	{ message = "^refactor", group = "<!-- 03 -->Refactoring" },
	{ message = "^test", group = "<!-- 04 -->Tests" },
	{ message = "^build", group = "<!-- 05 -->Build" },
	{ message = "^ci", group = "<!-- 06 -->CI" },
	{ message = "^docs", group = "<!-- 07 -->Documentation" },
	{ message = "^chore", group = "<!-- 08 -->Chores" },
	{ message = "^style", group = "<!-- 09 -->Style" },
	{ message = "^[Rr]evert", group = "<!-- 10 -->Reverts" },
	{ message = ".*", group = "<!-- 11 -->Other" },
]
